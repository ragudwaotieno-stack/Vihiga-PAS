name: Build SPMS Android APK

# The APK is a thin shell that opens the live site, so ordinary updates to
# index.html reach phones without a new APK. Build a new APK only when the
# native side changes (icons, plugins, permissions, this file).
on:
  push:
    branches:
      - test/ao-progress-map
    paths:
      - 'icons/**'
      - 'spms-native-bridge.js'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SPMS_LIVE_URL: https://ragudwaotieno-stack.github.io/Vihiga-PAS/

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get SPMS source (working branch)
        uses: actions/checkout@v4
        with:
          ref: test/ao-progress-map

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files (offline fallback copy)
        shell: bash
        run: |
          mkdir -p www
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|android/*|www/*|.git/*|assets/*)
                continue ;;
            esac
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done < <(git ls-files -z)
          test -f www/index.html
          test -f www/spms-native-bridge.js
          grep -q 'spms-native-bridge.js' www/index.html

      - name: Configure Capacitor (load the live site)
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npm install @capgo/capacitor-printer@7 @capacitor/filesystem@7 @capacitor/share@7

          npx cap init "Vihiga SPMS" "ke.go.vihiga.spms" --web-dir www

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const url = process.env.SPMS_LIVE_URL;
          const host = new URL(url).host;
          if (config.plugins && config.plugins.SystemBars) delete config.plugins.SystemBars;
          config.android = { ...(config.android ?? {}), adjustMarginsForEdgeToEdge: 'force' };
          config.server = { url, allowNavigation: [host], cleartext: false };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log(fs.readFileSync(path, 'utf8'));
          NODE

      - name: Create Android project
        run: npx cap add android

      - name: Generate Vihiga Android launcher icons
        run: |
          npm install --save-dev @capacitor/assets@3 sharp
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('icons/icon-512.png')
            .resize(1024, 1024, { fit: 'contain', background: '#ffffff' })
            .png().toFile('assets/icon.png');
          NODE
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF'

      - name: Build release APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK with the SPMS release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spms.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/spms.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out Vihiga-SPMS.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs Vihiga-SPMS.apk | head -3
          rm -f "$RUNNER_TEMP/spms.jks"

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Vihiga-SPMS-APK
          path: Vihiga-SPMS.apk
          if-no-files-found: error
