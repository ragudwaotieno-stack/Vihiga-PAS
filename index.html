<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Staff Performance Appraisal System — County Government of Vihiga</title>
<style>
  :root{ color-scheme: light; }
  html{ color-scheme: light; }
  :root{
    --ink:#0F3D2E; --paper:#FAF7F0; --paperDeep:#F1ECE0; --gold:#B8862B; --goldSoft:#DCC38A;
    --brown:#FDF3DD; --brownBorder:#E7CE9B; --line:#D9D2C0; --text:#26241C; --muted:#6B6553; --danger:#A33B2A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
  input,textarea,select,button{font-family:inherit;font-size:13.5px;color-scheme:light}
  input[type=text],input[type=password],input[type=date],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#ffffff!important;color:#26241C!important;
  }
  textarea{resize:vertical}
  input:disabled,textarea:disabled{background:var(--brown)!important;border-color:var(--brownBorder)!important;color:var(--muted)!important}
  label.field-label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
  .btn{border:none;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px;padding:9px 16px}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn:disabled{opacity:.5;cursor:default}
  .link-btn{background:none;border:none;cursor:pointer;font-weight:600;font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:12.8px}
  th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .muted{color:var(--muted);font-size:13px;padding:10px 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
  .card-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--paperDeep);gap:12px;flex-wrap:wrap}
  .card-title{font-family:Georgia,serif;font-size:16.5px;color:var(--ink)}
  .card-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .card-body{padding:20px}
  .topbar{background:var(--ink);color:var(--paper)}
  .topbar-inner{max-width:1120px;margin:0 auto;padding:14px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
  .brand-title{font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:.3px}
  .brand-sub{font-size:12px;opacity:.75;margin-top:2px}
  .who{text-align:right;font-size:12px;opacity:.9;padding-bottom:4px}
  .who .name{font-weight:600}
  .who .desig{opacity:.75}
  .logout-btn{margin-top:4px;background:transparent;border:1px solid var(--goldSoft);color:var(--goldSoft);border-radius:6px;padding:3px 10px;font-size:11.5px;cursor:pointer}
  nav.tabs{max-width:1120px;margin:0 auto;padding:12px 20px 0;display:flex;gap:4px;flex-wrap:wrap}
  nav.tabs button{padding:9px 16px;font-size:13.5px;font-weight:600;border:none;border-bottom:3px solid transparent;background:transparent;color:rgba(255,255,255,.65);cursor:pointer}
  nav.tabs button.active{border-bottom:3px solid var(--gold);color:#fff}
  main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
  .pill{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text)}
  .pill.active{border-color:var(--ink);background:var(--ink);color:#fff}
  .staff-header{background:var(--brown);border:1px solid var(--brownBorder);border-radius:10px;padding:14px 18px;margin-bottom:18px;display:flex;gap:28px;flex-wrap:wrap;font-size:12.5px}
  .flash{position:fixed;top:14px;right:14px;z-index:50;padding:10px 16px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .flash.ok{background:#E7F2EA;border:1px solid var(--ink);color:var(--ink)}
  .flash.err{background:#FBE7E2;border:1px solid var(--danger);color:var(--danger)}
  .login-wrap{min-height:100vh;background:linear-gradient(180deg,var(--ink) 0,var(--ink) 220px,var(--paper) 220px)}
  .login-inner{max-width:420px;margin:0 auto;padding-top:46px;display:flex;flex-direction:column;align-items:center}
  .badge{width:46px;height:46px;border-radius:50%;border:2px solid var(--goldSoft);display:flex;align-items:center;justify-content:center;color:var(--goldSoft);font-family:Georgia,serif;font-size:18px;margin-bottom:14px}
  .login-title{color:#fff;font-family:Georgia,'Times New Roman',serif;font-size:22px;text-align:center}
  .login-sub{color:rgba(255,255,255,.7);font-size:12.5px;text-align:center;margin-top:6px;line-height:1.5}
  form.login-card{background:#fff;width:100%;margin-top:34px;border-radius:10px;padding:26px 24px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
  .login-err{color:var(--danger);font-size:12.5px;margin-top:10px}
  .login-hint{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
  .login-foot{color:rgba(255,255,255,.45);font-size:11px;margin-top:22px;text-align:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}}
  .checks{display:flex;align-items:center;gap:18px;padding-top:22px;flex-wrap:wrap}
  .checks label{display:flex;align-items:center;gap:6px;font-size:13px}
  .date-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;font-size:12.5px;flex-wrap:wrap}
  .date-row label{display:flex;align-items:center;gap:5px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .x-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px}
  .status-note{background:var(--paperDeep);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--text);margin:0 0 16px}
  .status-note.ok{background:#E7F2EA;border-color:var(--ink)}
  .status-note.warn{background:#FBE7E2;border-color:var(--danger);color:var(--danger)}
  .pass-wrap{position:relative}
  .pass-toggle{position:absolute;right:8px;top:8px;background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted);font-weight:600}
  .rating-auto{font-size:12px}
  .rating-auto .band{font-weight:600}
  .rating-auto .pct{color:var(--muted);font-weight:400}
  .rating-auto .label{font-size:10.5px;color:var(--muted)}
  .rating-legend{font-size:11px;color:var(--muted);margin-top:6px}
  .col-locked-appraisee{background:#f0e6d2!important}
  .col-locked-appraisee:disabled{background:#f0e6d2!important;-webkit-text-fill-color:#6b5a3a;opacity:1}
  #printArea{display:none}
  .print-header{display:none;text-align:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
  .print-header img{width:52px;height:auto;margin:6px auto;display:block}
  .print-header-line1{font-family:Georgia,serif;font-size:16px;font-weight:700;color:var(--ink);text-align:center}
  .print-header-line2{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--ink);text-align:center}
  .print-header p{font-size:12px;color:var(--muted);margin:4px 0 0;text-align:center}
  .print-section-break{page-break-before:always}
  @media print{
    body > *:not(#printArea){display:none!important}
    #printArea{display:block!important}
    .print-header{display:block!important}
    .card{border:1px solid #999!important;box-shadow:none!important;break-inside:avoid;margin-bottom:14px!important}
    .card-head{background:#eee!important}
    button, .btn, .row-actions, .pill, .x-remove, input[type=checkbox], .pass-toggle{display:none!important}
    input, textarea, select{border:none!important;background:none!important;color:#000!important;-webkit-appearance:none}
  }
</style>
</head>

<div id="app"></div>
<div id="printArea"></div>

/* ============================================================================
   BACKEND ADAPTER — write-through cache over Supabase
   ============================================================================
   getData(key, fallback) / setData(key, value) keep their EXACT original
   synchronous signature. Every call site elsewhere in this file (there are
   hundreds) is completely unaware anything changed. This is the ONLY section
   that would need to change for a different backend (self-hosted Supabase,
   PocketBase, a custom API, etc.) — everything below this block is agnostic
   to where the data actually lives.

   How it works:
   - On login, hydrateCache() fetches everything this user is allowed to see
     (RLS-scoped) into an in-memory CACHE object, keyed exactly like the old
     localStorage keys were.
   - getData() reads CACHE synchronously — instant, same as before.
   - setData() writes CACHE synchronously (so the UI sees it immediately) AND
     queues a background save to Supabase. The caller never waits on the
     network call.
   - Known trade-off: two people editing the exact same field at the exact
     same instant could have one save overwrite the other. This is no worse
     than the risk already inherent in the app's save-then-navigate pattern.
   ============================================================================ */

const SUPABASE_URL = "https://ufqwhnutbkeoviqsygfn.supabase.co";
const SUPABASE_KEY = "sb_publishable_irevoMWXidqNXc8TJTfTJg_JCeOml71";
var sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

let CACHE = {};                 // mirrors the old localStorage keyspace, in memory
let USERNAME_TO_ID = {};        // username -> Supabase profiles.id (uuid)
let ID_TO_USERNAME = {};        // profiles.id -> username
const SYNTHETIC_EMAIL_DOMAIN = "vihiga-pas.internal";
function emailFor(username){ return `${username}@${SYNTHETIC_EMAIL_DOMAIN}`; }

function getData(key, fallback=null){
  if(Object.prototype.hasOwnProperty.call(CACHE, key)) return CACHE[key];
  return fallback;
}
function setData(key, value){
  if(FY !== CURRENT_FY){
    showFlash(`You're viewing FY ${FY} (read-only). Switch to the current year (${CURRENT_FY}) to make changes.`, "err");
    return false;
  }
  CACHE[key] = value;
  queueBackgroundSave(key, value);
  return true;
}

/* ---- background save queue: fire-and-forget, doesn't block the UI ---- */
let saveQueue = [];
let saveQueueTimer = null;
function queueBackgroundSave(key, value){
  saveQueue.push({key, value});
  if(saveQueueTimer) return;
  saveQueueTimer = setTimeout(flushSaveQueue, 150);
}
async function flushSaveQueue(){
  const batch = saveQueue; saveQueue = []; saveQueueTimer = null;
  for(const {key, value} of batch){
    try{ await persistKeyToSupabase(key, value); }
    catch(e){ console.error("Background save failed for", key, e); }
  }
}

/* ---- key parsing: translates the old localStorage-style keys into table ops ---- */
function idFor(username){ return USERNAME_TO_ID[username] || username; }

async function persistKeyToSupabase(key, value){
  if(!sb) return; // no live backend configured (e.g. running the old offline prototype)
  let m;

  if(key === "users"){ return; } // profiles are written individually elsewhere, not as one blob
  if(key === "revision_requests"){
    await sb.from("revision_requests").delete().neq("id", "00000000-0000-0000-0000-000000000000");
    if(value && value.length) await sb.from("revision_requests").upsert(value.map(r=>({
      id: r.id, user_id: idFor(r.username), supervisor_id: idFor(r.supervisorUsername), reason: r.reason,
      status: r.status, created_at: r.createdAt, supervisor_action_at: r.supervisorActionAt,
      supervisor_comment: r.supervisorComment, admin_action_at: r.adminActionAt
    })));
    return;
  }
  if(key === "password_reset_requests"){
    const rows = Object.entries(value||{}).map(([uname,v])=>({
      user_id: idFor(uname), requested_at: v.requestedAt, status: v.status

      signed_by: value.signedBy && idFor(value.signedBy), signed_at: value.signedAt
    }, {onConflict:"user_id,fy"});
    return;
  }
  if((m = key.match(/^section9_(.+)_(.+)$/))){
    const [,uname,fy] = m;
    await sb.from("section9").upsert({
      user_id: idFor(uname), fy, reward_type: value.rewardType, other_interventions: value.otherInterventions,
      sanction: value.sanction, minute_no: value.minuteNo, meeting_date: value.meetingDate || null,

    }, {onConflict:"user_id,fy"});

  }
  if((m = key.match(/^windows_(.+)_(.+)$/))){
    const [,uname,fy] = m;
    await sb.from("review_windows").upsert({
      user_id: idFor(uname), fy, mid_year: value.midYear, annual: value.annual,
      q1: value.Q1, q2: value.Q2, q3: value.Q3, q4: value.Q4
    }, {onConflict:"user_id,fy"});
    return;
  }
  if((m = key.match(/^forwarding_(halfyear|annual)_(.+)_(.+)$/))){
    const [,packageType,uname,fy] = m;
    await sb.from("forwarding").upsert({
      user_id: idFor(uname), fy, package_type: packageType, status: value.status,
      current_holder: value.currentHolder && idFor(value.currentHolder), current_holder_name: value.currentHolderName, department: value.department,
      appraisee_name: value.appraiseeName, appraisee_designation: value.appraiseeDesignation, appraisee_personal_no: value.appraiseePersonalNo,
      at_cprc_date: value.atCPRCDate, return_to: value.returnTo && idFor(value.returnTo),
      returned_at: value.returnedAt, hops: (value.hops||[]).map(h=>({...h, by: idFor(h.by)}))
    }, {onConflict:"user_id,fy,package_type"});
    return;
  }
  if((m = key.match(/^evidence_(halfyear|annual)_(.+)_(.+)$/))){
    const [,packageType,uname,fy] = m;
    await sb.from("evidence_files").delete().eq("user_id", idFor(uname)).eq("fy", fy).eq("package_type", packageType);
    const files = (value.files||[]);
    if(files.length){
      for(const f of files){
        const path = `${idFor(uname)}/${fy}/${packageType}/${f.name}`;
        if(f.dataUrl && f.dataUrl.startsWith("data:")){
          const blob = await (await fetch(f.dataUrl)).blob();
          await sb.storage.from("evidence").upload(path, blob, {upsert:true});
        }
        await sb.from("evidence_files").insert({
          user_id: idFor(uname), fy, package_type: packageType, file_name: f.name,
          storage_path: path, size_bytes: f.size, uploaded_at: f.uploadedAt
        });
      }
    }
    return;
  }
  console.warn("No Supabase mapping for key:", key);
}

const RATING_BANDS = [
  { min:100.0001, rating:5, label:"Exceptional" },
  { min:85,       rating:4, label:"Very Good" },
  { min:65,       rating:3, label:"Good" },
  { min:50,       rating:2, label:"Fair" },
  { min:0,        rating:1, label:"Poor" },
];
function calcRating(targetStr, achStr){
  const t = parseFloat(targetStr), a = parseFloat(achStr);
  if(isNaN(t) || isNaN(a) || t<=0) return null;
  const pct = (a/t)*100;
  const band = RATING_BANDS.find(b=>pct>=b.min) || RATING_BANDS[RATING_BANDS.length-1];
  return { pct: Math.round(pct*10)/10, rating: band.rating, label: band.label };
}

/* --------------------------------- top bar -------------------------------- */
function getAppraiseeReturnCounts(){
  let plan = 0, achievements = 0;
  const windows = getWindows(SESSION);

  const p = getData(planKeyFor(SESSION), {status:"draft", rejectionComment:""});
  if(p.status==="draft" && p.rejectionComment) plan++;

  // Mid-Year and Annual Review: count once whether the trigger is a return
  // (rejectionComment) or a freshly-opened window the appraisee hasn't yet
  // signed for — a return always reopens the window too, so checking both
  // conditions separately would double-count the same underlying item.
  const my = getData(midyearKeyFor(SESSION), null);
  if((my && my.rejectionComment) || (windows.midYear==="open" && (!my || !my.appraiseeSignedAt))) plan++;

  const ar = getData(annualReviewKeyFor(SESSION), null);
  if((ar && ar.rejectionComment) || (windows.annual==="open" && (!ar || !ar.appraiseeSignedAt))) plan++;

  const qt = getData(qtargetingKeyFor(SESSION), {status:"not_available", rejectionComment:""});
  if(qt.status==="draft" && qt.rejectionComment) achievements++;

  const ach = getData(achKeyFor(SESSION), {});
  QUARTERS.forEach(q=>{
    const qd = ach[q];
    if((qd && qd.rejectionComment) || (windows[q]==="open" && (!qd || !qd.submittedAt))) achievements++;
  });

  return {plan, achievements};
}

function midyearKeyFor(username){ return `midyear_${username}_${FY}`; }

function autoFillFromCumulative(rows, username, quarter, field){
  // fills a row's field from Form 1A's cumulative achievement for that quarter, but only
  // while the field is still blank — once someone types their own text there, this stops
  // touching it, so it never overwrites a manual edit.
  let changed = false;
  rows.forEach(r=>{
    if(!r[field]){
      const cum = computeCumulative(username, r.id, quarter);
      if(cum!==null){ r[field] = String(cum); changed = true; }
    }
  });
  return changed;
}
function reconcileRowsWithSource(existingRows, sourceItems, mapFn){
  // merges rows against the current source (plan activities / annual targets), keeping any
  // already-entered data for rows that still match, and adding rows for anything new in the
  // source that isn't reflected yet. Never drops an existing row, even if its source item is
  // gone, so in-progress work is never destroyed by this reconciliation.
  const byId = new Map(existingRows.map(r=>[r.id, r]));
  const merged = sourceItems.map(item=>{
    const existing = byId.get(item.id);
    if(existing) return {...existing, activity:item.activity, indicator:item.indicator};
    return mapFn(item);
  });
  const sourceIds = new Set(sourceItems.map(i=>i.id));
  const orphaned = existingRows.filter(r=>!sourceIds.has(r.id));
  return [...merged, ...orphaned];
}
function ensureMidyearRecord(username, planActivities){
  let rec = getData(midyearKeyFor(username), null);
  if(!rec){
    rec = { rows: planActivities.map(a=>({id:a.id, activity:a.activity, indicator:a.indicator, changeTag:"unchanged", remarks:""})),
      appraiseeSignedBy:null, appraiseeSignedAt:null, supervisorSignedBy:null, supervisorSignedAt:null };
    setData(midyearKeyFor(username), rec);
  } else if(planActivities.length > 0){
    const merged = reconcileRowsWithSource(rec.rows, planActivities, a=>({id:a.id, activity:a.activity, indicator:a.indicator, changeTag:"unchanged", remarks:""}));
    const rowsChanged = merged.length !== rec.rows.length || merged.some((r,i)=> rec.rows[i] && (r.activity!==rec.rows[i].activity || r.indicator!==rec.rows[i].indicator));
    if(rowsChanged){ rec.rows = merged; }
  }
  const autoFilled = autoFillFromCumulative(rec.rows, username, "Q2", "remarks");
  setData(midyearKeyFor(username), rec);
  midyearCache = { username, rec };
  return rec;
}

  // targets are then set directly on Form 1A's own targeting screen, same as

function onMidyearField(username, rowId, field, val){

  if(!r) return;
  r[field] = val;
  debounceSave(persistMidyear);
  markDirty("midyear");

  // 1A's Q3/Q4 (and any other quarter) tables reflect the mid-year edit —
  // they read activity/indicator text from the Annual Plan, not from this
  // mid-year record, which otherwise never reaches them.
  if(field==="activity" || field==="indicator"){
    const plan = getData(planKeyFor(username), {activities:[]});

function annualReviewKeyFor(username){ return `annualreview_${username}_${FY}`; }

function getEffectiveAnnualTargets(username){
  const plan = getData(planKeyFor(username), {activities:[]});
  const myRec = getData(midyearKeyFor(username), null);
  if(midyearFinalized(myRec) && midyearHasChanges(myRec, plan.activities)){
    return myRec.rows.map(r=>({id:r.id, activity:r.activity, indicator:r.indicator}));
  }
  return plan.activities.map(a=>({id:a.id, activity:a.activity, indicator:a.indicator}));
}
function ensureAnnualReviewRecord(username){
  let rec = getData(annualReviewKeyFor(username), null);
  const targets = getEffectiveAnnualTargets(username);
  if(!rec){
    rec = { rows: targets.map(t=>({id:t.id, activity:t.activity, indicator:t.indicator, achievedResults:"", appraiseeScore:"", supervisorScore:"", agreedScore:""})),
      appraiseeSignedBy:null, appraiseeSignedAt:null, supervisorSignedBy:null, supervisorSignedAt:null };
    setData(annualReviewKeyFor(username), rec);
  } else if(targets.length > 0){
    const merged = reconcileRowsWithSource(rec.rows, targets, t=>({id:t.id, activity:t.activity, indicator:t.indicator, achievedResults:"", appraiseeScore:"", supervisorScore:"", agreedScore:""}));
    const rowsChanged = merged.length !== rec.rows.length || merged.some((r,i)=> rec.rows[i] && (r.activity!==rec.rows[i].activity || r.indicator!==rec.rows[i].indicator));
    if(rowsChanged){ rec.rows = merged; }
  }

  setData(annualReviewKeyFor(username), rec);

/* ==================== RELAY / FORWARDING TO CPRC (per-officer conveying chain) ==================== */
const PACKAGE_TYPES = { halfyear: { label:"Half-Year", noun:"half-year package" }, annual: { label:"Annual", noun:"annual package" } };
function forwardingKeyFor(username, packageType){ return `forwarding_${packageType}_${username}_${FY}`; }
function initForwarding(username, packageType, reviewingSupervisor){
  let fwd = getData(forwardingKeyFor(username, packageType), null);
  if(fwd) return fwd; // already started, don't reset
  const owner = USERS[username] || {};
  fwd = { status:"in_transit", currentHolder: reviewingSupervisor, currentHolderName: USERS[reviewingSupervisor]?.name || reviewingSupervisor, hops: [], atCPRCDate: null, department: owner.department || "", appraiseeName: owner.name || username, appraiseeDesignation: owner.designation || "", appraiseePersonalNo: owner.personalNo || "" };
  setData(forwardingKeyFor(username, packageType), fwd);
  return fwd;
}
function getForwarding(username, packageType){ return getData(forwardingKeyFor(username, packageType), null); }
function forwardOne(username, packageType, me){
  const fwd = getForwarding(username, packageType);
  if(!fwd || fwd.status!=="in_transit" || fwd.currentHolder!==SESSION) return false;
  if(me.isAuthorizedOfficer){
    fwd.hops.push({by:SESSION, byName:me.name, at:todayISO(), action:"Submitted to CPRC"});
    fwd.status = "at_cprc";
    fwd.atCPRCDate = todayISO();
    fwd.currentHolder = null;
    fwd.currentHolderName = null;
    fwd.returnTo = SESSION;
  } else {
    const next = me.supervisorUsername;
    if(!next || !USERS[next]) return "no-supervisor";
    fwd.hops.push({by:SESSION, byName:me.name, at:todayISO(), action:`Forwarded to ${USERS[next].name}`});
    fwd.currentHolder = next;
    fwd.currentHolderName = USERS[next].name;
  }
  setData(forwardingKeyFor(username, packageType), fwd);
  return true;
}
function onForwardOrSubmit(username, packageType){
  const me = USERS[SESSION];
  const fwdBefore = getForwarding(username, packageType);
  const displayName = (fwdBefore && fwdBefore.appraiseeName) || USERS[username]?.name || username;
  const result = forwardOne(username, packageType, me);
  if(result==="no-supervisor"){
    showFlash("No further supervisor is defined above you — ask an admin to set one, or mark this account as CS/AO if you're meant to submit straight to CPRC.", "err");
    return;
  }
  if(!result) return;
  showFlash(me.isAuthorizedOfficer ? `${displayName}'s ${PACKAGE_TYPES[packageType].noun} submitted to CPRC.` : `Forwarded ${displayName}'s ${PACKAGE_TYPES[packageType].noun} onward.`);
  renderView(USERS[SESSION]);
}
let relaySelection = new Set(); // holds "packageType:username" composite keys
function relayKey(packageType, uname){ return packageType+":"+uname; }
function toggleRelaySelection(key, checked){
  if(checked) relaySelection.add(key); else relaySelection.delete(key);
}
function toggleRelaySelectAll(checked, keys){
  keys.forEach(k=>{ if(checked) relaySelection.add(k); else relaySelection.delete(k); });

function onForwardSelected(packageType){
  const me = USERS[SESSION];
  const keys = [...relaySelection].filter(k=>k.startsWith(packageType+":"));
  if(keys.length===0){ showFlash("Select at least one officer first.", "err"); return; }
  let moved = 0, blocked = false;
  keys.forEach(k=>{
    const uname = k.slice(packageType.length+1);
    const r = forwardOne(uname, packageType, me);
    if(r==="no-supervisor") blocked = true;
    else if(r){ moved++; relaySelection.delete(k); }
  });
  if(moved>0) showFlash(me.isAuthorizedOfficer ? `${moved} ${PACKAGE_TYPES[packageType].noun}(s) submitted to CPRC.` : `${moved} ${PACKAGE_TYPES[packageType].noun}(s) forwarded onward.`);

}

    QUARTERS.forEach(q=>{
      if(windows[q] !== "open") return;
      const qAch = ach[q]; const qCo = co[q];
      if(qAch && qAch.submittedAt && (!qCo || !qCo.reviewedDate)) items.push({uname, formView:"form1a", label:`${u.name} — ${QLABEL[q]} report awaiting your review`});
    });
    if(windows.midYear !== "not_open"){
      const my = getData(midyearKeyFor(uname), null);
      if(my && my.appraiseeSignedAt && !my.supervisorSignedAt) items.push({uname, formView:"form1b", label:`${u.name} — Mid-Year Review awaiting your co-sign`});
    }
    if(windows.annual !== "not_open"){
      const ar = getData(annualReviewKeyFor(uname), null);
      if(ar && ar.appraiseeSignedAt && !ar.supervisorSignedAt) items.push({uname, formView:"form1b", label:`${u.name} — Annual Appraisal Report awaiting your co-sign`});
    }
    const activeRevision = getData("revision_requests", []).find(r=>r.username===uname && r.status==="pending_supervisor");
    if(activeRevision) items.push({uname, formView:"form1b", label:`${u.name} — requesting a change to their Annual Plan`});
  });
  return items;
}

function evidenceKeyFor(username, packageType){ return `evidence_${packageType}_${username}_${FY}`; }
function getEvidence(username, packageType){ return getData(evidenceKeyFor(username, packageType), {files:[]}); }
const EVIDENCE_MAX_FILES = 15;
const EVIDENCE_MAX_BYTES = 500*1024;
function onEvidenceFileSelected(packageType, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(file.size > EVIDENCE_MAX_BYTES){
    showFlash(`"${file.name}" is too large (${Math.round(file.size/1024)}KB) — evidence files must stay under ${Math.round(EVIDENCE_MAX_BYTES/1024)}KB, since this is stored in the browser, not a server.`, "err");
    inputEl.value = "";
    return;
  }
  const rec = getEvidence(SESSION, packageType);
  if(rec.files.length >= EVIDENCE_MAX_FILES){
    showFlash(`Maximum ${EVIDENCE_MAX_FILES} evidence files here. Remove one first.`, "err");
    inputEl.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = function(){
    rec.files.push({name:file.name, dataUrl:reader.result, size:file.size, uploadedAt: todayISO()});
    setData(evidenceKeyFor(SESSION, packageType), rec);
    showFlash("Evidence attached.");
    renderView(USERS[SESSION]);
  };
  reader.readAsDataURL(file);
}
function onRemoveEvidenceFile(packageType, idx){
  const rec = getEvidence(SESSION, packageType);
  rec.files.splice(idx,1);
  setData(evidenceKeyFor(SESSION, packageType), rec);
  renderView(USERS[SESSION]);
}
function buildEvidenceCard(username, packageType, editable){
  const rec = getEvidence(username, packageType);
  const rows = rec.files.map((f,i)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
      <a href="${f.dataUrl}" download="${esc(f.name)}" style="font-size:12.8px;color:var(--ink)">${esc(f.name)} <span style="color:var(--muted)">(${Math.round(f.size/1024)}KB, ${fmtDate(f.uploadedAt)})</span></a>
      ${editable?`<button class="x-remove" onclick="onRemoveEvidenceFile('${packageType}',${i})">✕</button>`:""}
    </div>`).join("");
  return `<div class="card">
    <div class="card-head"><div><div class="card-title">Evidence of Performance</div><div class="card-sub">Optional supporting documents for this ${PACKAGE_TYPES[packageType].noun} (up to ${EVIDENCE_MAX_FILES} files, ${Math.round(EVIDENCE_MAX_BYTES/1024)}KB each — the county-approved limit). On this browser-storage prototype specifically, keep actual test uploads modest; the full limit is safe once this runs on a real backend.</div></div></div>
    <div class="card-body">
      ${rec.files.length===0?`<div class="muted">No evidence attached${editable?" yet.":"."}</div>`:rows}
      ${editable?`<div style="margin-top:12px"><input type="file" accept="image/*,.pdf" onchange="onEvidenceFileSelected('${packageType}', this)"/></div>`:""}

let cprcSelection = new Set(); // "packageType:username" composite keys

function toggleCPRCSelectAll(checked, keys){ keys.forEach(k=>{ if(checked) cprcSelection.add(k); else cprcSelection.delete(k); }); renderView(USERS[SESSION]); }
function onFolderSearchFilter(inputEl){
  // filters rows/pills by name or personal number without re-rendering the view,
  // so the search box never loses focus or cursor position while typing
  const q = inputEl.value.trim().toLowerCase();
  const card = inputEl.closest(".card");
  if(!card) return;
  const visibleDepts = new Set();
  card.querySelectorAll("[data-search]").forEach(el=>{
    const match = !q || el.getAttribute("data-search").includes(q);
    el.style.display = match ? "" : "none";
    if(match) visibleDepts.add(el.getAttribute("data-dept"));
  });
  card.querySelectorAll("[data-dept-header]").forEach(headerEl=>{
    headerEl.style.display = visibleDepts.has(headerEl.getAttribute("data-dept-header")) ? "" : "none";
  });
  // drill-down groups (SPAS A/B sections, department folders): while searching,
  // force every group open regardless of collapsed state so matches are visible;
  // once the search is cleared, restore each group to its actual expanded/collapsed state.
  card.querySelectorAll("[data-group]").forEach(el=>{
    el.style.display = q ? "" : (el.getAttribute("data-expanded")==="true" ? "" : "none");
  });
}
let expandedGroups = new Set(); // "<bucketKey>:cadre:A" / "<bucketKey>:dept:Water" — pure UI state, not persisted
function toggleGroup(key){
  if(expandedGroups.has(key)) expandedGroups.delete(key); else expandedGroups.add(key);
  renderView(USERS[SESSION]);
}
function buildDrillDownList(entries, opts){
  // Shared SPAS A / SPAS B -> Department folder -> Officer drill-down, used across
  // every CPRC/CS package list (Inbound, Outbound, Central Registry). entries is
  // an array of [username, userRecord] pairs already filtered to whatever this
  // specific list represents (a given status/role's bucket) - this function only
  // handles how they're grouped and displayed, not which ones belong here.
  //
  // opts: bucketKey (unique id for this list, used in toggle-state keys),
  // packageType, readOnly (bool - hides checkboxes/action buttons entirely),
  // actionLabel/actionFn (per-row action, ignored if readOnly),
  // rowExtra (optional fn(uname) -> extra HTML appended to a row, e.g. a status note).
  const cadres = [
    { key:"A", label:"SPAS A", list: entries.filter(([,u])=>u.usesFormA) },
    { key:"B", label:"SPAS B / Form 1A", list: entries.filter(([,u])=>!u.usesFormA) },
  ];
  const bodyHtml = cadres.map(cadre=>{
    const cadreGroupKey = `${opts.bucketKey}:cadre:${cadre.key}`;
    const cadreExpanded = expandedGroups.has(cadreGroupKey);
    const byDept = {};
    cadre.list.forEach(([uname,u])=>{ const d = u.department || "Unspecified"; (byDept[d]=byDept[d]||[]).push(uname); });
    const depts = Object.keys(byDept).sort();
    const deptFoldersHtml = depts.map(dept=>{
      const deptGroupKey = `${opts.bucketKey}:cadre:${cadre.key}:dept:${dept}`;
      const deptExpanded = expandedGroups.has(deptGroupKey);
      const deptKeys = (opts.readOnly && !opts.selectable) ? [] : byDept[dept].map(uname=>opts.selectionKeyFn(uname));
      const deptAllSelected = deptKeys.length>0 && deptKeys.every(k=>opts.selectionSet.has(k));
      const rows = byDept[dept].map(uname=>{
        const u = USERS[uname];
        const searchBlob = esc(`${u.name} ${u.personalNo||""}`.toLowerCase());
        const key = (opts.readOnly && !opts.selectable) ? "" : opts.selectionKeyFn(uname);
        const checked = key && opts.selectionSet.has(key);
        return `<tr data-search="${searchBlob}" data-dept="${esc(dept)}">
          ${(opts.readOnly && !opts.selectable) ? "" : `<td><input type="checkbox" onchange="${opts.toggleSelectionFn}('${key}', this.checked)" ${checked?"checked":""}/></td>`}
          <td><button class="link-btn" style="color:var(--ink)" onclick="${opts.openFn}('${uname}','${opts.packageType}')">${esc(u.name)}</button></td>
          <td style="font-size:12px;color:var(--muted)">${esc(u.designation||"—")}</td>
          ${opts.readOnly ? "" : `<td><button class="btn btn-gold" onclick="${opts.actionFn}('${uname}','${opts.packageType}')">${opts.actionLabel}</button></td>`}
        </tr>${opts.rowExtra ? opts.rowExtra(uname) : ""}`;
      }).join("");
      return `<div>
        <button class="link-btn" style="color:var(--ink);font-weight:700;font-size:12.5px;padding:6px 0" onclick="toggleGroup('${deptGroupKey}')">${deptExpanded?"▾":"▸"} ${esc(dept)} (${byDept[dept].length})${deptKeys.length>0 ? ` <span class="link-btn" style="font-weight:400;font-size:11px;margin-left:8px" onclick="event.stopPropagation();${opts.toggleSelectAllFn}(${!deptAllSelected}, ${JSON.stringify(deptKeys)})">${deptAllSelected?"Deselect all":"Select all"}</span>`:""}</button>
        <div data-group data-expanded="${deptExpanded?"true":"false"}" style="display:${deptExpanded?"":"none"};padding-left:14px;overflow-x:auto">
          <table><tbody>${rows}</tbody></table>
        </div>
      </div>`;
    }).join("");
    return `<div style="margin-bottom:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px">
      <button class="link-btn" style="color:var(--ink);font-weight:700;font-size:14px" onclick="toggleGroup('${cadreGroupKey}')">${cadreExpanded?"▾":"▸"} ${cadre.label} (${cadre.list.length})</button>
      <div data-group data-expanded="${cadreExpanded?"true":"false"}" style="display:${cadreExpanded?"":"none"};margin-top:8px">
        ${cadre.list.length===0 ? `<div class="muted" style="font-size:12.5px">Nothing here.</div>` : deptFoldersHtml}
      </div>
    </div>`;
  }).join("");
  return bodyHtml;
}
function cprcSendToCS(username, packageType){
  const fwd = getForwarding(username, packageType);
  if(!fwd || fwd.status!=="at_cprc") return false;
  if(packageType==="annual" && !section9DualConfirmed(ensureSection9Record(username))) return "needs-confirm";
  fwd.hops.push({by:SESSION, byName:USERS[SESSION].name, at:todayISO(), action:"Sent to CS"});
  fwd.status = "returned_to_cs";
  fwd.returnedAt = todayISO();
  fwd.returnTo = fwd.returnTo || null;
  setData(forwardingKeyFor(username, packageType), fwd);
  return true;
}
function onCPRCSendToCSClick(username, packageType){
  const result = cprcSendToCS(username, packageType);
  if(result==="needs-confirm"){ showFlash("Section 9 needs both the Chairperson's and Secretary's confirmation before this can be sent to the CS.", "err"); return; }
  if(result) showFlash(`${USERS[username].name}'s package sent to the CS.`);
  renderView(USERS[SESSION]);
}
function onCPRCBulkAction(packageType){
  const keys = [...cprcSelection].filter(k=>k.startsWith(packageType+":"));
  if(keys.length===0){ showFlash("Select at least one officer first.", "err"); return; }
  let moved = 0, blocked = 0;
  keys.forEach(k=>{
    const uname = k.slice(packageType.length+1);
    const ok = cprcSendToCS(uname, packageType);
    if(ok===true){ moved++; cprcSelection.delete(k); }
    else if(ok==="needs-confirm"){ blocked++; }
  });
  if(moved>0) showFlash(`${moved} item(s) sent to the CS.`);
  if(blocked>0) showFlash(`${blocked} item(s) still need Section 9's dual confirmation first.`, "err");
  renderView(USERS[SESSION]);
}
function onBatchPrintCPRC(packageType){
  const keys = [...cprcSelection].filter(k=>k.startsWith(packageType+":"));
  if(keys.length===0){ showFlash("Select at least one officer first.", "err"); return; }
  const usernames = keys.map(k=>k.slice(packageType.length+1)).filter(u=>USERS[u]);
  printReport(`Batch ${PACKAGE_TYPES[packageType].label} Packages`, `${usernames.length} officer(s), grouped by department`, buildDepartmentGroupedPrintHtml(usernames, (uname)=>buildCPRCPacketHtml(uname, packageType)));

    + buildEvidenceCard(username, "annual", false);
  html += `<div class="print-section-break"></div>`;
  html += buildQuarterlyTargetingCard(plan.activities, qt, false);
  QUARTERS.forEach(q=>{
    const qd = ach[q] || {entries:{}};
    const qco = co[q] || {entries:{}};

  });
  return html;
}

  }
  return `<div class="card">

function buildPlanStatusBanner(plan){

    return `<div class="status-note">Submitted for approval on ${fmtDate(plan.submittedAt)} — awaiting your supervisor's review. The plan is locked until they respond.</div>`;
  }
  if(plan.status==="approved"){
    return `<div class="status-note ok">Approved by ${esc(USERS[plan.approvedBy]?.name || plan.approvedBy || "")} on ${fmtDate(plan.approvedDate)}. This plan is now locked for both of you — request a change below if targets need revising.</div>`;
  }

function buildPlanWorkflowFooter(plan, me){

function ensureActivityDefaults(a){

    }

  return a;

let qtCache = { entries:{}, status:"not_available" };
function mergeQuarterlyTargets(activities, username){
  const qt = getData(qtargetingKeyFor(username), {entries:{}});
  return activities.map(a => ({...a, q: (qt.entries[a.id] || {Q1:"",Q2:"",Q3:"",Q4:""})}));

function ensureQTargetingRecord(username){
  let qt = getData(qtargetingKeyFor(username), null);
  if(!qt){
    qt = {entries:{}, status:"not_available", submittedAt:null, approvedBy:null, approvedDate:null, rejectionComment:""};
    setData(qtargetingKeyFor(username), qt);

function buildTargetingStatusBanner(qt){
  if(qt.status==="not_available") return `<div class="status-note">Available once your SPAS Form B annual plan (Section 2A) is approved by your supervisor.</div>`;
  if(qt.status==="pending_approval") return `<div class="status-note">Submitted for approval on ${fmtDate(qt.submittedAt)} — awaiting your supervisor's review.</div>`;
  if(qt.status==="approved") return `<div class="status-note ok">Approved by ${esc(USERS[qt.approvedBy]?.name || qt.approvedBy || "")} on ${fmtDate(qt.approvedDate)}. Locked — request a change on SPAS Form B if targets need revising.</div>`;
  if(qt.status==="draft" && qt.rejectionComment) return `<div class="status-note warn">Returned by your supervisor: "${esc(qt.rejectionComment)}". Edit and resubmit.</div>`;

function buildTargetingWorkflowFooter(qt){

}
function onSubmitTargetingForApproval(){

function onRejectTargeting(staffUsername){

function buildQuarterlyTargetingCard(activities, qt, editable){
  const rows = activities.map((a,i)=>{

          </tr></thead>
          <tbody>${rows}</tbody>
        </table>

      ${editable?`<div class="row-actions" style="margin-top:12px">${saveBtnHtml("qtargeting","onSaveQTargeting()")}</div>`:""}
    </div>
  </div>`;

/* shared achievements table builder — used for own view and (read-only) team view */
function computeCumulative(username, activityId, uptoQuarter){
  const ach = getData(achKeyFor(username), {});
  const idx = QUARTERS.indexOf(uptoQuarter);
  if(idx<0) return null;
  let sum = 0, any = false;
  for(let i=0;i<=idx;i++){
    const qd = ach[QUARTERS[i]];
    const val = qd && qd.entries && qd.entries[activityId] ? qd.entries[activityId].achievement : "";
    const n = parseFloat(val);
    if(!isNaN(n)){ sum += n; any = true; }
  }
  return any ? sum : null;
}
function buildAchievementsCard(opts){
  const {activities, quarter, entries, dateEntered, readOnly, coAppraisal, ownerUsername} = opts;
  const coEditable = opts.coEditable !== false;
  const manual = !!(achCache[quarter] && achCache[quarter]._manualDate) && !readOnly;
  const rows = activities.map((a,i)=>{
    const e = entries[a.id] || {};
    const co = coAppraisal ? (coAppraisal.entries[a.id]||{}) : null;
    const cumulative = ownerUsername ? computeCumulative(ownerUsername, a.id, quarter) : null;
    let ratingCell = "";
    if(coAppraisal){
      const auto = calcRating(a.q?.[quarter], e.achievement);
      if(auto){
        ratingCell = `<td><div class="rating-auto"><span class="band">${auto.rating}</span> <span class="pct">(${auto.pct}%)</span><div class="label">${auto.label}</div></div></td>`;
      } else {
        ratingCell = `<td><select ${coEditable?"":"disabled"} onchange="onCoField('${a.id}','rating',this.value)">
          <option value="">-</option>
          ${[1,2,3,4,5].map(n=>`<option value="${n}" ${String(co.rating)===String(n)?"selected":""}>${n}</option>`).join("")}
        </select></td>`;
      }
    }
    return `
    <tr>
      <td>${i+1}</td>
      <td style="font-size:12.8px">${esc(a.activity)||'<span class="muted">—</span>'}</td>
      <td style="text-align:center">${esc(a.q?.[quarter])||"-"}</td>
      <td><input type="number" step="any" style="text-align:center" ${readOnly?"disabled":""} value="${esc(e.achievement)}" oninput="onAchField('${a.id}','achievement',this.value)" placeholder="-"/></td>
      <td style="text-align:center;color:var(--muted)">${cumulative===null?"—":cumulative}</td>
      <td><textarea rows="2" ${readOnly?"disabled":""} oninput="onAchField('${a.id}','notes',this.value)" placeholder="${esc(a.indicator)||'Performance indicator notes'}">${esc(e.notes)}</textarea></td>
      ${ratingCell}
      ${coAppraisal?`<td><textarea rows="2" ${coEditable?"":"disabled"} oninput="onCoField('${a.id}','comment',this.value)" placeholder="Supervisor remarks">${esc(co.comment)}</textarea></td>`:""}
    </tr>`;
  }).join("");

  const dateControls = readOnly
    ? `<span>${fmtDate(dateEntered)}</span>`
    : `
      <label><input type="radio" name="dmode" ${manual?"":"checked"} onchange="onDateModeChange(false)"/> Auto (today, ${fmtDate(todayISO())})</label>
      <label><input type="radio" name="dmode" ${manual?"checked":""} onchange="onDateModeChange(true)"/> Manual</label>
      ${manual?`<input type="date" style="width:160px" value="${esc(dateEntered)}" onchange="onManualDateChange(this.value)"/>`:""}
    `;

  const quarterPicker = opts.quarterPickerFn ? `
    <div class="row-actions">
      ${QUARTERS.map(q=>`<button class="pill ${quarter===q?'active':''}" onclick="${opts.quarterPickerFn}('${q}')">${q}</button>`).join("")}
    </div>` : "";

  const titleText = opts.titleOverride || (readOnly?"Quarterly Achievements — read-only":"Enter Quarterly Achievements");
  const subText = opts.subtitleOverride || (readOnly?"Appraisee's own entries. Not editable from this view.":"Record what was achieved against your planned target for the selected quarter.");

  const auditTrail = (!readOnly || coAppraisal) ? `
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">
      ${opts.submittedAt ? `Report submitted to supervisor on ${fmtDate(opts.submittedAt)}.` : "Not yet submitted to supervisor."}
      ${opts.reviewedAt ? ` Report reviewed on ${fmtDate(opts.reviewedAt)}${opts.reviewedBy?(' by '+esc(USERS[opts.reviewedBy]?.name||opts.reviewedBy)):''}.` : ""}
      ${(!readOnly && opts.rejectionComment) ? `<div class="status-note warn" style="margin-top:6px">Returned by your supervisor: "${esc(opts.rejectionComment)}"</div>` : ""}
    </div>` : "";

  return `
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">${titleText}</div>
        <div class="card-sub">${subText}</div>
      </div>
      ${quarterPicker}
    </div>
    <div class="card-body">
      ${activities.length===0 ? `<div class="muted">No planned activities found. Add them under Annual Plan first.</div>` : `
      <div class="date-row"><span style="color:var(--muted);font-weight:600">Date of entry:</span>${dateControls}</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>#</th><th style="min-width:200px">Agreed performance target</th><th style="width:80px">${quarter} target</th>
            <th style="width:90px">Achievement</th><th style="width:100px">Cumulative</th><th style="min-width:180px">Notes / indicator</th>
            ${coAppraisal?`<th style="width:70px">Rating</th><th style="min-width:160px">Supervisor comment</th>`:""}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${coAppraisal ? `<div class="rating-legend">Rating follows the Vihiga County SPAS rating scale (Form B, rev. July 2025), calculated automatically from % achievement against target — 5 Exceptional (&gt;100%), 4 Very Good (85–100%), 3 Good (65–84%), 2 Fair (50–64%), 1 Poor (≤49%). Shown as a manual dropdown when the target or achievement isn't a plain number.</div>` : ""}
      ${(!readOnly && !coAppraisal) ? `<div class="row-actions" style="margin-top:12px">${saveBtnHtml("ownach","onSaveOwnAchievements()","Save and Submit to Supervisor")}</div>` : ""}
      ${(coAppraisal && coEditable) ? `<div class="row-actions" style="margin-top:12px">${saveBtnHtml("co","onSaveCoAchievements()","Save")}<button class="btn btn-danger-outline" onclick="onReturnQuarterlyForRevision()">Return for Revision</button></div>` : ""}
      ${(coAppraisal && !coEditable) ? `<div class="status-note ok">Reviewed and locked for both of you.</div>` : ""}
      ${auditTrail}
      `}
    </div>
  </div>`;
}

/* ==================== SUBMISSION STATUS SNAPSHOT (dashboard) ==================== */
const SNAPSHOT_TASKS = [
  {key:"annual", label:"Annual Targeting", kind:"approve"},
  {key:"qtargeting", label:"Quarterly Targeting", kind:"approve"},
  {key:"Q1", label:"Q1 Report", kind:"review"},
  {key:"Q2", label:"Q2 Report", kind:"review"},
  {key:"midyear", label:"Mid-Year Review", kind:"signoff"},
  {key:"Q3", label:"Q3 Report", kind:"review"},
  {key:"Q4", label:"Q4 Report", kind:"review"},
  {key:"annualreview", label:"Annual Appraisal Report", kind:"signoff"},
];
function taskStatus(username, taskKey){
  if(taskKey==="annual"){
    const plan = getData(planKeyFor(username), {activities:[], status:"draft"});
    const filled = (plan.activities||[]).some(a=>a.activity);
    return {filled, submitted: plan.status!=="draft", submittedDate: plan.submittedAt, approved: plan.status==="approved", approvedDate: plan.approvedDate};
  }
  if(taskKey==="qtargeting"){
    const qt = getData(qtargetingKeyFor(username), {entries:{}, status:"not_available"});
    const filled = Object.keys(qt.entries||{}).length>0;
    return {filled, submitted: qt.status==="pending_approval"||qt.status==="approved", submittedDate: qt.submittedAt, approved: qt.status==="approved", approvedDate: qt.approvedDate};
  }
  if(taskKey==="Q1"||taskKey==="Q2"||taskKey==="Q3"||taskKey==="Q4"){
    const ach = getData(achKeyFor(username), {});
    const q = ach[taskKey] || {};
    const co = getData(coKeyFor(username), {});
    const qco = co[taskKey] || {};
    const filled = !!(q.entries && Object.keys(q.entries).length>0);
    return {filled, submitted: !!q.submittedAt, submittedDate: q.submittedAt, approved: !!qco.reviewedDate, approvedDate: qco.reviewedDate};
  }
  if(taskKey==="midyear"){
    const my = getData(midyearKeyFor(username), null);
    const filled = !!(my && my.rows && my.rows.length>0);
    return {filled, submitted: !!(my && my.appraiseeSignedAt), submittedDate: my&&my.appraiseeSignedAt, approved: !!(my && my.appraiseeSignedAt && my.supervisorSignedAt), approvedDate: my&&my.supervisorSignedAt};
  }
  if(taskKey==="annualreview"){
    const ar = getData(annualReviewKeyFor(username), null);
    const filled = !!(ar && ar.rows && ar.rows.length>0);
    return {filled, submitted: !!(ar && ar.appraiseeSignedAt), submittedDate: ar&&ar.appraiseeSignedAt, approved: !!(ar && ar.appraiseeSignedAt && ar.supervisorSignedAt), approvedDate: ar&&ar.supervisorSignedAt};
  }
  return {filled:false, submitted:false, approved:false};
}
function statusCellHtml(st, kind){
  const doneLabel = kind==="review" ? "Supervisor Reviewed" : kind==="signoff" ? "Finalized" : "Approved";
  if(!st.filled) return `<span style="color:var(--muted)">Not filled</span>`;
  if(st.approved) return `<span style="color:var(--ink);font-weight:600">${doneLabel}${st.approvedDate?(' · '+fmtDate(st.approvedDate)):''}</span>`;
  if(st.submitted) return `<span style="color:var(--gold);font-weight:600">Submitted${st.submittedDate?(' · '+fmtDate(st.submittedDate)):''}</span>`;
  return `<span style="color:var(--muted)">In progress</span>`;
}
function statusCellText(st, kind){
  const doneLabel = kind==="review" ? "Supervisor Reviewed" : kind==="signoff" ? "Finalized" : "Approved";
  if(!st.filled) return "Not filled";
  if(st.approved) return `${doneLabel}${st.approvedDate?(' - '+fmtDate(st.approvedDate)):''}`;
  if(st.submitted) return `Submitted${st.submittedDate?(' - '+fmtDate(st.submittedDate)):''}`;
  return "In progress";
}
function buildSnapshotRows(entries){
  return entries.map(([uname,u])=>{
    const row = { Staff: u.name };
    SNAPSHOT_TASKS.forEach(t=>{ row[t.label] = statusCellText(taskStatus(uname,t.key), t.kind); });
    return row;
  });
}

  {value:"submitted", label:"Submitted (not yet approved)"},
  {value:"done", label:"Approved / Finalized"},
];
function matchesSnapshotFilter(uname){
  if(!snapshotFilter.task || !snapshotFilter.status) return true;
  const st = taskStatus(uname, snapshotFilter.task);
  if(snapshotFilter.status==="not_filled") return !st.filled;
  if(snapshotFilter.status==="in_progress") return st.filled && !st.submitted;
  if(snapshotFilter.status==="submitted") return st.filled && st.submitted && !st.approved;
  if(snapshotFilter.status==="done") return !!st.approved;
  return true;
}
function onExportSnapshotExcel(){
  if(!lastSnapshot || !window.XLSX){ showFlash("Excel export isn't available right now.", "err"); return; }
  const rows = buildSnapshotRows(lastSnapshot.entries);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Snapshot");
  XLSX.writeFile(wb, `${lastSnapshot.title.replace(/[^a-z0-9]+/gi,"_")}.xlsx`);
}
function onPrintSnapshot(){
  if(!lastSnapshot) return;
  const rows = lastSnapshot.entries.map(([uname,u])=>{
    const cells = SNAPSHOT_TASKS.map(t=>`<td>${statusCellHtml(taskStatus(uname,t.key), t.kind)}</td>`).join("");
    return `<tr><td>${esc(u.name)}</td>${cells}</tr>`;
  }).join("");
  const tableHtml = `<div class="card"><div class="card-body"><div style="overflow-x:auto"><table>
    <thead><tr><th>Staff</th>${SNAPSHOT_TASKS.map(t=>`<th>${t.label}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div></div>`;
  printReport(lastSnapshot.title, lastSnapshot.subtitle, tableHtml);
}
function buildSnapshotTable(title, subtitle, allEntries){
  const filterActive = !!(snapshotFilter.task && snapshotFilter.status);
  const entries = filterActive ? allEntries.filter(([uname])=>matchesSnapshotFilter(uname)) : allEntries;
  const filterTaskLabel = filterActive ? SNAPSHOT_TASKS.find(t=>t.key===snapshotFilter.task)?.label : "";
  const filterStatusLabel = filterActive ? SNAPSHOT_STATUS_OPTIONS.find(s=>s.value===snapshotFilter.status)?.label : "";
  const effectiveSubtitle = filterActive ? `${subtitle} — filtered to: ${filterTaskLabel} = ${filterStatusLabel} (${entries.length} of ${allEntries.length})` : subtitle;
  lastSnapshot = { title, subtitle: effectiveSubtitle, entries };
  const rows = entries.map(([uname,u])=>{
    const cells = SNAPSHOT_TASKS.map(t=>`<td>${statusCellHtml(taskStatus(uname,t.key), t.kind)}</td>`).join("");
    return `<tr><td>${esc(u.name)}</td>${cells}</tr>`;
  }).join("");
  const filterHtml = `<div class="row-actions" style="margin-bottom:12px;align-items:center">
    <span style="font-size:12px;color:var(--muted)">Filter:</span>
    <select onchange="onSnapshotFilterChange('task', this.value)" style="width:auto">
      <option value="">Any task</option>
      ${SNAPSHOT_TASKS.map(t=>`<option value="${t.key}" ${snapshotFilter.task===t.key?"selected":""}>${t.label}</option>`).join("")}
    </select>
    <select onchange="onSnapshotFilterChange('status', this.value)" style="width:auto">
      <option value="">Any status</option>
      ${SNAPSHOT_STATUS_OPTIONS.map(s=>`<option value="${s.value}" ${snapshotFilter.status===s.value?"selected":""}>${s.label}</option>`).join("")}
    </select>
    ${filterActive?`<button class="btn btn-ghost" onclick="onClearSnapshotFilter()">Clear filter</button>`:""}
  </div>`;
  return `<div class="card">
    <div class="card-head">
      <div><div class="card-title">${title}</div><div class="card-sub">${esc(effectiveSubtitle)}</div></div>
      ${allEntries.length>0?`<div class="row-actions"><button class="btn btn-ghost" onclick="onPrintSnapshot()">Print (PDF)</button><button class="btn btn-ghost" onclick="onExportSnapshotExcel()">Export to Excel</button></div>`:""}
    </div>
    <div class="card-body">
      ${allEntries.length>0 ? filterHtml : ""}
      ${entries.length===0 ? `<div class="muted">${filterActive?"No staff match this filter.":"No staff to show."}</div>` : `
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Staff</th>${SNAPSHOT_TASKS.map(t=>`<th>${t.label}</th>`).join("")}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`}
    </div>
  </div>`;
}

function onApprovePlan(staffUsername){

  ensurePlanStatus(plan);
  plan.status = "approved"; plan.approvedBy = SESSION; plan.approvedDate = todayISO(); plan.rejectionComment = "";

  if(USERS[staffUsername] && USERS[staffUsername].usesFormA){

  ensurePlanStatus(plan);
  plan.status = "draft"; plan.rejectionComment = comment; plan.submittedAt = null;
  setData(planKeyFor(staffUsername), plan);
  showFlash("Plan returned to staff for changes.");

  const newFY = input ? input.value.trim() : "";

  const { error: clearErr } = await sb.from("fiscal_years").update({ is_current:false }).eq("is_current", true);

  const { error: upsertErr } = await sb.from("fiscal_years").upsert({ fy:newFY, is_current:true, created_by: idFor(SESSION) }, {onConflict:"fy"});

        </select>` : ""}
        <select id="filt_directorate" onchange="onAdminFilterChange('directorate',this.value)" style="width:auto">
          <option value="">All directorates</option>
          ${directorates.map(d=>`<option value="${esc(d)}" ${adminFilters.directorate===d?"selected":""}>${esc(d)}</option>`).join("")}
        </select>
        <select id="filt_jobGroup" onchange="onAdminFilterChange('jobGroup',this.value)" style="width:auto">
          <option value="">All job groups</option>
          ${jobGroups.map(d=>`<option value="${esc(d)}" ${adminFilters.jobGroup===d?"selected":""}>${esc(d)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="card-body">
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Name</th><th>Username</th><th>Designation</th><th>Job Grp</th><th>Department</th><th>Directorate</th><th>Reports to</th><th>Role</th><th></th></tr></thead>
          <tbody>
            ${filtered.map(([uname,u])=>`
              <tr>
                <td>${esc(u.name)}</td>
                <td>${esc(uname)}</td>
                <td>${esc(u.designation)}</td>
                <td>${esc(u.jobGroup)||"—"}</td>
                <td>${esc(u.department)||"—"}</td>
                <td>${esc(u.directorate)||"—"}</td>
                <td>${u.supervisorUsername ? esc(USERS[u.supervisorUsername]?.name || u.supervisorUsername) : "—"}</td>
                <td>${[u.isSystemAdmin&&"System Admin", u.isDeptAdmin&&"Dept Admin", u.isCPRC&&"CPRC", u.isAuthorizedOfficer&&"CS/AO", u.isCECM&&"CECM", u.isChiefOfficer&&"CO", u.isSupervisor&&"Supervisor", !isSpecialAccount(u)&&"Appraisee"].filter(Boolean).join(" · ")}</td>
                <td style="white-space:nowrap">
                  <button class="link-btn" style="color:var(--ink)" onclick="onEditUser('${uname}')">Edit</button>
                  &nbsp;
                  <button class="link-btn" style="color:var(--danger)" onclick="onRemoveUser('${uname}')">Remove</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;

  const staffTabsHtml = `<div class="row-actions" style="margin-bottom:16px">
    <button class="pill ${adminStaffSubTab==='all'?'active':''}" onclick="setAdminStaffSubTab('all')">All Staff</button>
    <button class="pill ${adminStaffSubTab==='add'?'active':''}" onclick="setAdminStaffSubTab('add')">Add New Staff</button>
  </div>`;

  let bodyHtml;
  if(adminSubTab==="notifications") bodyHtml = notificationsHtml;
  else if(adminSubTab==="submissions") bodyHtml = submissionsHtml;
  else if(adminSubTab==="windows") bodyHtml = windowsHtml;
  else bodyHtml = staffTabsHtml + (adminStaffSubTab==="add" ? addStaffHtml : allStaffHtml);

  slot.innerHTML = tabsHtml + bodyHtml;
}
function onAdminFilterChange(field, val){
  adminFilters[field] = val;
  if(field==="department"){ adminFilters.directorate=""; adminFilters.jobGroup=""; }
  if(field==="directorate"){ adminFilters.jobGroup=""; }
  renderView(USERS[SESSION]);
}
function readAdminFormFromDOM(me){
  const deptLocked = me.isDeptAdmin && !me.isSystemAdmin;
  adminForm = {
    username: document.getElementById("af_username").value.trim(),
    password: document.getElementById("af_password").value,
    supabaseUid: document.getElementById("af_supabaseUid") ? document.getElementById("af_supabaseUid").value.trim() : "",
    name: document.getElementById("af_name").value,
    personalNo: document.getElementById("af_personalNo").value,
    designation: document.getElementById("af_designation").value,
    jobGroup: document.getElementById("af_jobGroup").value,
    department: deptLocked ? me.department : document.getElementById("af_department").value,
    directorate: document.getElementById("af_directorate").value,
    sectionUnit: document.getElementById("af_sectionUnit").value,
    termsOfService: document.getElementById("af_termsOfService").value,
    subcounty: document.getElementById("af_subcounty").value,
    dutyStation: document.getElementById("af_dutyStation").value,
    supervisorUsername: document.getElementById("af_supervisor").value,
    isSupervisor: document.getElementById("af_isSupervisor").checked,
    isChiefOfficer: document.getElementById("af_isChiefOfficer").checked,
    isCECM: document.getElementById("af_isCECM").checked,
    usesFormA: document.getElementById("af_usesFormA").checked,
    isDeptAdmin: me.isSystemAdmin ? document.getElementById("af_isDeptAdmin").checked : (adminForm.isDeptAdmin||false),
    isSystemAdmin: me.isSystemAdmin ? document.getElementById("af_isSystemAdmin").checked : (adminForm.isSystemAdmin||false),
    isCPRC: me.isSystemAdmin ? document.getElementById("af_isCPRC").checked : (adminForm.isCPRC||false),
    isAuthorizedOfficer: me.isSystemAdmin ? document.getElementById("af_isAuthorizedOfficer").checked : (adminForm.isAuthorizedOfficer||false),
  };
}
function onEditUser(uname){
  const me = USERS[SESSION];
  if(!me.isSystemAdmin && USERS[uname].department !== me.department){
    showFlash("You can only manage staff within your own department.", "err");
    return;
  }
  const u = USERS[uname];
  adminEditing = uname;
  adminForm = { username:uname, password:u.password, name:u.name, personalNo:u.personalNo, designation:u.designation,
    department:u.department, directorate:u.directorate||"", sectionUnit:u.sectionUnit||"", termsOfService:u.termsOfService||"",
    subcounty:u.subcounty||"", jobGroup:u.jobGroup||"", dutyStation:u.dutyStation||"",
    isSupervisor:!!u.isSupervisor, isChiefOfficer:!!u.isChiefOfficer, isCECM:!!u.isCECM, isDeptAdmin:!!u.isDeptAdmin, isSystemAdmin:!!u.isSystemAdmin,
    isCPRC:!!u.isCPRC, isAuthorizedOfficer:!!u.isAuthorizedOfficer, usesFormA:!!u.usesFormA, supervisorUsername:u.supervisorUsername||"" };
  adminSubTab = "staff"; adminStaffSubTab = "add";
  renderView(USERS[SESSION]);
}
function onCancelAdminEdit(){
  adminEditing = null; adminForm = blankAdminForm();
  adminStaffSubTab = "all";
  renderView(USERS[SESSION]);
}
async function onSaveAdminForm(){
  const me = USERS[SESSION];
  readAdminFormFromDOM(me);
  if(!adminForm.username || !adminForm.password || !adminForm.name){
    showFlash("Username, password and name are required.", "err");
    return;
  }
  if(!adminEditing && USERS[adminForm.username]){
    showFlash("That username already exists.", "err");
    return;
  }
  const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if(!adminEditing && !uuidPattern.test(adminForm.supabaseUid)){
    showFlash(`Create the login in Supabase first (Authentication → Add User, email "${emailFor(adminForm.username||"...")}"), then paste its User UID into the field above — that's what lets this account actually sign in.`, "err");
    return;
  }
  if(!me.isSystemAdmin && !adminForm.department){
    showFlash("Department is required.", "err");
    return;
  }
  if(!me.isSystemAdmin && adminForm.department !== me.department){
    showFlash("You can only create or edit staff within your own department.", "err");
    return;
  }
  const profileRow = {
    username: adminForm.username, name: adminForm.name, personal_no: adminForm.personalNo,
    designation: adminForm.designation, department: adminForm.department, directorate: adminForm.directorate,
    section_unit: adminForm.sectionUnit, terms_of_service: adminForm.termsOfService,
    subcounty: adminForm.subcounty, job_group: adminForm.jobGroup, duty_station: adminForm.dutyStation,
    is_supervisor: adminForm.isSupervisor, is_chief_officer: adminForm.isChiefOfficer, is_cecm: adminForm.isCECM,
    uses_form_a: adminForm.usesFormA,
    is_dept_admin: adminForm.isDeptAdmin, is_system_admin: adminForm.isSystemAdmin,
    is_cprc: adminForm.isCPRC, is_authorized_officer: adminForm.isAuthorizedOfficer,
    supervisor_id: adminForm.supervisorUsername ? idFor(adminForm.supervisorUsername) : null,
  };
  if(!adminEditing){
    // The Supabase login itself (email+password) still needs a privileged, server-side
    // step (an Edge Function, or this manual dashboard step) since the client-side public
    // key can't create other users' logins. But by requiring the resulting UID up front
    // and using it directly as the profile's id, the two records are correctly linked
    // from the moment this row is created — no separate fix-up step needed afterward.
    profileRow.id = adminForm.supabaseUid;
    const { error } = await sb.from("profiles").insert(profileRow);
    if(error){ showFlash("Could not create the profile: " + error.message, "err"); return; }
    USERNAME_TO_ID[adminForm.username] = profileRow.id; ID_TO_USERNAME[profileRow.id] = adminForm.username;
    showFlash("Staff account created and linked — ready to sign in immediately.");
  } else {
    const { error } = await sb.from("profiles").update(profileRow).eq("id", idFor(adminForm.username));
    if(error){ showFlash("Could not update the profile: " + error.message, "err"); return; }
    showFlash("Staff record updated.");
  }
  USERS[adminForm.username] = {
    password: null, name: adminForm.name, personalNo: adminForm.personalNo,
    designation: adminForm.designation, department: adminForm.department, directorate: adminForm.directorate,
    sectionUnit: adminForm.sectionUnit, termsOfService: adminForm.termsOfService,
    subcounty: adminForm.subcounty, jobGroup: adminForm.jobGroup, dutyStation: adminForm.dutyStation,
    isSupervisor: adminForm.isSupervisor, isChiefOfficer: adminForm.isChiefOfficer, isCECM: adminForm.isCECM,
    usesFormA: adminForm.usesFormA,
    isDeptAdmin: adminForm.isDeptAdmin, isSystemAdmin: adminForm.isSystemAdmin,
    isCPRC: adminForm.isCPRC, isAuthorizedOfficer: adminForm.isAuthorizedOfficer,
    supervisorUsername: adminForm.supervisorUsername || null,
  };
  adminEditing = null; adminForm = blankAdminForm();
  adminStaffSubTab = "all";
  renderView(USERS[SESSION]);
}
function onRemoveUser(uname){
  const me = USERS[SESSION];
  if(uname===SESSION){ showFlash("You can't delete the account you're signed in as.", "err"); return; }
  if(!me.isSystemAdmin && USERS[uname].department !== me.department){
    showFlash("You can only remove staff within your own department.", "err");
    return;
  }
  if(!confirm(`Remove staff account "${USERS[uname].name}"? Their plan and achievement history is kept but they will lose access.`)) return;
  delete USERS[uname];
  setData("users", USERS);
  showFlash("Staff account removed.");
  if(adminEditing===uname){ adminEditing=null; adminForm=blankAdminForm(); }
  renderView(USERS[SESSION]);
}

/* --------------------------------- boot --------------------------------- */
renderApp();
</script>
</body>
</html>
