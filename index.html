function renderAOFolder(slot, mode){
  // AO inbound is now one desk with package-type folders. Within each package
  // type, both arrivals from departments and returns from CPRC are rendered.
  // The old standalone CPRC-inbound mode remains callable but is no longer
  // exposed in the AO navigation.
  if(mode==="inbox"){
    const packageTypes = ["halfyear","annual"];
    slot.innerHTML = packageTypes.map(pt=>{
      const fromDepartments = buildAOInboundCard(pt) || "";
      const fromCPRC = buildAOInboundFromCPRCCard(pt) || "";
      const content = fromDepartments || fromCPRC || `<div class="card"><div class="card-head"><div><div class="card-title">${PACKAGE_TYPES[pt].label} — Inbound</div><div class="card-sub">Packages arriving from departments or returned by CPRC.</div></div></div><div class="card-body"><div class="muted">Nothing here right now.</div></div></div>`;
      return `<section class="folder-section" data-package-folder="${pt}"><div class="card" style="margin-bottom:14px"><div class="card-head"><div><div class="card-title">${PACKAGE_TYPES[pt].label} Folder</div><div class="card-sub">Inbound packages for the ${PACKAGE_TYPES[pt].label.toLowerCase()} reporting cycle.</div></div></div></div>${content}</section>`;
    }).join("");
  } else {
    const buildFn = mode==="outbox" ? buildAOOutboundCard
      : mode==="cprcinbox" ? buildAOInboundFromCPRCCard
      : mode==="holding" ? buildAOHoldingBayCard
      : buildCentralRegistrySection;
    const emptyLabels = {
      outbox: "Nothing currently with CPRC.",
      cprcinbox: "Nothing back from CPRC right now.",
      holding: "Nothing waiting here right now.",
      registry: "Nothing filed here yet.",
    };
    let html = ["halfyear","annual"].map(pt => buildFn(pt) || "").join("");
    if(!html.trim()) html = `<div class="card"><div class="card-body"><div class="muted">${emptyLabels[mode]}</div></div></div>`;
    slot.innerHTML = html;
  }

  const statusForMode = { inbox:"in_transit", outbox:"at_cprc", cprcinbox:"cprc_processed", holding:"ao_holding", registry:"returned_to_cs" }[mode];
  if(cprcActive && USERS[cprcActive.username]){
    const fwd = getForwarding(cprcActive.username, cprcActive.type);
    const holderOk = mode==="inbox"
      ? (fwd && ((fwd.status==="in_transit" && fwd.currentHolder===SESSION) || fwd.status==="cprc_processed"))
      : mode==="registry" ? (fwd && fwd.status===statusForMode && fwd.returnTo===SESSION)
      : (fwd && fwd.status===statusForMode);
    if(holderOk) renderCPRCOfficerPacket(slot, cprcActive.username, cprcActive.type);
    else cprcActive = null;
  }
}

function computeOverallAnnualScore(username){
  const threeB = getData(annualReviewKeyFor(username), {rows:[]});

  const core = getData(coreValuesKeyFor(username), {rows:[]});

  const specialMean = meanAgreed(special.rows);
  const coreMean = meanAgreed(core.rows);

  if(targetMean!==null){
    overall = targetMean + (specialMean!==null?0.2*specialMean:0) + (coreMean!==null?0.1*coreMean:0);
  }
  return { targetMean, specialMean, coreMean, overall, finalized };
}

   narratively at mid-year, and scored once at year-end. Sections 3(B)/3(C)/4(D)/
   Rewards-Sanctions/Training reuse the exact same underlying mechanics as the
   standard workflow's Sections 5/6/7/9/Training (confirmed identical by the
   county); only Sections 2(A), 2(B), and the year-end scoring pass (3(A) in the
   Form A document's own numbering) are genuinely new and built out below,
   block by block. This function is the routing home for all of it. */
/* ============================== PERFORMANCE CONTRACT (Director and above) ==============================
   Annual-only appraisal (confirmed: the Kobo reporting tool this is built
   from is explicitly annual-only, no mid-year step). Structure and weights
   are taken directly from the signed CECM PC's Annex I Performance Matrix -
   7 fixed categories A-G totaling 100%. Each officer's own PC has its own
   set of indicators within those categories (like SPAS's own target list,
   populated per-person, not hardcoded). Same relay chain as SPAS (officer's
   own supervisor -> CO -> CECM -> Authorized Officer -> CPRC) - already
   wired via reportingTrack==="pc" from Block 1. Rating scale is SPAS's own
   existing 5-tier scale, reused as-is (matches the Kobo tool's "Poor"
   zero-state default). */
// Appraisee-initiated "Request a change" revision requests (both SPAS and
// PC) are retired per the reorganized workflow — only a supervisor's own
// Return-for-Revision action exists now. Kept as a single flag, not deleted,
// per this codebase's standing practice (see the quarterly-reporting and
// PC-half-year retirements) - flip back to true to restore the button and
// its submission handlers. Any revision_requests row already in flight when
// this was flipped off still drains normally through the existing
// supervisor/admin approval screens; only new submissions are blocked.
const APPRAISEE_REVISION_REQUESTS_ENABLED = false;
// CPRC (the physical County Performance Appraisal Committee) and the
// Authorized Officer's separate multi-stage pipeline (Inbound/Outbound/
// Reviewed Submissions/Central Registry/CPRC desks) are retired per the
// reorganized workflow: CECM already sits on CPAC, so a single CECM action
// now records the committee's finalized outcome and sends the file to the
// Central Registry directly (see the "CPAC Finalize" tab / Section 9).
// Kept as one flag, not deleted, per this codebase's standing practice.
const LEGACY_CPRC_AO_PIPELINE_ENABLED = false;
// The "Forwarding Queue" tab in My Team (manual hop-by-hop conveying of a
// finalized package up the chain) is hidden from view, not deleted - the
// underlying forwarding data, hop history and buildRoutingStatusNote audit
// trail all keep working exactly as before; only the button/tab that lets a
// supervisor manually act on it is tucked away. Flip back to true to bring
// the tab back.
const SHOW_FORWARDING_QUEUE_TAB = false;
const PC_CATEGORIES = [
  { key:"A", label:"Financial Stewardship and Discipline", weight:10 },
  { key:"B", label:"Service Delivery", weight:8 },
  { key:"C", label:"Institutional Transformation", weight:10 },
  { key:"D", label:"Core Mandates", weight:60 },
  { key:"E", label:"Implementation of Governor's Directives", weight:2 },
  { key:"F", label:"Affirmative Action in Procurement", weight:4 },
  { key:"G", label:"Cross-Cutting", weight:6 },
];
function pcKeyFor(username){ return `pctargets_${username}_${FY}`; }
let pcCache = null; // {username, rec}
function ensurePCRecord(username){
  let rec = getData(pcKeyFor(username), null);
  if(!rec){
    rec = { rows:[], categoryRemarks:{}, appraiseeSignedBy:null, appraiseeSignedAt:null, appraiserSignedBy:null, appraiserSignedAt:null, rejectionComment:"", submittedAt:null, planRevisionUnlocked:false, planRevisionPendingApproval:false, pcPlanStatus:"draft", pcPlanRejectionComment:"", pcPlanSubmittedAt:null, pcPlanApprovedAt:null, pcPlanApprovedBy:null };
    setData(pcKeyFor(username), rec);
  }
  if(!rec.categoryRemarks) rec.categoryRemarks = {};
  if(rec.planRevisionUnlocked===undefined) rec.planRevisionUnlocked = false;
  if(rec.annualReportingEverOpened===undefined) rec.annualReportingEverOpened = false;
  if(rec.planRevisionPendingApproval===undefined) rec.planRevisionPendingApproval = false;
  if(rec.pcPlanStatus===undefined){
    rec.pcPlanStatus = rec.pcPlanApprovedAt ? "approved" : (rec.pcPlanSubmittedAt ? "pending_approval" : ((rec.appraiseeSignedAt || (rec.submittedAt && rec.annualReportingEverOpened)) ? "approved" : "draft"));
  }
  // Never downgrade an explicitly approved PC plan merely because the annual
  // reporting window has not yet opened. Approval of the plan is a separate
  // state from annual report submission.
  if(rec.pcPlanStatus === "draft" && rec.pcPlanApprovedAt) rec.pcPlanStatus = "approved";
  if(rec.pcPlanStatus === "draft" && rec.pcPlanSubmittedAt && !rec.pcPlanApprovedAt) rec.pcPlanStatus = "pending_approval";
  if(rec.pcPlanRejectionComment===undefined) rec.pcPlanRejectionComment = "";
  if(rec.pcPlanSubmittedAt===undefined) rec.pcPlanSubmittedAt = null;
  if(rec.pcPlanApprovedAt===undefined) rec.pcPlanApprovedAt = null;
  pcCache = { username, rec };
  return rec;
}
function persistPC(){ if(pcCache) setData(pcKeyFor(pcCache.username), pcCache.rec); }
function pcFinalized(rec){ return !!(rec.appraiseeSignedAt && rec.appraiserSignedAt); }
function pcCategoryStats(rows, catKey){
  const catRows = rows.filter(r=>r.category===catKey);
  const weightTotal = catRows.reduce((s,r)=>s + (parseFloat(r.weight)||0), 0);
  const selfScore = catRows.reduce((s,r)=>s + (parseFloat(r.weight)||0) * (parseFloat(r.selfScore)||0) / 100, 0);
  const appraiserScore = catRows.reduce((s,r)=>s + (parseFloat(r.weight)||0) * (parseFloat(r.appraiserScore)||0) / 100, 0);
  return { count: catRows.length, weightTotal, selfScore, appraiserScore };
}
function pcOverallScore(rows, field){
  // field: "selfScore" or "appraiserScore" — sums each category's weighted
  // contribution directly (already capped by that indicator's own share of
  // the fixed category weight, so this naturally totals out of 100).
  return PC_CATEGORIES.reduce((sum,cat)=>{
    const stats = pcCategoryStats(rows, cat.key);
    return sum + (field==="selfScore" ? stats.selfScore : stats.appraiserScore);
  }, 0);
}
function pcRatingLabel(score){
  if(score > 100) return "Exceptional";
  if(score >= 85) return "Very Good";
  if(score >= 65) return "Good";
  if(score >= 50) return "Fair";
  return "Poor";
}
function onAddPCRow(category){
  const rec = pcCache.rec;
  rec.rows.push({ id: uid("pc"), category, refCode:"", description:"", unit:"", weight:"", target:"", selfScore:"", appraiserScore:"", remarks:"" });
  persistPC();
  renderView(USERS[SESSION]);
}
function onRemovePCRow(id){
  const rec = pcCache.rec;
  rec.rows = rec.rows.filter(r=>r.id!==id);
  persistPC();
  renderView(USERS[SESSION]);
}
function onPCField(id, field, val){
  const rec = pcCache.rec;
  const r = rec.rows.find(x=>x.id===id);
  if(!r) return;
  r[field] = val;
  debounceSave(persistPC);
  markDirty(`pc_${r.category}`);
}
function onPCCategoryRemarks(category, val){
  const rec = pcCache.rec;
  rec.categoryRemarks[category] = val;
  debounceSave(persistPC);
  markDirty(`pc_${category}`);
}
function onSavePC(category){
  flushSave(persistPC);
  showFlash("Saved.");
  renderView(USERS[SESSION]);
}
function buildPCCategoryCard(username, rec, category, opts){
  // opts: { appraiseeEditable, reportAppraiseeEditable, appraiserEditable, viewerRole }
  const planEdit = !!opts.appraiseeEditable;
  const reportEdit = !!opts.reportAppraiseeEditable;
  const catRows = rec.rows.filter(r=>r.category===category.key);
  const stats = pcCategoryStats(rec.rows, category.key);
  const weightOk = Math.abs(stats.weightTotal - category.weight) < 0.001;
  const rows = catRows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td style="width:60px"><input type="text" ${(planEdit?"":"disabled")} value="${esc(r.refCode||"")}" oninput="onPCField('${r.id}','refCode',this.value)" placeholder="e.g. ${category.key}1"/></td>
      <td><textarea rows="2" ${(planEdit?"":"disabled")} oninput="onPCField('${r.id}','description',this.value)" placeholder="Performance indicator">${esc(r.description)}</textarea></td>
      <td style="width:70px"><input type="text" ${(planEdit?"":"disabled")} value="${esc(r.unit)}" oninput="onPCField('${r.id}','unit',this.value)" placeholder="e.g. %"/></td>
      <td style="width:80px"><input type="number" step="any" min="0" inputmode="decimal" ${(planEdit?"":"disabled")} value="${esc(r.weight)}" oninput="onPCField('${r.id}','weight',this.value)" placeholder="-"/></td>
      <td><textarea rows="2" ${(planEdit?"":"disabled")} oninput="onPCField('${r.id}','target',this.value)" placeholder="Annual target">${esc(r.target)}</textarea></td>
      <td style="width:80px"><input type="number" step="any" min="0" inputmode="decimal" ${(reportEdit?"":"disabled")} value="${esc(r.selfScore)}" oninput="onPCField('${r.id}','selfScore',this.value)" placeholder="%"/></td>
      <td style="width:80px"><input type="number" step="any" min="0" inputmode="decimal" ${opts.appraiserEditable?"":"disabled"} value="${esc(r.appraiserScore)}" oninput="onPCField('${r.id}','appraiserScore',this.value)" placeholder="%"/></td>
      <td>${planEdit?`<button class="x-remove" onclick="onRemovePCRow('${r.id}')" title="Remove">✕</button>`:""}</td>
    </tr>`).join("");
  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">${category.key}. ${esc(category.label)} (${category.weight}%)</div>
        <div class="card-sub">Weights for this category's indicators must total exactly ${category.weight}%. Current total: ${stats.weightTotal}%${weightOk?"":" — doesn't match yet"}</div>
      </div>
      ${planEdit?`<button class="btn btn-primary" onclick="onAddPCRow('${category.key}')">+ Add indicator</button>`:""}
    </div>
    <div class="card-body">
      ${catRows.length===0 ? `<div class="muted">No indicators added yet.</div>` : `
      <div style="overflow-x:auto"><table>
        <thead><tr><th>#</th><th>Ref.</th><th style="min-width:180px">Indicator</th><th>Unit</th><th>Weight %</th><th style="min-width:150px">Annual Target</th><th>Self %</th><th>Appraiser %</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`}
      <div style="margin-top:10px;font-size:12.8px">
        <strong>Self-Evaluation Score: ${stats.selfScore.toFixed(2)}/${category.weight}</strong> &nbsp;·&nbsp;
        <strong>Final Agreed Score: ${stats.appraiserScore.toFixed(2)}/${category.weight}</strong>
      </div>
      <div style="margin-top:8px">
        <label class="field-label">Appraiser's Remarks</label>
        <textarea rows="2" style="width:100%" ${opts.appraiserEditable?"":"disabled"} oninput="onPCCategoryRemarks('${category.key}',this.value)" placeholder="Record comments after verification of achievements and supporting evidence.">${esc(rec.categoryRemarks[category.key]||"")}</textarea>
      </div>
      ${planEdit||reportEdit||opts.appraiserEditable?`<div class="row-actions" style="margin-top:10px">${saveBtnHtml(`pc_${category.key}`,"onSavePC()")}</div>`:""}
    </div>
  </div>`;
}
function renderPCView(slot, me){
  // PC has one continuous plan/report record, but two distinct phases:
  // 1) planning is available from the start of the FY while Annual is not open;
  // 2) annual reporting starts only when the PC Annual window is opened.
  try {
    const employmentHtml = buildEmploymentDetailsCard(me);
    const windows = getWindows(SESSION);
    const rec = ensurePCRecord(SESSION);
    const annualOpen = windows.annual === "open";
    // PC planning is available from the beginning of the FY until the
    // Annual Reporting window is actually opened. Some existing records use
    // "closed" for the initial window state, so "not_open" alone is too
    // restrictive. Once the annual window has ever been opened, planning is
    // no longer available.
    const annualReportingStarted = !!rec.annualReportingEverOpened || windows.annual === "open" ||
      !!rec.appraiseeSignedAt || !!rec.appraiserSignedAt ||
      rec.rows.some(r=>(r.selfScore!==""&&r.selfScore!==null&&r.selfScore!==undefined) || (r.appraiserScore!==""&&r.appraiserScore!==null&&r.appraiserScore!==undefined));
    const planningPhase = !annualReportingStarted;
    const revisionUnlocked = !!rec.planRevisionUnlocked;
    // An administrator-approved revision is its own controlled phase. It must
    // remain visible/editable even when the Annual Reporting phase had already
    // been opened in the past. Otherwise the unlock succeeds in the data model
    // but the UI falls through to the annual-report branch and hides the
    // resubmission control.
    const revisionPhase = revisionUnlocked || !!rec.planRevisionPendingApproval;
    // An administrator-approved revision explicitly unlocks an already-approved PC plan.
    // This must take precedence over the normal planning-phase lock.
    const planEditable = revisionUnlocked || (planningPhase && windows.planning === "open" && rec.pcPlanStatus !== "pending_approval" && rec.pcPlanStatus !== "approved" && !rec.planRevisionPendingApproval);
    const reportEditable = annualOpen && rec.pcPlanStatus === "approved" && !pcFinalized(rec) && !rec.appraiseeSignedAt;
    const catCards = PC_CATEGORIES.map(cat=>buildPCCategoryCard(SESSION, rec, cat, {
      appraiseeEditable: planEditable,
      reportAppraiseeEditable: reportEditable,
      appraiserEditable:false
    })).join("");
    const overallSelf = pcOverallScore(rec.rows, "selfScore");
    const overallFinal = pcOverallScore(rec.rows, "appraiserScore");
    const summaryHtml = buildPCSummaryCard(rec, overallSelf, overallFinal);

    // Mid-Year Review, reactivated for PC — reuses the exact same shared
    // mechanics SPAS uses (ensureMidyearRecord/buildMidYearCard/midyear_reviews),
    // keyed only by username+FY. PC's indicator rows don't have SPAS's separate
    // activity/indicator fields, so they're adapted here: the indicator's own
    // description stands in for "agreed performance target", and its
    // category/target/unit stand in for "performance indicator". Only
    // relevant once the PC plan is approved (the window can't be opened
    // before that — see setWindowState), and stays visible through the
    // Annual phase too so the mid-year record remains reviewable.
    let midyearHtml = "", halfyearEvidenceHtml = "";
    if(windows.midYear !== "not_open"){
      const pcActivitiesForMidyear = rec.rows.map(r=>({
        id: r.id, activity: r.description || "",
        indicator: `Cat. ${r.category || ""} — Target: ${r.target || ""}${r.unit ? " " + r.unit : ""}`.trim()
      }));
      const myRec = ensureMidyearRecord(SESSION, pcActivitiesForMidyear);
      const myEditable = windows.midYear === "open" && !midyearFinalized(myRec);
      midyearHtml = buildMidYearCard(SESSION, myRec, myEditable, "appraisee");
      halfyearEvidenceHtml = buildEvidenceCard(SESSION, "halfyear", myEditable);
    }

    if(revisionPhase){
      const revisionBanner = rec.planRevisionPendingApproval
        ? `<div class="status-note">Revised Performance Contract submitted to your supervisor for review.</div>`
        : `<div class="status-note ok">Your Performance Contract has been unlocked for the approved revision. Revise it and submit it back to your supervisor.</div>`;
      const revisionFooter = buildPCPlanningFooter(rec, revisionUnlocked);
      // Controlled PC revision is a PLAN-only workspace. Do not render the
      // employment details, annual-report declaration, performance summary,
      // or any annual-review controls here. Those belong to the annual report.
      slot.innerHTML = `<div class="card"><div class="card-head"><div><div class="card-title">Performance Contract Plan — Controlled Revision</div><div class="card-sub">Revise the approved plan indicators, weights and annual targets only. This is not the Annual Performance Review.</div></div></div></div>` + revisionBanner + catCards + revisionFooter + buildRoutingStatusNote(SESSION, "annual", true);
      return;
    }

    if(planningPhase){
      const planBanner = rec.pcPlanStatus === "pending_approval"
        ? `<div class="status-note">Submitted for approval on ${fmtDate(rec.pcPlanSubmittedAt)} — awaiting your supervisor's review. The plan is locked until they respond.</div>`
        : rec.pcPlanStatus === "approved"
          ? (getUnacknowledgedRejectedRevision(SESSION) ? "" : `<div class="status-note ok">Approved by ${esc(USERS[rec.pcPlanApprovedBy]?.name || rec.pcPlanApprovedBy || "your supervisor")} on ${fmtDate(rec.pcPlanApprovedAt)}. It will become the basis of your annual reporting when the Annual Review window opens.</div>`)
          : rec.pcPlanRejectionComment
            ? `<div class="status-note warn">Returned by your supervisor for plan revision: ${esc(rec.pcPlanRejectionComment)}</div>` : buildWindowLockBanner(windows, "planning", "the Planning window");
      const revisionHtml = buildPCRevisionWorkflowFooter(rec);
      const rejectionAlert = buildPCRejectionAlertBanner(SESSION);
      slot.innerHTML = employmentHtml + rejectionAlert + `<div class="card"><div class="card-head"><div><div class="card-title">Performance Contract — Annual Plan</div><div class="card-sub">Enter your indicators, indicator weights and annual target figures. Your supervisor reviews the plan before the Annual Reporting window is opened.</div></div></div></div>` + planBanner + catCards + buildPCPlanningFooter(rec, planEditable, windows) + revisionHtml + midyearHtml + halfyearEvidenceHtml + buildRoutingStatusNote(SESSION, "halfyear", true) + buildRoutingStatusNote(SESSION, "annual", true);
      return;
    }

    if(annualOpen){
      const status = rec.pcPlanStatus !== "approved"
        ? `<div class="status-note warn">Your Performance Contract plan must be approved by your supervisor before you can complete the Annual Performance Contract report.</div>`
        : rec.appraiseeSignedAt
          ? `<div class="status-note ok">Your Annual Performance Contract report has been submitted for appraiser review.</div>`
          : `<div class="status-note">Annual Performance Contract reporting window is open.</div>`;
      const declarationHtml = buildPCDeclarationCard(SESSION, rec, reportEditable, "appraisee");
      const revisionHtml = buildPCRevisionWorkflowFooter(rec);
      slot.innerHTML = employmentHtml + `<div class="card"><div class="card-head"><div><div class="card-title">Performance Contract — Annual Report</div><div class="card-sub">Review your planned indicators and enter your self-assessed performance results for the annual reporting period.</div></div></div></div>` + status + (rec.rejectionComment ? `<div class="status-note warn">Returned for revision: ${esc(rec.rejectionComment)}</div>` : "") + catCards + summaryHtml + declarationHtml + revisionHtml + midyearHtml + halfyearEvidenceHtml + buildRoutingStatusNote(SESSION, "halfyear", true) + buildRoutingStatusNote(SESSION, "annual", true);
      return;
    }

    // Defensive fallback: if the Annual window is in an unusual legacy state
    // but has never actually been opened, keep the PC planning form usable.
    slot.innerHTML = employmentHtml + `<div class="card"><div class="card-head"><div><div class="card-title">Performance Contract — Annual Plan</div><div class="card-sub">The Annual Reporting window has not yet been opened. You may enter your indicators, weights and annual target figures now for supervisor review.</div></div></div></div>` + buildWindowLockBanner(windows, "planning", "the Planning window") + catCards + buildPCPlanningFooter(rec, planEditable, windows) + midyearHtml + halfyearEvidenceHtml + buildRoutingStatusNote(SESSION, "halfyear", true) + buildRoutingStatusNote(SESSION, "annual", true);
  } catch(err) {
    console.error("renderPCView failed", err);
    slot.innerHTML = `<div class="card"><div class="card-body"><strong>Performance Contract</strong><div class="status-note warn" style="margin-top:10px">The Performance Contract could not be rendered. Please refresh the page. Technical detail: ${esc(err?.message || String(err))}</div></div></div>`;
  }
}
function pcHasEnteredPlan(rec){ return (rec.rows||[]).some(r=>r && (String(r.refCode||"").trim()||String(r.description||"").trim()||String(r.unit||"").trim()||String(r.weight||"").trim()||String(r.target||"").trim())); }
function buildPCPlanningFooter(rec, editable, windows){
  // After an administrator-approved revision unlock, the original approved
  // status is retained for audit purposes, but the revised PC must be signed
  // and submitted back to the supervisor.
  if(rec.planRevisionUnlocked){
    const canSubmitRevision = editable && pcHasEnteredPlan(rec);
    let action = editable
      ? `<button class="btn btn-gold" ${canSubmitRevision ? "" : "disabled"} onclick="onSignPC(SESSION, 'appraisee')">Sign and Submit Revised PC Plan to Supervisor</button>`
      : `<div class="muted">The revised Performance Contract is currently awaiting action.</div>`;
    if(editable && !canSubmitRevision) action += `<div class="muted" style="margin-top:8px">Enter and save at least one indicator in any A–G section before submitting the revised Performance Contract.</div>`;
    return `<div class="card"><div class="card-body">
      <div class="card-title">Revised Performance Contract</div>
      <div class="card-sub">The administrator has unlocked this Performance Contract for controlled revision. Review your changes, then sign and submit the revised PC plan to your supervisor.</div>
      ${action}
    </div></div>`;
  }
  if(rec.pcPlanStatus === "pending_approval") return `<div class="card"><div class="card-body"><strong>Plan submitted.</strong> Your supervisor must review the Performance Contract plan before the Annual Reporting window is opened.</div></div>`;
  if(rec.pcPlanStatus === "approved") return `<div class="card"><div class="card-body"><div class="status-note ok">Approved by ${esc(USERS[rec.pcPlanApprovedBy]?.name || rec.pcPlanApprovedBy || "your supervisor")} on ${fmtDate(rec.pcPlanApprovedAt)}.</div></div></div>`;
  const canSubmit = editable && pcHasEnteredPlan(rec);
  const notOpenYet = windows && windows.planning !== "open";
  let action = editable
    ? `<button class="btn btn-gold" ${canSubmit ? "" : "disabled"} onclick="onSubmitPCPlan()">Submit Performance Contract Plan to Supervisor</button>`
    : `<div class="muted">${notOpenYet ? "Locked until your administrator opens the Planning window." : "The plan is currently awaiting action."}</div>`;
  if(editable && !canSubmit) action += `<div class="muted" style="margin-top:8px">Enter and save at least one indicator in any A–G section before submitting.</div>`;
  return `<div class="card"><div class="card-body">
    <div class="card-title">Performance Contract Plan</div>
    <div class="card-sub">Enter the indicators, indicator weights and annual performance target figures for the new fiscal year. Your supervisor may return the plan for revision.</div>
    ${rec.pcPlanRejectionComment ? `<div class="status-note warn" style="margin:10px 0">Supervisor's comment: ${esc(rec.pcPlanRejectionComment)}</div>` : ""}
    ${action}
  </div></div>`;
}

async function onSubmitPCPlan(){
  const rec = getData(pcKeyFor(SESSION), null) || ensurePCRecord(SESSION);
  const pcWin = getWindows(SESSION);
  const pcRec = ensurePCRecord(SESSION);
  if(pcWin.annual === "open" || pcRec.annualReportingEverOpened){
    showFlash("PC planning is closed because the Annual Reporting window has opened.", "err");
    return;
  }
  if(pcWin.planning !== "open"){
    showFlash("The Planning window hasn't been opened yet — ask your administrator to open it.", "err");
    return;
  }
  if(rec.pcPlanStatus === "pending_approval") { showFlash("The Performance Contract plan is already with your supervisor.", "err"); return; }
  if(!pcHasEnteredPlan(rec)){ showFlash("Enter and save at least one indicator in any A–G section before submitting the plan.", "err"); return; }
  const me = USERS[SESSION];
  if(!me?.supervisorUsername || !USERS[me.supervisorUsername]){ showFlash("No appraiser/supervisor is assigned to this officer.", "err"); return; }
  rec.pcPlanStatus = "pending_approval";
  rec.pcPlanSubmittedAt = todayISO();
  rec.submittedAt = rec.pcPlanSubmittedAt;
  rec.pcPlanRejectionComment = "";
  setData(pcKeyFor(SESSION), rec);
  try{ await persistKeyToSupabase(pcKeyFor(SESSION), rec); }catch(e){ console.error("PC plan persistence failed", e); }
  await createNotification(me.supervisorUsername, "pc_plan_submission", "Performance Contract plan submitted", `${me.name || SESSION} has submitted their Performance Contract plan for review.`, null, SESSION);
  showFlash("Performance Contract plan submitted to your supervisor.");
  renderView(USERS[SESSION]);
}

async function onPCPlanDecision(username, decision){
  const rec = getData(pcKeyFor(username), null) || ensurePCRecord(username);
  if(getWindows(username).annual === "open" || rec.annualReportingEverOpened || rec.pcPlanStatus !== "pending_approval"){
    showFlash("The Performance Contract plan is not awaiting a planning-stage decision.", "err");
    return;
  }
  // Consume the supervisor's revised-PC submission notification. The action
  // is now complete; it must not keep the supervisor badge alive.
  await clearPCRevisionSubmissionNotifications(username);

  // The supervisor is acting on the revised-plan submission, so consume the
  // outstanding supervisor notification before creating any outcome message.
  await clearPCRevisionSubmissionNotifications(username);
  if(decision === "approve"){
    rec.pcPlanStatus = "approved";
    rec.pcPlanApprovedAt = todayISO();
    rec.pcPlanApprovedBy = SESSION;
    rec.pcPlanRejectionComment = "";
    rec.submittedAt = rec.pcPlanSubmittedAt || rec.submittedAt || todayISO();
    setData(pcKeyFor(username), rec);
    await persistKeyToSupabase(pcKeyFor(username), rec);
    await clearPCPlanDecisionNotifications(username);
    await createNotification(username, "pc_plan_approved", "Performance Contract plan approved", `Your Performance Contract plan has been approved by ${USERS[SESSION]?.name || "your supervisor"}.`, null);
    showFlash("Performance Contract plan approved.");
  } else {
    const comment = prompt("What should be revised in the Performance Contract plan?");
    if(comment===null) return;
    rec.pcPlanStatus = "draft";
    rec.pcPlanRejectionComment = comment.trim() || "Returned for revision.";
    rec.pcPlanSubmittedAt = null;
    rec.submittedAt = null;
    setData(pcKeyFor(username), rec);
    await persistKeyToSupabase(pcKeyFor(username), rec);
    await clearPCPlanDecisionNotifications(username);
    const returnedNotification = await createNotification(
      username,
      "pc_plan_returned",
      "Performance Contract plan returned for revision",
      `Your Performance Contract plan was returned for revision by ${USERS[SESSION]?.name || "your supervisor"}. Reason: ${rec.pcPlanRejectionComment}`,
      null
    );

function getUnacknowledgedRejectedRevision(username){
  const list = getData("revision_requests", []).filter(r=>r.username===username && r.status==="rejected" && !r.appraiseeAcknowledgedRejection);
  if(!list.length) return null;
  list.sort((a,b)=>String(b.supervisorActionAt||b.adminActionAt||b.createdAt||"").localeCompare(String(a.supervisorActionAt||a.adminActionAt||a.createdAt||"")));
  return list[0];
}
function onAcknowledgePCRevisionRejection(requestId){
  const list = getData("revision_requests", []);
  const r = list.find(x=>x.id===requestId);
  if(!r) return;
  r.appraiseeAcknowledgedRejection = true;
  setData("revision_requests", list);
  renderView(USERS[SESSION]);
}
function buildPCRejectionAlertBanner(username){
  // Shown near the top of the page, separately from buildPCRevisionWorkflowFooter
  // (which stays at the bottom alongside the "Request a change" option) - a
  // rejection is the kind of thing that shouldn't be easy to miss below a long
  // list of category cards. Only relevant while the plan-revision route itself
  // is still relevant - once annual reporting has genuinely started, this
  // history is moot. Handles both SPAS and PC - the label and "started" check
  // differ per track, everything else is shared.
  const u = USERS[username];
  if(!u) return "";
  const isPC = !!u.usesPC;
  const label = isPC ? "Performance Contract Plan" : "Annual Plan";
  let started;
  if(isPC){

    if(!rec) return "";
    started = !!rec.annualReportingEverOpened || getWindows(username).annual === "open" ||
      !!rec.appraiseeSignedAt || !!rec.appraiserSignedAt ||
      rec.rows.some(r=>(r.selfScore!==""&&r.selfScore!==null&&r.selfScore!==undefined) || (r.appraiserScore!==""&&r.appraiserScore!==null&&r.appraiserScore!==undefined));
  } else {
    const plan = getData(planKeyFor(username), null);
    if(!plan || plan.status !== "approved") return "";
    started = false; // a SPAS plan stays "approved" (not consumed by a later stage) until a revision unlocks it again
  }
  if(started) return "";
  const rejected = getUnacknowledgedRejectedRevision(username);

  const rejectedBy = rejected.adminActionAt ? "administrator" : "your supervisor";
  return `<div class="status-note warn">Your ${label} revision request was rejected by ${rejectedBy}.${rejected.supervisorComment?(' Reason: "'+esc(rejected.supervisorComment)+'"'):""}

  // Any already-in-flight legacy request still shows its status so it can

async function clearPriorRevisionCycleNotifications(username){
  const list=getData("notifications",[]);
  const requestIds=new Set(getData("revision_requests",[]).filter(r=>r.username===username).map(r=>r.id));
  const now=new Date().toISOString();
  const affected=list.filter(n=>n.recipientUsername===username && !n.readAt && (
    requestIds.has(n.relatedRequestId) ||
    ["pc_revision_unlocked","pc_revision_rejected","pc_revision_approved","pc_revision_returned","pc_revision_supervisor_approved","plan_revision_unlocked","plan_revision_rejected","plan_revision_approved","plan_revision_returned","plan_revision_supervisor_approved"].includes(n.type)
  ));
  if(!affected.length) return;
  affected.forEach(n=>n.readAt=now);
  setData("notifications",list);
  if(sb && USERNAME_TO_ID[username]){
    const {error}=await sb.from("notifications").update({read_at:now})
      .eq("recipient_id",USERNAME_TO_ID[username]).in("id",affected.map(n=>n.id));
    if(error) console.error("Prior revision notification cleanup failed:",error);
  }
}

async function onSubmitPCRevisionRequest(){
  if(!APPRAISEE_REVISION_REQUESTS_ENABLED){ showFlash("Plan-change requests are no longer available — ask your supervisor to return the plan for revision instead.", "err"); return; }
  const reasonEl = document.getElementById("pcRevisionReason");
  const reason = reasonEl ? reasonEl.value.trim() : "";
  if(!reason){ showFlash("Please describe why the Performance Contract Plan needs to change.", "err"); return; }
  const rec = getData(pcKeyFor(SESSION), null);
  if(!rec || rec.pcPlanStatus !== "approved"){ showFlash("A Performance Contract plan revision request can only be made after the plan has been approved by your supervisor.", "err"); return; }
  if(!planRevisionRequestStillAllowed(SESSION)){ showFlash("Performance Contract plan revision requests are closed because the annual reporting window has opened.", "err"); return; }
  const me = USERS[SESSION];
  const supervisorUsername = me && me.supervisorUsername ? me.supervisorUsername : null;
  if(!supervisorUsername || !USERS[supervisorUsername]){
    showFlash("This request cannot be sent because your appraiser/supervisor has not been assigned. Please contact the administrator.", "err");
    return;
  }
  const list = getData("revision_requests", []);
  const existing = list.find(r=>r.username===SESSION && (r.status==="pending_supervisor" || r.status==="pending_admin"));
  if(existing){ showFlash("You already have a Performance Contract Plan revision request awaiting action.", "err"); return; }
  const requestId = (crypto.randomUUID ? crypto.randomUUID() : uid("rr"));
  list.push({ id:requestId, username:SESSION, supervisorUsername, reason, status:"pending_supervisor", createdAt:todayISO(), requestType:"pc" });
  setData("revision_requests", list);
  void persistKeyToSupabase("revision_requests", list);
  // Durable notification to the appraiser/supervisor. The request also remains
  // visible in My Team through getSupervisorPendingItems().
  void createNotification(
    supervisorUsername,
    "pc_revision_request",
    "Performance Contract Plan revision request",
    `${USERS[SESSION]?.name || SESSION} has requested a change to their Performance Contract Plan. Reason: ${reason}`,
    requestId
  );
  showFlash(`Performance Contract Plan revision request sent to ${USERS[supervisorUsername].name}.`);
  renderView(USERS[SESSION]);
}

function onSignPC(username, role){
  const rec = getData(pcKeyFor(username), null);
  if(!rec) return;
  if(role==="appraisee"){
    const wasRevision = !!rec.planRevisionUnlocked;
    if(!wasRevision && !rec.rows.some(r=>r.selfScore!==""&&r.selfScore!==null&&r.selfScore!==undefined)){
      showFlash("Enter and save at least one self-appraisal score in Sections A–G before signing and submitting.", "err");
      return;
    }
    rec.appraiseeSignedBy = SESSION; rec.appraiseeSignedAt = todayISO(); rec.submittedAt = todayISO();
    if(wasRevision){
      rec.planRevisionPendingApproval = true;
    }
    rec.planRevisionUnlocked = false;
    const u = USERS[username];
    // Item 6 fix: clear any outstanding "returned for annual revision" notice
    // now that the appraisee has genuinely resubmitted - this is a separate
    // notification type from the plan-revision-unlock ones cleared below, and
    // applies on every resubmission, not just controlled plan revisions.
    {
      const ns2 = getData("notifications", []);
      const readAt2 = new Date().toISOString();
      let changed2 = false;
      ns2.forEach(n=>{
        if(n.recipientUsername===username && !n.readAt && n.type==="pc_returned_for_revision"){ n.readAt=readAt2; changed2=true; }
      });
      if(changed2){
        setData("notifications", ns2);
        if(sb && USERNAME_TO_ID[username]) void sb.from("notifications").update({read_at:readAt2})
          .eq("recipient_id",USERNAME_TO_ID[username]).eq("notification_type","pc_returned_for_revision").is("read_at",null);
      }
    }
    if(wasRevision){
      const revisionRequest = getData("revision_requests", []).find(r=>r.username===username && r.status==="approved_unlocked");
      if(revisionRequest){
        const ns=getData("notifications",[]);
        const readAt=new Date().toISOString();
        let changed=false;
        ns.forEach(n=>{
          if(n.recipientUsername===username && !n.readAt && n.relatedRequestId===revisionRequest.id &&
             ["pc_revision_unlocked","plan_revision_unlocked"].includes(n.type)){ n.readAt=readAt; changed=true; }
        });
        if(changed){
          setData("notifications",ns);
          if(sb && USERNAME_TO_ID[username]) void sb.from("notifications").update({read_at:readAt})
            .eq("recipient_id",USERNAME_TO_ID[username]).eq("related_request_id",revisionRequest.id)
            .in("notification_type",["pc_revision_unlocked","plan_revision_unlocked"]).is("read_at",null);
        }
      }
    }
    if(u && u.supervisorUsername){
      const revisionRequest = wasRevision
        ? getData("revision_requests", []).find(r=>r.username===username && r.status==="approved_unlocked")
        : null;
      void createNotification(
        u.supervisorUsername,
        wasRevision ? "pc_revision_submission" : "pc_submission",
        wasRevision ? "Revised Performance Contract plan submitted for review" : "Performance Contract submitted for review",
        wasRevision ? `${u.name || username} has submitted a revised Performance Contract plan for your review.` : `${u.name || username} has submitted their Performance Contract for your review.`,
        revisionRequest ? revisionRequest.id : null
      );
    }
  }
  else {
    rec.appraiserSignedBy = SESSION; rec.appraiserSignedAt = todayISO();
    rec.planRevisionPendingApproval = false;
  }
  rec.rejectionComment = "";
  setData(pcKeyFor(username), rec);
  // Cross-device supervisor review requires the revised submission to reach
  // Supabase immediately, not merely local storage.
  void persistKeyToSupabase(pcKeyFor(username), rec);
  if(pcFinalized(rec) && getWindows(username).annual === "open"){
    setWindowState([username], "annual", "closed");
    initForwarding(username, "annual", rec.appraiserSignedBy);
    showFlash("Performance Contract signed by both parties and closed.");
  } else if(role==="appraisee"){
    showFlash("Submitted. This report cannot be edited or resubmitted once signed.");
  } else {
    showFlash("Signed as Appraiser.");
  }
  renderView(USERS[SESSION]);
}
function onReturnPCForRevision(username){
  const windows = getWindows(username);
  const rec = getData(pcKeyFor(username), null);
  // Only the appraiser, at the submitted-report review point, can return a PC.
  if(windows.annual !== "open" || !rec || !rec.appraiseeSignedAt || rec.appraiserSignedAt){
    showFlash("The Performance Contract can only be returned by the appraiser while reviewing the submitted report.", "err");
    return;
  }
  const comment = prompt("What should be revised before this is signed off again?");
  if(comment===null) return;
  rec.appraiseeSignedBy = null; rec.appraiseeSignedAt = null;
  rec.appraiserSignedBy = null; rec.appraiserSignedAt = null;
  rec.submittedAt = null;
  rec.rejectionComment = comment || "Returned for revision.";
  rec.planRevisionUnlocked = false;
  rec.planRevisionPendingApproval = false;
  // Any scores or remarks the appraiser had entered belong to a review that
  // is now void - vacate them entirely rather than leaving stale figures
  // (including any erroneous defaults) sitting on the record.
  rec.rows.forEach(r=>{ r.appraiserScore = ""; });
  rec.categoryRemarks = {};
  setData(pcKeyFor(username), rec);
  setWindowState([username], "annual", "open");
  const appraisee = USERS[username];
  void createNotification(
    username,
    "pc_returned_for_revision",
    "Performance Contract returned for revision",
    `Your Performance Contract was returned for revision by ${USERS[SESSION]?.name || "your appraiser"}. Reason: ${rec.rejectionComment}`,
    null
  );
  showFlash("Returned to the appraisee for revision.");
  renderView(USERS[SESSION]);
}

// A single shared banner for the "hasn't opened yet / just closed" state of
// any window, with a days-remaining countdown when the admin attached a
// closeout date. Used for the Planning window here, and reusable anywhere
// else a window-lock banner is needed.
function buildWindowLockBanner(windows, field, openWhatText){
  const state = windows[field];
  if(state==="open"){
    const closeDate = windows[field+"CloseDate"];
    if(!closeDate) return "";
    const daysLeft = Math.ceil((new Date(closeDate) - new Date(todayISO())) / 86400000);
    if(daysLeft<0) return "";
    return `<div class="status-note ${daysLeft<=3?"warn":""}">${daysLeft===0?"Closes today":daysLeft===1?"Closes tomorrow":`${daysLeft} day${daysLeft===1?"":"s"} left`} — ${openWhatText} closes ${fmtDate(closeDate)}.</div>`;
  }
  if(state==="not_open") return `<div class="status-note">Locked until your administrator opens ${openWhatText}.</div>`;
  if(state==="closed") return `<div class="status-note">${openWhatText[0].toUpperCase()+openWhatText.slice(1)} is closed.</div>`;
  return "";
}
function buildPlanStatusBanner(plan, windows){
  if(plan.status==="pending_approval"){
    return `<div class="status-note">Submitted for approval on ${fmtDate(plan.submittedAt)} — awaiting your supervisor's review. The plan is locked until they respond.</div>`;

    return `<div class="status-note ok">Approved by ${esc(USERS[plan.approvedBy]?.name || plan.approvedBy || "")} on ${fmtDate(plan.approvedDate)}. This plan is now locked for both of you — request a change below if targets need revising.</div>`;

  if(plan.status==="draft" && plan.rejectionComment){
    return `<div class="status-note warn">Returned by your supervisor: "${esc(plan.rejectionComment)}". Edit and resubmit when ready.</div>`;

  if(plan.status==="draft" && windows){
    return buildWindowLockBanner(windows, "planning", "the Planning window");

  return "";
}

function qtargetingKeyFor(username){ return `qtargeting_${username}_${FY}`; }
let qtCache = { entries:{}, status:"not_available" };
function mergeQuarterlyTargets(activities, username){
  const qt = getData(qtargetingKeyFor(username), {entries:{}});

function ensureQTargetingRecord(username){
  let qt = getData(qtargetingKeyFor(username), null);
  if(!qt){
    qt = {entries:{}, status:"not_available", submittedAt:null, approvedBy:null, approvedDate:null, rejectionComment:""};
    setData(qtargetingKeyFor(username), qt);
  }
  if(qt.status===undefined) qt.status = "not_available";

}
function buildTargetingStatusBanner(qt){
  if(qt.status==="not_available") return `<div class="status-note">Available once your SPAS Form B annual plan (Section 2A) is approved by your supervisor.</div>`;
  if(qt.status==="pending_approval") return `<div class="status-note">Submitted for approval on ${fmtDate(qt.submittedAt)} — awaiting your supervisor's review.</div>`;
  if(qt.status==="approved") return `<div class="status-note ok">Approved by ${esc(USERS[qt.approvedBy]?.name || qt.approvedBy || "")} on ${fmtDate(qt.approvedDate)}. Locked — request a change on SPAS Form B if targets need revising.</div>`;
  if(qt.status==="draft" && qt.rejectionComment) return `<div class="status-note warn">Returned by your supervisor: "${esc(qt.rejectionComment)}". Edit and resubmit.</div>`;

function buildTargetingWorkflowFooter(qt){

  }
  return "";
}
function onSubmitTargetingForApproval(){

  qtCache.submittedAt = todayISO();

function onApproveTargeting(staffUsername){

}
function onRejectTargeting(staffUsername){

function buildQuarterlyTargetingCard(activities, qt, editable){

            ${QUARTERS.map(q=>`<th style="width:78px">${q}</th>`).join("")}

          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="rating-legend">Split totals shown in red don't yet match the annual target — that's just a check, not a block on saving.</div>`}
      ${editable?`<div class="row-actions" style="margin-top:12px">${saveBtnHtml("qtargeting","onSaveQTargeting()")}</div>`:""}
    </div>
  </div>`;

/* shared achievements table builder — used for own view and (read-only) team view */
function computeCumulative(username, activityId, uptoQuarter){
  const ach = getData(achKeyFor(username), {});
  const idx = QUARTERS.indexOf(uptoQuarter);
  if(idx<0) return null;
  let sum = 0, any = false;
  for(let i=0;i<=idx;i++){
    const qd = ach[QUARTERS[i]];
    const val = qd && qd.entries && qd.entries[activityId] ? qd.entries[activityId].achievement : "";
    const n = parseFloat(val);
    if(!isNaN(n)){ sum += n; any = true; }
  }
  return any ? sum : null;
}
function buildAchievementsCard(opts){
  const {activities, quarter, entries, dateEntered, readOnly, coAppraisal, ownerUsername} = opts;
  const coEditable = opts.coEditable !== false;
  const manual = !!(achCache[quarter] && achCache[quarter]._manualDate) && !readOnly;
  const rows = activities.map((a,i)=>{
    const e = entries[a.id] || {};
    const co = coAppraisal ? (coAppraisal.entries[a.id]||{}) : null;
    const cumulative = ownerUsername ? computeCumulative(ownerUsername, a.id, quarter) : null;
    let ratingCell = "";
    if(coAppraisal){
      const auto = calcRating(a.q?.[quarter], e.achievement);
      if(auto){
        ratingCell = `<td><div class="rating-auto"><span class="band">${auto.rating}</span> <span class="pct">(${auto.pct}%)</span><div class="label">${auto.label}</div></div></td>`;
      } else {
        ratingCell = `<td><select ${coEditable?"":"disabled"} onchange="onCoField('${a.id}','rating',this.value)">
          <option value="">-</option>
          ${[1,2,3,4,5].map(n=>`<option value="${n}" ${String(co.rating)===String(n)?"selected":""}>${n}</option>`).join("")}
        </select></td>`;
      }
    }
    return `
    <tr>
      <td>${i+1}</td>
      <td style="font-size:12.8px">${esc(a.activity)||'<span class="muted">—</span>'}</td>
      <td style="text-align:center">${esc(a.q?.[quarter])||"-"}</td>
      <td><input type="number" step="any" style="text-align:center" ${readOnly?"disabled":""} value="${esc(e.achievement)}" oninput="onAchField('${a.id}','achievement',this.value)" placeholder="-"/></td>
      <td style="text-align:center;color:var(--muted)">${cumulative===null?"—":cumulative}</td>
      <td><textarea rows="2" ${readOnly?"disabled":""} oninput="onAchField('${a.id}','notes',this.value)" placeholder="${esc(a.indicator)||'Performance indicator notes'}">${esc(e.notes)}</textarea></td>
      ${ratingCell}
      ${coAppraisal?`<td><textarea rows="2" ${coEditable?"":"disabled"} oninput="onCoField('${a.id}','comment',this.value)" placeholder="Supervisor remarks">${esc(co.comment)}</textarea></td>`:""}
    </tr>`;
  }).join("");

  const dateControls = readOnly
    ? `<span>${fmtDate(dateEntered)}</span>`
    : `
      <label><input type="radio" name="dmode" ${manual?"":"checked"} onchange="onDateModeChange(false)"/> Auto (today, ${fmtDate(todayISO())})</label>
      <label><input type="radio" name="dmode" ${manual?"checked":""} onchange="onDateModeChange(true)"/> Manual</label>
      ${manual?`<input type="date" style="width:160px" value="${esc(dateEntered)}" onchange="onManualDateChange(this.value)"/>`:""}
    `;

  const quarterPicker = opts.quarterPickerFn ? `
    <div class="row-actions">
      ${QUARTERS.map(q=>`<button class="pill ${quarter===q?'active':''}" onclick="${opts.quarterPickerFn}('${q}')">${q}</button>`).join("")}
    </div>` : "";

  const titleText = opts.titleOverride || (readOnly?"Quarterly Achievements — read-only":"Enter Quarterly Achievements");
  const subText = opts.subtitleOverride || (readOnly?"Appraisee's own entries. Not editable from this view.":"Record what was achieved against your planned target for the selected quarter.");

  const auditTrail = (!readOnly || coAppraisal) ? `
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">
      ${opts.submittedAt ? `Report submitted to supervisor on ${fmtDate(opts.submittedAt)}.` : "Not yet submitted to supervisor."}
      ${opts.reviewedAt ? ` Report reviewed on ${fmtDate(opts.reviewedAt)}${opts.reviewedBy?(' by '+esc(USERS[opts.reviewedBy]?.name||opts.reviewedBy)):''}.` : ""}
      ${(!readOnly && opts.rejectionComment) ? `<div class="status-note warn" style="margin-top:6px">Returned by your supervisor: "${esc(opts.rejectionComment)}"</div>` : ""}
    </div>` : "";

  return `
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">${titleText}</div>
        <div class="card-sub">${subText}</div>
      </div>
      ${quarterPicker}
    </div>
    <div class="card-body">
      ${activities.length===0 ? `<div class="muted">No planned activities found. Add them under Annual Plan first.</div>` : `
      <div class="date-row"><span style="color:var(--muted);font-weight:600">Date of entry:</span>${dateControls}</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>#</th><th style="min-width:200px">Agreed performance target</th><th style="width:80px">${quarter} target</th>
            <th style="width:90px">Achievement</th><th style="width:100px">Cumulative</th><th style="min-width:180px">Notes / indicator</th>
            ${coAppraisal?`<th style="width:70px">Rating</th><th style="min-width:160px">Supervisor comment</th>`:""}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${coAppraisal ? `<div class="rating-legend">Rating follows the Vihiga County SPAS rating scale (Form B, rev. July 2025), calculated automatically from % achievement against target — 5 Exceptional (&gt;100%), 4 Very Good (85–100%), 3 Good (65–84%), 2 Fair (50–64%), 1 Poor (≤49%). Shown as a manual dropdown when the target or achievement isn't a plain number.</div>` : ""}
      ${(!readOnly && !coAppraisal) ? `<div class="row-actions" style="margin-top:12px">${saveBtnHtml("ownach","onSaveOwnAchievements()","Save and Submit to Supervisor")}</div>` : ""}
      ${(coAppraisal && coEditable) ? `<div class="row-actions" style="margin-top:12px">${saveBtnHtml("co","onSaveCoAchievements()","Save")}<button class="btn btn-danger-outline" onclick="onReturnQuarterlyForRevision()">Return for Revision</button></div>` : ""}
      ${(coAppraisal && !coEditable) ? `<div class="status-note ok">Reviewed and locked for both of you.</div>` : ""}
      ${auditTrail}
      `}
    </div>
  </div>`;
}

const SNAPSHOT_TASKS = [
  {key:"annual", label:"Annual Targeting", kind:"approve"},
  {key:"midyear", label:"Mid-Year Review", kind:"signoff"},
  {key:"annualreview", label:"Annual Appraisal Report", kind:"signoff"},

function taskStatus(username, taskKey){
  if(taskKey==="annual"){
    const u = USERS[username];
    if(u && u.usesPC){
      const pc = getData(pcKeyFor(username), null);
      const filled = !!(pc && pc.rows && pc.rows.some(r=>r && r.selfScore!==""&&r.selfScore!==null&&r.selfScore!==undefined));
      return {filled, submitted: !!(pc && pc.appraiseeSignedAt), submittedDate: pc&&pc.appraiseeSignedAt, approved: !!(pc && pc.appraiseeSignedAt && pc.appraiserSignedAt), approvedDate: pc&&pc.appraiserSignedAt};

    return {filled, submitted: !!(my && my.appraiseeSignedAt), submittedDate: my&&my.appraiseeSignedAt, approved: !!(my && my.appraiseeSignedAt && my.supervisorSignedAt), approvedDate: my&&my.supervisorSignedAt};

function statusCellHtml(st, kind){
  if(st && st.notApplicable) return `<span style="color:var(--muted)">N/A</span>`;
  const doneLabel = kind==="review" ? "Supervisor Reviewed" : kind==="signoff" ? "Finalized" : "Approved";
  if(!st.filled) return `<span style="color:var(--muted)">Not filled</span>`;
  if(st.approved) return `<span style="color:var(--ink);font-weight:600">${doneLabel}${st.approvedDate?(' · '+fmtDate(st.approvedDate)):''}</span>`;
  if(st.submitted) return `<span style="color:var(--gold);font-weight:600">Submitted${st.submittedDate?(' · '+fmtDate(st.submittedDate)):''}</span>`;
  return `<span style="color:var(--muted)">In progress</span>`;
}
function statusCellText(st, kind){
  if(st && st.notApplicable) return "N/A";
  const doneLabel = kind==="review" ? "Supervisor Reviewed" : kind==="signoff" ? "Finalized" : "Approved";
  if(!st.filled) return "Not filled";
  if(st.approved) return `${doneLabel}${st.approvedDate?(' - '+fmtDate(st.approvedDate)):''}`;
  if(st.submitted) return `Submitted${st.submittedDate?(' - '+fmtDate(st.submittedDate)):''}`;
  return "In progress";
}

const SNAPSHOT_STATUS_OPTIONS = [
  {value:"not_filled", label:"Not filled"},
  {value:"in_progress", label:"In progress"},
  {value:"submitted", label:"Submitted (not yet approved)"},
  {value:"done", label:"Approved / Finalized"},
];
function matchesSnapshotFilter(uname){
  const u = USERS[uname] || {};
  if(snapshotFilter.department && (u.department || "Unspecified") !== snapshotFilter.department) return false;
  if(snapshotFilter.task){
    const st = taskStatus(uname, snapshotFilter.task);
    if(snapshotFilter.status==="not_filled" && st.filled) return false;
    if(snapshotFilter.status==="in_progress" && !(st.filled && !st.submitted)) return false;
    if(snapshotFilter.status==="submitted" && !(st.filled && st.submitted && !st.approved)) return false;
    if(snapshotFilter.status==="done" && !st.approved) return false;
  } else if(snapshotFilter.status){
    // A status without a task means: staff whose overall selected status
    // condition is true for at least one tracked task.
    const matches = SNAPSHOT_TASKS.some(t=>{
      const st = taskStatus(uname, t.key);
      if(snapshotFilter.status==="not_filled") return !st.filled;
      if(snapshotFilter.status==="in_progress") return st.filled && !st.submitted;
      if(snapshotFilter.status==="submitted") return st.filled && st.submitted && !st.approved;
      if(snapshotFilter.status==="done") return !!st.approved;
      return true;
    });
    if(!matches) return false;
  }
  return true;
}

      indicator: `Cat. ${r.category || ""} — Target: ${r.target || ""}${r.unit ? " " + r.unit : ""}`.trim()
    }));
    const myRec = ensureMidyearRecord(staffUsername, pcActivitiesForMidyear);
    const myEditable = windows.midYear === "open" && !midyearFinalized(myRec);
    midyearHtml = buildMidYearCard(staffUsername, myRec, myEditable, "supervisor");
    halfyearEvidenceHtml = buildEvidenceCard(staffUsername, "halfyear", false);
  }
  // A submitted controlled revision takes precedence over the ordinary
  // planning display, so the supervisor gets the dedicated revised-plan
  // decision controls (and never the Annual Review declaration).
  if(revisionPending){
    const catCards = PC_CATEGORIES.map(cat=>buildPCCategoryCard(staffUsername, rec, cat, {
      appraiseeEditable:false,
      reportAppraiseeEditable:false,
      appraiserEditable:false
    })).join("");
    const revisionReview = buildPCRevisionApprovalCard(staffUsername, rec);
    // This is a plan-content review (indicators/weights/targets), not real
    // annual scoring - no Overall Performance Summary here, matching the
    // appraisee's own Controlled Revision view.
    slot.innerHTML = employmentHtml +
      `<div class="card"><div class="card-head"><div><div class="card-title">Revised Performance Contract — Supervisor Review</div><div class="card-sub">The appraisee has revised the approved Performance Contract and submitted it for your review. This is a plan-approval action, not an Annual Performance Review.</div></div></div></div>` +
      revisionReview + catCards;
    return;
  }
  // Before Annual Reporting opens, the supervisor is reviewing the PC PLAN,
  // not an Annual Performance Review. Never fall through to the declaration
  // card merely because the plan has already been approved.
  if(pcPlanningPhase){
    const catCards = PC_CATEGORIES.map(cat=>buildPCCategoryCard(staffUsername, rec, cat, { appraiseeEditable:false, appraiserEditable:false })).join("");
    const pendingPlanRevision = getData("revision_requests", []).filter(r=>r.username===staffUsername && r.status==="pending_supervisor");
    const planRevisionHtml = pendingPlanRevision.length ? buildPendingRevisionsCard(pendingPlanRevision) : "";
    const planDecision = rec.pcPlanStatus === "pending_approval" ? `<div class="card"><div class="card-head"><div><div class="card-title">Performance Contract Plan — Supervisor Review</div><div class="card-sub">Review the indicators, weights and annual target figures submitted by the appraisee. You may approve the plan or refer it back for revision.</div></div></div><div class="card-body"><button class="btn btn-gold" onclick="onPCPlanDecision('${staffUsername}','approve')">Approve PC Plan</button> <button class="btn btn-danger-outline" onclick="onPCPlanDecision('${staffUsername}','return')">Return Plan for Revision</button></div></div>` : `<div class="status-note ${rec.pcPlanStatus==='approved'?'ok':''}">${rec.pcPlanStatus==='approved'?`Approved by ${esc(USERS[rec.pcPlanApprovedBy]?.name || rec.pcPlanApprovedBy || SESSION)} on ${fmtDate(rec.pcPlanApprovedAt)}.`:rec.pcPlanRejectionComment?'Returned for revision: '+esc(rec.pcPlanRejectionComment):'Performance Contract plan is still being prepared by the appraisee.'}</div>`;
    // Only Sections A–G are shown at planning phase — no scoring has happened
    // yet, so the Overall Performance Summary (which shows scores) belongs
    // only once Annual Reporting has opened.
    slot.innerHTML = employmentHtml + planRevisionHtml + planDecision + catCards + midyearHtml + halfyearEvidenceHtml + buildRoutingStatusNote(staffUsername, "halfyear");
    return;
  }
  const editable = windows.annual === "open" && !pcFinalized(rec);
  const catCards = PC_CATEGORIES.map(cat=>buildPCCategoryCard(staffUsername, rec, cat, { appraiseeEditable:false, appraiserEditable: editable && !!rec.appraiseeSignedAt && !rec.appraiserSignedAt })).join("");
  const overallSelf = pcOverallScore(rec.rows, "selfScore");
  const overallFinal = pcOverallScore(rec.rows, "appraiserScore");
  const summaryHtml = buildPCSummaryCard(rec, overallSelf, overallFinal);
  const declarationHtml = buildPCDeclarationCard(staffUsername, rec, editable, "supervisor");
  const pendingRevisions = getData("revision_requests", []).filter(r=>r.username===staffUsername && r.status==="pending_supervisor");
  const revisionsHtml = pendingRevisions.length ? buildPendingRevisionsCard(pendingRevisions) : "";
  slot.innerHTML = employmentHtml + revisionsHtml + catCards + summaryHtml + declarationHtml + midyearHtml + halfyearEvidenceHtml + buildRoutingStatusNote(staffUsername, "halfyear") + buildRoutingStatusNote(staffUsername, "annual");
}

async function clearPCRevisionSubmissionNotifications(username){

async function onPCRevisionDecision(username, decision){
  const rec = getData(pcKeyFor(username), null);
  if(!rec || !rec.planRevisionPendingApproval || !rec.appraiseeSignedAt || rec.appraiserSignedAt){
    showFlash("This revised Performance Contract is not awaiting supervisor approval.", "err");
    return;
  }
  const req = getData("revision_requests", []).find(r=>r.username===username && r.status==="approved_unlocked");
  if(decision === "approve"){
    rec.pcPlanStatus = "approved";
    rec.pcPlanApprovedAt = todayISO();
    rec.pcPlanApprovedBy = SESSION;
    rec.pcPlanRejectionComment = "";
    rec.planRevisionPendingApproval = false;
    rec.planRevisionUnlocked = false;
    // These fields belong to the Annual Performance Review and must not be
    // populated merely because a revised PC plan was approved.
    rec.appraiseeSignedAt = null;
    rec.appraiseeSignedBy = null;
    rec.appraiserSignedAt = null;
    rec.appraiserSignedBy = null;
    setData(pcKeyFor(username), rec);
    try{ await persistKeyToSupabase(pcKeyFor(username), rec); }catch(e){ console.error("PC revision approval persistence failed", e); }
    if(req){
      const list=getData("revision_requests",[]);
      const r=list.find(x=>x.id===req.id);
      if(r){ r.status="approved_unlocked"; r.adminActionAt=r.adminActionAt||todayISO(); }
      setData("revision_requests",list);
    }
    await clearPCPlanDecisionNotifications(username);
    await createNotification(username, "pc_revision_approved", "Revised Performance Contract approved", `Your revised Performance Contract has been approved by ${USERS[SESSION]?.name || "your supervisor"}.`, null);
    showFlash("Revised Performance Contract approved.");
  } else {
    const comment=prompt("What should be revised in the Performance Contract plan?");
    if(comment===null) return;
    rec.pcPlanStatus="approved";
    rec.pcPlanRejectionComment=comment.trim() || "Returned for revision.";
    rec.planRevisionPendingApproval=false;
    rec.planRevisionUnlocked=true;
    rec.appraiseeSignedAt=null; rec.appraiseeSignedBy=null;
    rec.appraiserSignedAt=null; rec.appraiserSignedBy=null;
    setData(pcKeyFor(username),rec);
    try{ await persistKeyToSupabase(pcKeyFor(username),rec); }catch(e){ console.error("PC revision return persistence failed", e); }
    await clearPCPlanDecisionNotifications(username);
    const revisionReq = getData("revision_requests", []).find(r=>r.username===username && r.status==="approved_unlocked");
    // Keep the durable request in approved_unlocked: that state means the
    // administrator has authorised the controlled revision cycle. The PC
    // record's planRevisionUnlocked flag is what re-opens editing after a
    // supervisor returns the revised plan.
    if(revisionReq){
      const ns=getData("notifications",[]);
      const readAt=new Date().toISOString();
      ns.forEach(n=>{
        if(n.recipientUsername===username && !n.readAt && n.relatedRequestId===revisionReq.id && n.type==="pc_revision_unlocked") n.readAt=readAt;
      });
      setData("notifications",ns);
      if(sb && USERNAME_TO_ID[username]) void sb.from("notifications").update({read_at:readAt})
        .eq("recipient_id",USERNAME_TO_ID[username]).eq("related_request_id",revisionReq.id).eq("notification_type","pc_revision_unlocked").is("read_at",null);
    }
    await createNotification(username,"pc_revision_returned","Revised PC plan returned for revision",`Your revised PC plan was returned by ${USERS[SESSION]?.name || "your supervisor"}. Reason: ${rec.pcPlanRejectionComment}`,revisionReq ? revisionReq.id : null);
    showFlash("Revised Performance Contract returned for revision.");
  }
  renderView(USERS[SESSION]);
  refreshTopBar();
}

async function onApproveRevisionRequest(id){
  const list = getData("revision_requests", []);
  const r = list.find(x=>x.id===id);
  if(!r) return;
  r.status = "pending_admin"; r.supervisorActionAt = todayISO();
  setData("revision_requests", list);
  await clearRevisionRequestNotificationForCurrentUser(r.id);
  const isPC = !!USERS[r.username]?.usesPC;
  const label = isPC ? "Performance Contract Plan" : "Annual Plan";
  void createNotification(
    r.username,
    isPC ? "pc_revision_supervisor_approved" : "plan_revision_supervisor_approved",
    isPC ? "Performance Contract Plan revision request approved by appraiser" : "Annual Plan revision request approved by appraiser",
    isPC ? "Your Performance Contract Plan revision request was approved by your appraiser and sent to the administrator for unlocking." : "Your Annual Plan revision request was approved by your appraiser and sent to the administrator for unlocking.",
    r.id
  );
  // Notify every admin who would actually see this in their Pending Requests
  // queue - department-scoped dept admins for this officer's department, plus
  // every system admin. Previously nothing notified them at all - it only
  // ever showed up if they happened to visit the tab and look.
  const appraiseeDept = USERS[r.username]?.department;
  Object.entries(USERS).forEach(([auname,au])=>{
    if(au.isSystemAdmin || (au.isDeptAdmin && au.department===appraiseeDept)){
      void createNotification(
        auname,
        isPC ? "pc_revision_pending_admin" : "plan_revision_pending_admin",
        `${label} revision request awaiting your action`,
        `${USERS[r.username]?.name || r.username}'s ${label} revision request has been approved by their supervisor and needs your decision to unlock it.`,
        r.id
      );
    }
  });
  showFlash(isPC ? "Sent to admin to unlock the Performance Contract." : "Sent to admin to unlock the plan.");
  renderView(USERS[SESSION]);
}

function onAdminUnlockPlan(id){
  const list = getData("revision_requests", []);
  const r = list.find(x=>x.id===id);
  if(!r) return;
  const user = USERS[r.username];

  // PC has no separate Form 1A/plan object. Its approved/sign-off state is held
  // in the PC record itself, so unlock the PC directly for a PC staff member.
  if(user && user.usesPC){
    const pc = getData(pcKeyFor(r.username), null);
    if(!pc){ showFlash("Performance Contract record could not be found.", "err"); return; }
    pc.appraiseeSignedBy = null;
    pc.appraiseeSignedAt = null;
    pc.appraiserSignedBy = null;
    pc.appraiserSignedAt = null;
    pc.submittedAt = null;
    pc.rejectionComment = "Revision approved by administrator. Please revise and resubmit the Performance Contract.";
    pc.planRevisionUnlocked = true;
    pc.planRevisionPendingApproval = false;
    setData(pcKeyFor(r.username), pc);
    // Persist the unlock immediately. If the administrator session is blocked by
    // RLS, the durable revision request remains the source of truth and the
    // appraisee will bootstrap the unlock on next login.
    void persistKeyToSupabase(pcKeyFor(r.username), pc).catch(e=>console.error("Administrator PC revision unlock persistence failed:", e));
    // This is a planning revision unlock, not an annual reporting-window open.
    // The annual reporting window must remain untouched.
    r.status = "approved_unlocked"; r.adminActionAt = todayISO();
    setData("revision_requests", list);
    // The supervisor/admin request has now been acted upon. Clear its unread
    // badge before creating the appraisee's unlock notification.
    const oldNs = getData("notifications", []);
    const oldNow = new Date().toISOString();
    oldNs.forEach(n=>{ if(n.relatedRequestId===r.id && !n.readAt) n.readAt=oldNow; });
    setData("notifications", oldNs);
    if(sb) void sb.from("notifications").update({read_at:oldNow}).eq("related_request_id",r.id).is("read_at",null);
    void createNotification(
      r.username,
      "pc_revision_unlocked",
      "Performance Contract revision approved",
      "Your Performance Contract has been unlocked for the approved revision. Please revise and resubmit it.",
      r.id
    );
    showFlash("Performance Contract unlocked — " + (user.name || r.username) + " can now edit and resubmit it.");
    renderView(USERS[SESSION]);
    return;
  }

  const plan = getData(planKeyFor(r.username), {activities:[]});
  ensurePlanStatus(plan);
  plan.status = "draft"; plan.submittedAt = null;
  plan.rejectionComment = "Revision approved by administrator. Please revise and resubmit the plan.";
  setData(planKeyFor(r.username), plan);
  // reopen Form 1A's quarterly targeting alongside SPAS Form B Section 2A — they were locked together
  const qt = ensureQTargetingRecord(r.username);
  if(qt.status === "approved" || qt.status === "pending_approval"){
    qt.status = "draft"; qt.submittedAt = null; qt.rejectionComment = "Targets are being revised on SPAS Form B.";
    setData(qtargetingKeyFor(r.username), qt);
  }
  r.status = "approved_unlocked"; r.adminActionAt = todayISO();
  setData("revision_requests", list);
  // The supervisor/admin request has now been acted upon. Clear its unread
  // badge before creating the appraisee's unlock notification - matches the
  // PC branch above, which already did this correctly.
  const oldNs = getData("notifications", []);
  const oldNow = new Date().toISOString();
  oldNs.forEach(n=>{ if(n.relatedRequestId===r.id && !n.readAt) n.readAt=oldNow; });
  setData("notifications", oldNs);
  if(sb) void sb.from("notifications").update({read_at:oldNow}).eq("related_request_id",r.id).is("read_at",null);
  void createNotification(
    r.username,
    "plan_revision_unlocked",
    "Annual Plan revision approved",
    "Your Annual Plan has been unlocked for the approved revision. Please revise and resubmit it.",
    r.id
  );
  showFlash("Plan and quarterly targeting unlocked — " + (user?.name || r.username) + " can now edit them.");
  renderView(USERS[SESSION]);
}

const WINDOW_COMBOS = [
  { value:"halfYearCombo", label:"Half-Year Review (Mid-Year + Q2 Report)", fields:["midYear","Q2"] },
  { value:"annualCombo", label:"Annual Review (SPAS Form B + Q4 Report)", fields:["annual","Q4"] },
];
let windowCadreFilter = "B"; // "A" | "B" — which officers/window-options the Review Windows card shows
function setWindowCadreFilter(v){ windowCadreFilter = v; windowSelection = new Set(); renderView(USERS[SESSION]); }
function onWindowBatchAction(action){
  const field = document.getElementById("winFieldSelect").value;
  if(!field){ showFlash("Select a review window first.", "err"); return; }
  if(windowSelection.size===0){ showFlash("Select at least one staff member first.", "err"); return; }
  const state = action==="open" ? "open" : "closed";
  const closeDateInput = document.getElementById("winCloseDate");
  const closeDate = action==="open" && closeDateInput ? closeDateInput.value : "";
  if(action === "open" && windowCadreFilter === "PC" && (field === "annual" || field === "midYear")){
    const notApproved = [...windowSelection].filter(uname=>{
      const rec = getData(pcKeyFor(uname), null);
      return !rec || rec.pcPlanStatus !== "approved";
    });
    if(notApproved.length){
      showFlash(`Cannot open ${field==="annual"?"Annual PC reporting":"PC Mid-Year Review"} for ${notApproved.length} selected officer(s): their Performance Contract plan must first be approved.`, "err");
      return;
    }
  }
  const combo = WINDOW_COMBOS.find(c=>c.value===field);
  const closeoutNote = closeDate ? ` (closes ${closeDate})` : "";
  if(combo){
    combo.fields.forEach(f=>setWindowState([...windowSelection], f, state, closeDate));
    showFlash(`${combo.label} ${action==="open"?"opened":"closed"} for ${windowSelection.size} staff member(s)${action==="open"?closeoutNote:""}.`);
  } else {
    setWindowState([...windowSelection], field, state, closeDate);
    showFlash(`${WINDOW_LABELS[field]} ${action==="open"?"opened":"closed"} for ${windowSelection.size} staff member(s)${action==="open"?closeoutNote:""}.`);
  }
  windowSelection = new Set();
  renderView(USERS[SESSION]);
}
function windowPill(state, closeDate){
  const label = state==="open" ? "Open" : state==="closed" ? "Closed" : "Not open";
  const sub = (state==="open" && closeDate) ? ` <span style="opacity:.7;font-weight:400">· closes ${esc(closeDate)}</span>` : "";
  return `<span class="pill" style="cursor:default">${label}${sub}</span>`;
}
function buildFiscalYearCard(){
  return `<div class="card">

    <div class="card-body">
      <div style="margin-bottom:12px">${KNOWN_FYS.map(fy=>`<span class="pill" style="margin-right:6px">${esc(fy)}${fy===CURRENT_FY?" (current)":""}</span>`).join("")}</div>
      <div class="row-actions">
        <input type="text" id="newFYInput" placeholder="e.g. 2026/2027" style="max-width:200px"/>
        <button class="btn btn-gold" onclick="onOpenNewFiscalYear()">Open as new current year</button>
      </div>
    </div>
  </div>`;
}
async function onOpenNewFiscalYear(){
  const input = document.getElementById("newFYInput");
  const newFY = input ? input.value.trim() : "";
  if(!newFY){ showFlash("Enter a fiscal year, e.g. 2026/2027.", "err"); return; }
  const { error: clearErr } = await sb.from("fiscal_years").update({ is_current:false }).eq("is_current", true);
  if(clearErr){ showFlash("Could not update fiscal years: " + clearErr.message, "err"); return; }
  const { error: upsertErr } = await sb.from("fiscal_years").upsert({ fy:newFY, is_current:true, created_by: idFor(SESSION) }, {onConflict:"fy"});
  if(upsertErr){ showFlash("Could not open the new year: " + upsertErr.message, "err"); return; }
  if(!KNOWN_FYS.includes(newFY)) KNOWN_FYS = [...KNOWN_FYS, newFY].sort();
  CURRENT_FY = newFY;
  FY = newFY;
  showFlash(`FY ${newFY} is now the current year.`);
  renderApp();
}

      <div class="row-actions" style="margin-bottom:14px">
        <button class="pill ${windowCadreFilter==='A'?'active':''}" onclick="setWindowCadreFilter('A')">SPAS A</button>
        <button class="pill ${windowCadreFilter==='B'?'active':''}" onclick="setWindowCadreFilter('B')">SPAS B</button>
        <button class="pill ${windowCadreFilter==='PC'?'active':''}" onclick="setWindowCadreFilter('PC')">Performance Contract</button>
      </div>
      ${cadreScoped.length===0 ? `<div class="muted">No staff on this track in scope yet.</div>` : `
      <div class="row-actions" style="margin-bottom:12px">
        <select id="winFieldSelect" style="width:auto">

            <th><input type="checkbox" ${cadreScoped.length>0 && cadreScoped.every(([uname])=>windowSelection.has(uname))?"checked":""} onchange='toggleWindowSelectAll(this.checked, ${scopedUsernamesJson})'/></th>

    </div>
  </div>`;
}

function visibleUsersFor(me){
  const entries = Object.entries(USERS);
  if(me.isSystemAdmin) return sortByName(entries);
  // department admin: scoped to own department only
  return sortByName(entries.filter(([uname,u]) => u.department === me.department));
}

function setAdminSubTab(v){
  adminSubTab = v;
  // Performance Review Windows opens/closes windows for staff going
  // forward - it's an action panel tied to the current year, not a
  // historical viewer, so switching to it always snaps back to the
  // current fiscal year (the viewing-year selector is hidden here too,
  // see renderTopBar) rather than silently acting on a past year left
  // selected from another tab.
  if(v==="windows" && FY!==CURRENT_FY){ FY = CURRENT_FY; planCache = null; achCache = {}; teamActive = null; }
  const topbarEl = document.querySelector(".topbar");
  if(topbarEl && USERS[SESSION]) topbarEl.outerHTML = renderTopBar(USERS[SESSION]);
  renderView(USERS[SESSION]);
}
function setAdminStaffSubTab(v){
  // New staff can only ever be added against the current FY's windows, so
  // the "Add New Staff" tab itself is disabled (not just the form inside
  // it) whenever a past, read-only fiscal year is selected. Editing an
  // existing officer's profile reuses this same "add" sub-tab (see
  // onEditUser) and is deliberately NOT blocked here, since a profile isn't
  // FY-scoped data - this guard only stops switching INTO the tab via its
  // own pill, which is only ever used for genuinely adding someone new.
  if(v==="add" && FY!==CURRENT_FY){
    showFlash(`You're viewing FY ${FY} (read-only). Switch to the current year (${CURRENT_FY}) to add new staff.`, "err");
    return;
  }
  adminStaffSubTab = v;
  renderView(USERS[SESSION]);
}
