name: Build SPMS Android APK

on:
  push:
    branches:
      - test/ao-progress-map
    paths:
      - 'index.html'
      - 'icons/**'
      - 'config.js'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get SPMS source (working branch)
        uses: actions/checkout@v4
        with:
          ref: test/ao-progress-map

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        shell: bash
        run: |
          mkdir -p www
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|android/*|www/*|.git/*|assets/*)
                continue ;;
            esac
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done < <(git ls-files -z)

          test -f www/index.html
          echo "--- www/ contents ---"
          find www -maxdepth 2 -type f | sort

      - name: Configure Capacitor (fit content between system bars)
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7 esbuild
          # Installed Printer for PDF, Filesystem & Share for Excel/CSV/Word exports
          npm install @capgo/capacitor-printer@7 @capacitor/filesystem@7 @capacitor/share@7

          npx cap init "Vihiga SPMS" \
            "ke.go.vihiga.spms" \
            --web-dir www

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          // Ensure SystemBars inset handling is NOT disabled
          if (config.plugins && config.plugins.SystemBars) {
            delete config.plugins.SystemBars;
          }

          // Force the native WebView to sit inside the status/nav bars
          config.android = {
            ...(config.android ?? {}),
            adjustMarginsForEdgeToEdge: 'force'
          };

          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log(fs.readFileSync(path, 'utf8'));
          NODE

      - name: Create Android project
        run: npx cap add android

      - name: Generate Vihiga Android launcher icons
        run: |
          npm install --save-dev @capacitor/assets@3 sharp

          mkdir -p assets

          node --input-type=module <<'NODE'
          import sharp from 'sharp';

          await sharp('icons/icon-512.png')
            .resize(1024, 1024, {
              fit: 'contain',
              background: '#ffffff'
            })
            .png()
            .toFile('assets/icon.png');
          NODE

          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF'

      - name: Add Android print and download bridge
        shell: bash
        run: |
          cat > native-bridge-entry.js <<'JS'
          import { Capacitor } from '@capacitor/core';
          import { Printer } from '@capgo/capacitor-printer';
          import { Filesystem, Directory } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';

          function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            })[char]);
          }

          // --- PDF PRINTING BRIDGE ---
          window.SPMSNativePrinter = {
            async printReport(name, reportMarkup) {
              const styles = Array.from(document.querySelectorAll('style'))
                .map((style) => style.textContent || '')
                .join('\n');

              const html = `<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${escapeHtml(name || 'SPMS Report')}</title>
            <style>${styles}</style>
          </head>
          <body>
            <div id="printArea">${reportMarkup}</div>
          </body>
          </html>`;

              await Printer.printHtml({
                name: name || 'SPMS Report',
                html
              });
            }
          };

          // --- FILE DOWNLOAD BRIDGE (Excel, CSV, Word) ---
          window.SPMSNativeBridge = {
            async downloadFile(base64Data, fileName) {
              try {
                // Strip the data URI prefix if present
                const base64Clean = base64Data.replace(/^data:.*?;base64,/, '');

                // 1. Write to Android's hidden cache
                const result = await Filesystem.writeFile({
                  path: fileName,
                  data: base64Clean,
                  directory: Directory.Cache
                });

                // 2. Open the Android Share menu so user can save or open it
                await Share.share({
                  title: 'Export Complete',
                  text: 'Save or open your file: ' + fileName,
                  url: result.uri,
                  dialogTitle: 'Save or Open File'
                });
              } catch (e) {
                console.error('Download failed', e);
                alert('Failed to save file: ' + e.message);
              }
            }
          };

          if (Capacitor.isNativePlatform()) {
            console.log('SPMS native bridges ready');
          }
          JS

          npx esbuild native-bridge-entry.js \
            --bundle --platform=browser --format=iife \
            --outfile=www/spms-native-bridge.js

          python3 - <<'PY'
          from pathlib import Path

          p = Path('www/index.html')
          html = p.read_text(encoding='utf-8')

          if 'spms-native-bridge.js' not in html:
              marker = '</body>'
              head, sep, tail = html.rpartition(marker)

              if not sep:
                  raise SystemExit(
                      'Could not find final </body> in www/index.html'
                  )

              html = (
                  head
                  + '<script src="spms-native-bridge.js"></script>\n'
                  + marker
                  + tail
              )

              p.write_text(html, encoding='utf-8')
          PY

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Vihiga-SPMS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
