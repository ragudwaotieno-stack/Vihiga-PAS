<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#0F3D2E" />
<!-- APP VERSION: the ONE place to change. Format YYYY.MM.DD.N. Shown on the login screen and in the top bar; also used by the update-available banner. -->
<meta name="app-version" content="2026.10.22.1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Vihiga SPMS" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Staff Performance Management System — County Government of Vihiga</title>
<style>
  :root{ color-scheme: light; }
  html{ color-scheme: light; }
  :root{
    --ink:#0F3D2E; --paper:#FAF7F0; --paperDeep:#F1ECE0; --gold:#B8862B; --goldSoft:#DCC38A;
    --brown:#FDF3DD; --brownBorder:#E7CE9B; --line:#D9D2C0; --text:#26241C; --muted:#6B6553; --danger:#A33B2A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
  input,textarea,select,button{font-family:inherit;font-size:13.5px;color-scheme:light}
  input[type=text],input[type=password],input[type=date],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#ffffff!important;color:#26241C!important;
  }
  textarea{resize:vertical}
  input:disabled,textarea:disabled{background:var(--brown)!important;border-color:var(--brownBorder)!important;color:var(--muted)!important}
  label.field-label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
  .btn{border:none;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px;padding:9px 16px}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn:disabled{opacity:.5;cursor:default}
  .link-btn{background:none;border:none;cursor:pointer;font-weight:600;font-size:12.5px}
  .link-btn.is-link{color:#0b5cad;text-decoration:underline;text-underline-offset:3px;font-size:13.5px;padding:2px 0}
  .link-btn.is-link:hover{color:#08427a}
  .link-btn.chip{display:inline-block;color:#0b5cad;border:1px solid #9db9d9;background:#eef4fb;border-radius:14px;padding:4px 10px;margin:2px 6px 2px 0;font-size:12px;text-decoration:none}
  .link-btn.chip:hover{background:#dde9f7}
  table{width:100%;border-collapse:collapse;font-size:12.8px}
  th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .muted{color:var(--muted);font-size:13px;padding:10px 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
  .card-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--paperDeep);gap:12px;flex-wrap:wrap}
  .card-title{font-family:Georgia,serif;font-size:16.5px;color:var(--ink)}
  .card-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .card-body{padding:20px}
  .topbar{background:var(--ink);color:var(--paper)}
  .topbar-inner{max-width:1120px;margin:0 auto;padding:14px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
  .brand-title{font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:.3px}
  .brand-sub{font-size:12px;opacity:.75;margin-top:2px}
  .who{text-align:right;font-size:12px;opacity:.9;padding-bottom:4px}
  .who .name{font-weight:600}
  .who .desig{opacity:.75}
  .logout-btn{margin-top:4px;background:transparent;border:1px solid var(--goldSoft);color:var(--goldSoft);border-radius:6px;padding:3px 10px;font-size:11.5px;cursor:pointer}
  nav.tabs{max-width:1120px;margin:0 auto;padding:12px 20px 0;display:flex;gap:4px;flex-wrap:wrap}
  nav.tabs button{padding:9px 16px;font-size:13.5px;font-weight:600;border:none;border-bottom:3px solid transparent;background:transparent;color:rgba(255,255,255,.65);cursor:pointer}
  nav.tabs button.active{border-bottom:3px solid var(--gold);color:#fff}
  main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
  .pill{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text)}
  .pill.active{border-color:var(--ink);background:var(--ink);color:#fff}
  .pill:disabled{cursor:not-allowed;opacity:.45}
  .staff-header{background:var(--brown);border:1px solid var(--brownBorder);border-radius:10px;padding:14px 18px;margin-bottom:18px;display:flex;gap:28px;flex-wrap:wrap;font-size:12.5px}
  .flash{position:fixed;top:14px;right:14px;z-index:50;padding:10px 16px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .flash.ok{background:#E7F2EA;border:1px solid var(--ink);color:var(--ink)}
  .flash.err{background:#FBE7E2;border:1px solid var(--danger);color:var(--danger)}
  .login-wrap{min-height:100vh;background:linear-gradient(180deg,var(--ink) 0,var(--ink) 220px,var(--paper) 220px)}
  .login-inner{max-width:420px;margin:0 auto;padding-top:46px;display:flex;flex-direction:column;align-items:center}
  .badge{width:46px;height:46px;border-radius:50%;border:2px solid var(--goldSoft);display:flex;align-items:center;justify-content:center;color:var(--goldSoft);font-family:Georgia,serif;font-size:18px;margin-bottom:14px}
  .login-title{color:#fff;font-family:Georgia,'Times New Roman',serif;font-size:22px;text-align:center}
  .login-sub{color:rgba(255,255,255,.7);font-size:12.5px;text-align:center;margin-top:6px;line-height:1.5}
  form.login-card{background:#fff;width:100%;margin-top:34px;border-radius:10px;padding:26px 24px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
  .login-err{color:var(--danger);font-size:12.5px;margin-top:10px}
  .login-hint{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
  .login-foot{color:#5f5a4c;font-size:12px;margin-top:22px;text-align:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}}
  .checks{display:flex;align-items:center;gap:18px;padding-top:22px;flex-wrap:wrap}
  .checks label{display:flex;align-items:center;gap:6px;font-size:13px}
  .date-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;font-size:12.5px;flex-wrap:wrap}
  .date-row label{display:flex;align-items:center;gap:5px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .x-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px}
  .status-note{background:var(--paperDeep);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--text);margin:0 0 16px}
  .status-note.ok{background:#E7F2EA;border-color:var(--ink)}
  .status-note.warn{background:#FBE7E2;border-color:var(--danger);color:var(--danger)}
  .pass-wrap{position:relative}
  .pass-toggle{position:absolute;right:8px;top:8px;background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted);font-weight:600}
  .rating-auto{font-size:12px}
  .rating-auto .band{font-weight:600}
  .rating-auto .pct{color:var(--muted);font-weight:400}
  .rating-auto .label{font-size:10.5px;color:var(--muted)}
  .rating-legend{font-size:11px;color:var(--muted);margin-top:6px}
  .col-locked-appraisee{background:#f0e6d2!important}
  .col-locked-appraisee:disabled{background:#f0e6d2!important;-webkit-text-fill-color:#6b5a3a;opacity:1}
  #printArea{display:none}
  .print-header{display:none;text-align:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
  .print-header img{width:52px;height:auto;margin:6px auto;display:block}
  .print-header-line1{font-family:Georgia,serif;font-size:16px;font-weight:700;color:var(--ink);text-align:center}
  .print-header-line2{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--ink);text-align:center}
  .print-header p{font-size:12px;color:var(--muted);margin:4px 0 0;text-align:center}
  .print-section-break{page-break-before:always}
  @media print{
    body > *:not(#printArea){display:none!important}
    #printArea{display:block!important}
    .print-header{display:block!important}
    .card{border:1px solid #999!important;box-shadow:none!important;break-inside:avoid;margin-bottom:14px!important}
    .card-head{background:#eee!important}
    button, .btn, .row-actions, .pill, .x-remove, input[type=checkbox], .pass-toggle{display:none!important}
    input, textarea, select{border:none!important;background:none!important;color:#000!important;-webkit-appearance:none}
  }
</style>
</head>

let CURRENT_FY = "2025/2026"; // the real, admin-set active year — everyone reads this from fiscal_years
let KNOWN_FYS = ["2025/2026"]; // every fiscal year on record, for the viewing-year selector
const QUARTERS = ["Q1","Q2","Q3","Q4"];
const QLABEL = {Q1:"1st Quarter",Q2:"2nd Quarter",Q3:"3rd Quarter",Q4:"4th Quarter"};

/* ============================================================================
   BACKEND ADAPTER — write-through cache over Supabase
   ============================================================================
   getData(key, fallback) / setData(key, value) keep their EXACT original
   synchronous signature. Every call site elsewhere in this file (there are
   hundreds) is completely unaware anything changed. This is the ONLY section
   that would need to change for a different backend (self-hosted Supabase,
   PocketBase, a custom API, etc.) — everything below this block is agnostic
   to where the data actually lives.

   How it works:
   - On login, hydrateCache() fetches everything this user is allowed to see
     (RLS-scoped) into an in-memory CACHE object, keyed exactly like the old
     localStorage keys were.
   - getData() reads CACHE synchronously — instant, same as before.
   - setData() writes CACHE synchronously (so the UI sees it immediately) AND
     queues a background save to Supabase. The caller never waits on the
     network call.
   - Known trade-off: two people editing the exact same field at the exact
     same instant could have one save overwrite the other. This is no worse
     than the risk already inherent in the app's save-then-navigate pattern.
   ============================================================================ */

/* Connection settings live in config.js (loaded before this script), NOT here.
   To point the app at a different server, edit config.js only. */
const SPMS_CONFIG = window.SPMS_CONFIG || {};
var sb = (window.supabase && SPMS_CONFIG.supabaseUrl && SPMS_CONFIG.supabaseKey)
  ? window.supabase.createClient(SPMS_CONFIG.supabaseUrl, SPMS_CONFIG.supabaseKey) : null;

let CACHE = {};                 // mirrors the old localStorage keyspace, in memory
let USERNAME_TO_ID = {};        // username -> Supabase profiles.id (uuid)
let ID_TO_USERNAME = {};        // profiles.id -> username
const SYNTHETIC_EMAIL_DOMAIN = "vihiga-pas.internal";
function emailFor(username){ return `${username}@${SYNTHETIC_EMAIL_DOMAIN}`; }

/* ============================================================================
   BACKEND — the single named doorway to the server.
   Every feature outside this adapter section calls BACKEND.<something> and
   never touches the Supabase client (sb) directly. To move to another server,
   this object plus persistKeyToSupabase() / hydrateCache() is the whole job;
   nothing else in the file knows who the provider is.
   Methods resolve to { error } (null when it worked) so callers keep their
   existing messages.
   ============================================================================ */
const BACKEND = {
  available(){ return !!sb; },

  /* ---- login / session ---- */
  async signIn(username, password){
    const { data, error } = await sb.auth.signInWithPassword({ email: emailFor(username), password });
    return { error: error || null, hasSession: !!(data && data.session) };
  },
  async signOut(){ if(sb){ try{ await sb.auth.signOut(); }catch(e){} } },

  /* ---- password reset requests ---- */
  // Runs BEFORE login (anonymous): inserts only the requested username.
  async requestPasswordReset(username, requestedAt){
    const { error } = await sb.from("password_reset_requests").insert({ requested_username: username, requested_at: requestedAt, status: "pending" });
    return { error: error || null };
  },
  async resolvePasswordReset(userId, username){
    const { error } = await sb.from("password_reset_requests").update({ status: "resolved" })
      .or(`user_id.eq.${userId},requested_username.eq.${username}`);
    return { error: error || null };
  },

  /* ---- notifications ---- */
  async notifUpsert(row){
    const { error } = await sb.from("notifications").upsert(row, { onConflict: "id" });
    return { error: error || null };
  },
  // Mark notifications read. Filter keys (all optional, combined with AND):
  //   ids[], recipientId, type, types[], relatedRequestId, unreadOnly
  async notifMarkRead(readAt, f){
    let q = sb.from("notifications").update({ read_at: readAt });
    if(f.ids) q = q.in("id", f.ids);
    if(f.recipientId) q = q.eq("recipient_id", f.recipientId);
    if(f.type) q = q.eq("notification_type", f.type);
    if(f.types) q = q.in("notification_type", f.types);
    if(f.relatedRequestId) q = q.eq("related_request_id", f.relatedRequestId);
    if(f.unreadOnly) q = q.is("read_at", null);
    const { error } = await q;
    return { error: error || null };
  },

  /* ---- evidence files (the file bytes) ---- */
  // Uploads one file and reports real progress: onProgress(bytesSent, bytesTotal).
  // Uses XMLHttpRequest because the standard fetch call cannot report upload
  // progress. No time limit is set, so a very slow connection just takes longer.
  async evidenceUpload(path, blob, onProgress){
    try{
      const { data } = await sb.auth.getSession();
      const token = data && data.session && data.session.access_token;
      if(!token) return { error: { message: "You are not signed in — log in again and retry." } };
      const url = String(SPMS_CONFIG.supabaseUrl).replace(/\/+$/,"") + "/storage/v1/object/evidence/" + path.split("/").map(encodeURIComponent).join("/");
      const form = new FormData();
      form.append("cacheControl", "3600");
      form.append("", blob);
      return await new Promise(resolve=>{
        const x = new XMLHttpRequest();
        x.open("POST", url);
        x.setRequestHeader("Authorization", "Bearer " + token);
        x.setRequestHeader("apikey", SPMS_CONFIG.supabaseKey);
        x.setRequestHeader("x-upsert", "true");
        x.timeout = 0;
        x.upload.onprogress = e=>{ if(onProgress && e.lengthComputable) onProgress(e.loaded, e.total); };
        x.onload = ()=>{
          if(x.status >= 200 && x.status < 300) return resolve({ error: null });
          let msg = "Upload failed (error " + x.status + ")";
          try{ const j = JSON.parse(x.responseText); msg = j.message || j.error || msg; }catch(e){}
          resolve({ error: { message: msg } });
        };
        x.onerror = ()=>resolve({ error: { message: "Network error — check your connection." } });
        x.onabort = ()=>resolve({ error: { message: "Upload was cancelled." } });
        x.send(form);
      });
    }catch(e){ return { error: { message: (e && e.message) || "Upload failed." } }; }
  },
  async evidenceRemove(path){
    const { error } = await sb.storage.from("evidence").remove([path]);
    return { error: error || null };
  },
  // Short-lived download link for one file.
  async evidenceLink(path, seconds){
    const { data, error } = await sb.storage.from("evidence").createSignedUrl(path, seconds || 60);
    return { url: (data && data.signedUrl) || null, error: error || null };
  },

  /* ---- fiscal years ---- */
  async fiscalYearClearCurrent(){
    const { error } = await sb.from("fiscal_years").update({ is_current: false }).eq("is_current", true);
    return { error: error || null };
  },
  async fiscalYearSetCurrent(fy, createdById){
    const { error } = await sb.from("fiscal_years").upsert({ fy, is_current: true, created_by: createdById }, { onConflict: "fy" });
    return { error: error || null };
  },

  /* ---- staff profiles (admin) ---- */
  async profilesUpdateMany(ids, patch){
    const { error } = await sb.from("profiles").update(patch).in("id", ids);
    return { error: error || null };
  },
  async profileInsert(row){
    const { error } = await sb.from("profiles").insert(row);
    return { error: error || null };
  },
  async profileUpdate(id, row){
    const { error } = await sb.from("profiles").update(row).eq("id", id);
    return { error: error || null };
  },
  // Replaces a Chief Officer's areas of responsibility. oldIds = the rows to
  // remove first (a department admin only ever removes rows of their own
  // department, so areas set up by a system admin elsewhere are kept).
  async coScopeReplace(userId, oldIds, areas){
    if(oldIds.length){
      const del = await sb.from("co_scope").delete().in("id", oldIds);
      if(del.error) return { error: del.error };
    }
    if(!areas.length) return { error: null };
    const rows = areas.map(a=>({ user_id:userId, department:a.department, mode:a.mode,
      directorates: a.mode==="directorate" ? a.directorates : [], units: a.mode==="unit" ? a.units : [] }));
    const ins = await sb.from("co_scope").insert(rows).select();
    return { error: ins.error || null, rows: ins.data || [] };
  },

  /* ---- full backup (system administrator) ----
     Reads every table in pages and returns plain rows. Also returns, per
     table, how many rows the server says exist vs how many were received, so
     a short read is detected instead of silently producing an incomplete file. */
  BACKUP_TABLES: ["profiles","fiscal_years","annual_plans","quarterly_targeting","achievements","co_appraisals",
    "midyear_reviews","annual_reviews","section4","special_assignments","core_values","performance_scores",
    "section8","section9","review_windows","forwarding","evidence_files","revision_requests",
    "password_reset_requests","notifications","pc_targets","co_scope"],
  BACKUP_ORDER: { pc_targets: ["user_id","fy"], fiscal_years: ["fy"] },  // tables with no "id" column
  async exportAll(onProgress){
    const PAGE = 1000, out = {}, checks = {}, errors = [];
    for(const t of this.BACKUP_TABLES){

/* ---- background save queue: fire-and-forget, doesn't block the UI ---- */
let saveQueue = [];
let saveQueueTimer = null;
function queueBackgroundSave(key, value){
  saveQueue.push({key, value});

  CACHE["revision_requests"] = (rr.data||[]).map(r=>({ id:r.id, username:uname(r.user_id), supervisorUsername:r.supervisor_id&&uname(r.supervisor_id), reason:r.reason, status:r.status, createdAt:r.created_at, supervisorActionAt:r.supervisor_action_at, supervisorComment:r.supervisor_comment, adminActionAt:r.admin_action_at, appraiseeAcknowledgedRejection:!!r.appraisee_acknowledged_rejection }));
  const prrObj = {};
  (prr.data||[]).forEach(r=>{
    const key = r.user_id ? uname(r.user_id) : r.requested_username;
    if(key) prrObj[key] = { requestedAt:r.requested_at, status:r.status };
  });
  CACHE["password_reset_requests"] = prrObj;
}


function uid(prefix="a"){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
// Today's date on the device clock (Kenya time for Kenyan phones). Window
// closing dates use this, so a window closes at local midnight, not at 03:00.
function localTodayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// Org snapshot: captures department/directorate/sectionUnit as they stood at
// the moment a record is first signed/submitted/finalized, so a closed record
// keeps the org label it had at signing instead of silently changing later
// just because the officer (or the org chart) moves. Call at each record's
// own first-sign/first-submit/finalize moment - never on every edit - and
// never overwrite a value that's already set, so a record stays pinned to
// whichever department/directorate/section-unit was true the first time it
// was stamped, even if this same function is called again later (e.g. a
// second signer, or a re-save). A record from before this feature existed
// has these fields null/absent - reporting code falls back to the officer's
// current profile for those, by design (see getOfficerProgressSummary).
function stampOrgSnapshot(rec, username){
  const u = USERS[username];
  if(!u || !rec) return;
  if(rec.department == null) rec.department = u.department || "";
  if(rec.directorate == null) rec.directorate = u.directorate || "";
  if(rec.sectionUnit == null) rec.sectionUnit = u.sectionUnit || "";
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sortByName(entries){ return [...entries].sort((a,b)=> (a[1].name||"").localeCompare(b[1].name||"")); }

/* ---- Re-read the latest data while the app stays open ----
   Data is normally read once, at login. An installed app can stay open for days,
   so (installed app only - see the listener at the bottom of the file) it
   re-reads everything when it returns to the foreground after a short absence.
   Safety rules: never while anything is still being saved or uploaded, never
   while the user has unsaved edits or is typing, never while offline; and if the
   re-read fails, the previous data is put back untouched. */
let refreshingFromServer = false;
async function refreshFromServerIfIdle(){
  if(!SESSION || refreshingFromServer || !BACKEND.available() || navigator.onLine === false) return false;
  if(saveQueue.length || saveQueueTimer || backupBusy) return false;
  if(Object.values(evidenceUploadStatus).some(st=>st && st.state === "uploading")) return false;
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.type !== "button" && ae.type !== "checkbox") return false;
  if(document.querySelector('[id^="save_"]:not([disabled])')) return false;   // a form has unsaved changes
  refreshingFromServer = true;
  const snap = { USERS, CACHE: {...CACHE}, u2i: {...USERNAME_TO_ID}, i2u: {...ID_TO_USERNAME}, fys: [...KNOWN_FYS], cur: CURRENT_FY };
  try{
    await hydrateCache();
    if(!USERS[SESSION]) throw new Error("signed-in profile not returned");
  }catch(e){
    console.warn("Refresh skipped, previous data kept:", e);
    USERS = snap.USERS; CACHE = snap.CACHE; USERNAME_TO_ID = snap.u2i; ID_TO_USERNAME = snap.i2u; KNOWN_FYS = snap.fys; CURRENT_FY = snap.cur;
    refreshingFromServer = false;
    return false;
  }
  planCache = null; midyearCache = null; annualReviewCache = null;
  refreshingFromServer = false;
  renderApp();
  return true;
}

/* ============================== ANNUAL PLAN =============================== */
function planKeyFor(username){ return `plan_${username}_${FY}`; }
function windowKeyFor(username){ return `windows_${username}_${FY}`; }
const WINDOW_FIELDS = ["planning","midYear","annual","Q1","Q2","Q3","Q4"];
function getWindows(username){
  const w = getData(windowKeyFor(username), {});
  WINDOW_FIELDS.forEach(f=>{ if(w[f]===undefined) w[f] = "not_open"; });
  // Auto-lockout: an admin can attach a closeout date when opening a window
  // (see setWindowState/onWindowBatchAction). Once that date has passed, an
  // "open" window silently reads as "closed" here - computed fresh on every
  // read, never written back, so it's always correct for "today" without a
  // scheduled job or an extra Supabase write. Leaving the closeout date
  // blank (the default) keeps today's behavior exactly as-is: the window
  // stays open until an admin closes it by hand.
  WINDOW_FIELDS.forEach(f=>{
    const closeDate = w[f+"CloseDate"];
    if(w[f]==="open" && closeDate && localTodayISO() > closeDate) w[f] = "closed";
  });
  return w;
}
/* ---- A window is "completed" once the officer's work for it is finalized ----
   Planning: the supervisor approved the plan / Performance Contract plan.
   Mid-Year and Annual: the supervisor has signed the review.
   This is a read-only view for display (admin window table, reminders). It is not written back, so
   if a plan or review is later returned or unlocked for revision, the window shows as open again. */
function windowCompleted(username, field){
  const u = USERS[username]; if(!u) return false;
  if(field === "planning"){
    if(u.usesPC){ const pc = getData(pcKeyFor(username), null); return !!pc && pc.pcPlanStatus === "approved"; }
    const plan = getData(planKeyFor(username), null); return !!plan && plan.status === "approved";
  }
  if(field === "midYear"){
    const my = getData(midyearKeyFor(username), null); return !!(my && my.appraiseeSignedAt && my.supervisorSignedAt);
  }
  if(field === "annual"){
    if(u.usesPC){ const pc = getData(pcKeyFor(username), null); return !!(pc && pc.appraiseeSignedAt && pc.appraiserSignedAt); }
    const ar = getData(annualReviewKeyFor(username), null); return !!(ar && ar.appraiseeSignedAt && ar.supervisorSignedAt);
  }
  return false;
}
// Days left (0 = last day) for each of this officer's open windows that has a closing date
// and is not yet completed. Used for the countdown bubbles and the warning banner.
function closingCountdowns(username){
  const w = getWindows(username), out = [];
  const t = new Date(localTodayISO()+"T00:00:00");
  ["planning","midYear","annual"].forEach(f=>{
    const cd = w[f+"CloseDate"];
    if(w[f] !== "open" || !cd || windowCompleted(username, f)) return;
    const daysLeft = Math.round((new Date(cd+"T00:00:00") - t) / 86400000);
    if(daysLeft >= 0) out.push({field:f, daysLeft, closeDate:cd});
  });
  return out;
}
function closesText(c){ return c.daysLeft===0 ? "closes TODAY" : c.daysLeft===1 ? "closes TOMORROW" : `closes in ${c.daysLeft} days`; }
function buildClosingSoonBanner(username){
  const urgent = closingCountdowns(username).filter(c=>c.daysLeft<=3);
  if(!urgent.length) return "";
  return urgent.map(c=>`<div class="status-note warn" style="border-left:5px solid #b3261e;background:#fdeceb;color:#7a1410;font-weight:600;margin-bottom:12px">\u26A0 The ${esc(WINDOW_LABELS[c.field])} window ${closesText(c)} (${fmtDate(c.closeDate)}). Complete and submit your work before it closes; after that it will be locked.</div>`).join("");
}
/* ---- Reporting needs a plan ----
   An officer on SPAS A/B cannot report (Mid-Year or Annual) on a plan they never
   made. An administrator may still open a window for many people at once -
   the lock is applied per officer, on the officer's own screen and when signing.
   (PC officers are already stopped when the window is opened: see setWindowState.) */
function needsPlanBeforeReporting(username){ const u = USERS[username]; return !!u && !u.usesPC; }
function hasApprovedPlan(username){
  const plan = getData(planKeyFor(username), null);
  return !!plan && plan.status === "approved" && Array.isArray(plan.activities) && plan.activities.length > 0;
}
function reportingBlockedNoPlan(username){ return needsPlanBeforeReporting(username) && !hasApprovedPlan(username); }
const NO_PLAN_REPORTING_MSG = "You can't report yet: your Annual Plan has not been completed and approved by your supervisor.";
function buildNoPlanReportingCard(title, planningOpen){
  return `<div class="card"><div class="card-head"><div><div class="card-title">${esc(title)}</div>
    <div class="card-sub">This window is open, but reporting is locked until you have a plan to report on.</div></div></div>

      ? "Complete your plan above and submit it for approval."

function planRevisionRequestStillAllowed(username){
  const u = USERS[username] || {};
  const w = getWindows(username);
  // Planning-change requests are allowed only before reporting starts.
  // PC has an annual-only reporting window; legacy records may represent an
  // untouched window as either "not_open" or "closed", so do not require the
  // exact literal "not_open".  Once the PC annual window has actually been
  // opened, annualReportingEverOpened is the authoritative lock.
  if(u.usesPC){
    const pc = getData(pcKeyFor(username), null);
    return !!pc && pc.pcPlanStatus === "approved" && w.annual !== "open" && !pc.annualReportingEverOpened;
  }
  return w.midYear === "not_open" && w.annual === "not_open";
}
function setWindowState(usernames, field, value, closeDate){
  usernames.forEach(uname=>{
    const w = getWindows(uname);
    const previous = w[field];
    const u = USERS[uname];
    if(value === "open" && u?.usesPC && (field === "annual" || field === "midYear")) {
      const pc = getData(pcKeyFor(uname), null);
      if(!pc || pc.pcPlanStatus !== "approved") {
        showFlash(`${u.name || uname} cannot have the PC ${field==="annual"?"Annual Reporting":"Mid-Year Review"} window opened until the Performance Contract plan is approved.`, "err");
        return;
      }
    }
    w[field] = value;
    // The closeout date is only meaningful while the window is "open" (see
    // the auto-lockout check in getWindows) - set it whenever opening
    // (blank clears any old one, so re-opening without a date reverts to
    // "stays open until closed by hand"), and leave it untouched on a
    // manual close so re-opening later without specifying a new one doesn't
    // resurrect a stale date.
    if(value === "open") w[field+"CloseDate"] = closeDate || "";
    setData(windowKeyFor(uname), w);
    // Opening a reporting window creates the same durable notification for
    // the appraisee on every track. PC's Annual window additionally records
    // annualReportingEverOpened, since that's the authoritative planning lock.
    if(value === "open" && previous !== "open"){
      // Record that the PC annual reporting window has actually been opened.
      // This is distinct from a window merely being closed/not-open at the
      // beginning of the fiscal year, because PC planning must remain
      // available until the first Annual Reporting opening.
      if(u?.usesPC && field === "annual"){
        const pc = getData(pcKeyFor(uname), null) || {};
        pc.annualReportingEverOpened = true;
        setData(pcKeyFor(uname), pc);
      }
      // (u is already defined above for this user - re-declaring it here made every
      // "open window" action fail with "Cannot access 'u' before initialization".)
      // Closeout-date suffix appended to every "window opened" notification
      // body below, so the deadline is communicated up front rather than
      // only visible via the on-screen banner or the closing-soon reminder.
      const closeSuffix = closeDate ? ` This window closes ${fmtDate(closeDate)}.` : "";
      if(u){
        if(u.usesPC && field === "annual"){
          void createNotification(uname, "pc_annual_window_open", "Annual Performance Contract reporting window is open", `Your Annual Performance Contract reporting window is now open. Open the Performance Contract tab to complete and submit your annual report.${closeSuffix}`, null);
        } else if(field === "midYear" || field === "annual"){
          // Generic Mid-Year/Annual notification - covers SPAS on both fields,
          // and now covers PC's own reactivated Mid-Year Review too.
          const title = field === "midYear" ? "Mid-Year Review window is open" : "Annual Appraisal window is open";
          const noPlanNote = reportingBlockedNoPlan(uname) ? " You cannot report yet: your Annual Plan must first be completed and approved by your supervisor." : "";
          void createNotification(uname, field === "midYear" ? "midyear_window_open" : "annual_window_open", title, `Your ${field === "midYear" ? "Mid-Year Review" : "Annual Appraisal"} reporting window is now open.${closeSuffix}${noPlanNote}`, null);
        } else if(field === "planning"){
          const planTab = u.usesPC ? "Performance Contract" : "Plan";
          void createNotification(uname, "planning_window_open", "Planning window is open", `Your Planning window is now open. Open the ${planTab} tab to complete and submit your ${u.usesPC ? "Performance Contract plan" : "annual plan"}.${closeSuffix}`, null);
        }
      }
    }
  });
}

function midyearKeyFor(username){ return `midyear_${username}_${FY}`; }

function reconcileRowsWithSource(existingRows, sourceItems, mapFn){
  // merges rows against the current source (plan activities / annual targets), keeping any
  // already-entered data for rows that still match, and adding rows for anything new in the
  // source that isn't reflected yet. Never drops an existing row, even if its source item is
  // gone, so in-progress work is never destroyed by this reconciliation.
  const byId = new Map(existingRows.map(r=>[r.id, r]));
  const merged = sourceItems.map(item=>{
    const existing = byId.get(item.id);
    if(existing) return {...existing, activity:item.activity, indicator:item.indicator};
    return mapFn(item);
  });
  const sourceIds = new Set(sourceItems.map(i=>i.id));
  const orphaned = existingRows.filter(r=>!sourceIds.has(r.id));
  return [...merged, ...orphaned];
}

      appraiseeSignedBy:null, appraiseeSignedAt:null, supervisorSignedBy:null, supervisorSignedAt:null };
    setData(midyearKeyFor(username), rec);
  } else if(planActivities.length > 0){
    const merged = reconcileRowsWithSource(rec.rows, planActivities, a=>({id:a.id, activity:a.activity, indicator:a.indicator, changeTag:"unchanged", remarks:""}));
    const rowsChanged = merged.length !== rec.rows.length || merged.some((r,i)=> rec.rows[i] && (r.activity!==rec.rows[i].activity || r.indicator!==rec.rows[i].indicator));
    if(rowsChanged){ rec.rows = merged; }

  setData(midyearKeyFor(username), rec);

  return rec;
}

async function createNotification(recipientUsername,type,title,message,relatedRequestId=null,relatedUsername=null){
  const n={id:(crypto.randomUUID?crypto.randomUUID():uid("n")),recipientUsername,senderUsername:SESSION,type,title,message,relatedRequestId,relatedUsername,createdAt:new Date().toISOString(),readAt:null};
  const list=getData("notifications",[]); list.push(n); setData("notifications",list);
  // Persist immediately as well as through the background queue. This is important
  // for cross-user notifications: the recipient may be on another device/session.
  try{
    if(BACKEND.available() && USERNAME_TO_ID[recipientUsername]){
      const {error}=await BACKEND.notifUpsert({
        id:n.id, recipient_id:USERNAME_TO_ID[recipientUsername], sender_id:USERNAME_TO_ID[SESSION] || null, notification_type:n.type,
        title:n.title, message:n.message, related_request_id:n.relatedRequestId||null,
        related_username:n.relatedUsername||null,
        created_at:n.createdAt, read_at:null
      });
      if(error) console.error("Notification save failed", error);
    }
  }catch(e){ console.error("Notification save exception", e); }
  return n;
}
async function acknowledgePersistentNotification(id){
  const list=getData("notifications",[]); const n=list.find(x=>x.id===id);
  if(!n) return;
  const readAt=new Date().toISOString();
  n.readAt=readAt; setData("notifications",list);
  // Persist the read state so a notification does not reappear after tab
  // changes, refresh, logout/login, or on another device.
  try{
    if(BACKEND.available()){
      const {error}=await BACKEND.notifMarkRead(readAt,{ids:[id]});
      if(error) console.error("Notification read-state save failed", error);
    }
  }catch(e){ console.error("Notification read-state exception", e); }
}

// Mark the planning-stage PC decision notification as consumed when the
// supervisor acts on it.  The notification is not tied to a revision request
// (relatedRequestId is null), so opening/acknowledging the notification alone
// is not enough to clear an outstanding approval task.  We deliberately match
// the recipient, type and title rather than a generated notification id so the
// same rule works for rows hydrated from Supabase after a fresh login.
async function clearPCPlanDecisionNotifications(username){
  const readAt = new Date().toISOString();
  const list = getData("notifications", []);
  let changed = false;
  list.forEach(n => {
    if (n.recipientUsername === SESSION &&
        n.type === "pc_plan_submission" &&
        !n.readAt &&
        (n.title === "Performance Contract plan submitted" ||
         String(n.message || "").includes(USERS[username]?.name || username))) {
      n.readAt = readAt;
      changed = true;
    }
  });
  if (changed) {
    setData("notifications", list);
  }
  // Always try to update Supabase, but do not block on it.
  try {
    if (BACKEND.available() && USERNAME_TO_ID[SESSION]) {
      const { error } = await BACKEND.notifMarkRead(readAt, { recipientId: USERNAME_TO_ID[SESSION], type: "pc_plan_submission", unreadOnly: true });
      if (error) {
        console.error("PC decision notification clear failed (Supabase update):", error);
      }
    }
  } catch (e) {
    console.error("PC decision notification clear exception:", e);
  }
  refreshTopBar();  // force badge update immediately
}
async function openPersistentNotification(id){
  const n = getData("notifications", []).find(x=>x.id===id);
  if(!n) return;
  await acknowledgePersistentNotification(id);
  const r = n.relatedRequestId ? getData("revision_requests", []).find(x=>x.id===n.relatedRequestId) : null;
  if(r && (n.type==="pc_revision_request" || n.type==="plan_revision_request" || n.type==="admin_rejection_supervisor")){
    onJumpToTeamMember(r.username, USERS[r.username]?.usesFormA ? "form1a" : USERS[r.username]?.usesPC ? "pc" : "form1b");

    setView("plan");
  }

async function clearStalePCPlanSubmissionNotifications(){
  const list = getData("notifications", []);
  const staleIds = [];
  let changed = false;
  list.forEach(n=>{
    if(n.recipientUsername !== SESSION || n.readAt || n.type !== "pc_plan_submission") return;
    const owner = Object.keys(USERS).find(uname=>{
      const u=USERS[uname];
      return u?.usesPC && u?.supervisorUsername===SESSION &&
        ((String(n.message||"").includes(u.name||"\u0000")) || String(n.message||"").includes(uname));
    });
    if(!owner) return;
    const pc=getData(pcKeyFor(owner), null);
    const stillPending = !!(pc && pc.pcPlanStatus === "pending_approval" && !pc.annualReportingEverOpened && getWindows(owner).annual !== "open");
    if(!stillPending){
      n.readAt = new Date().toISOString();
      staleIds.push(n.id);
      changed = true;
    }
  });
  if(changed) setData("notifications", list);
  if(staleIds.length && BACKEND.available()){
    try{
      await BACKEND.notifMarkRead(new Date().toISOString(), { ids: staleIds });
    }catch(e){ console.error("Stale PC notification cleanup failed:",e); }
  }
  return staleIds.length;
}

function getMyNotificationItems(){
  const me = USERS[SESSION];
  const items = [];
  if(!me) return items;

  // Durable notifications stored in Supabase. These are especially important
  // for revision requests because the supervisor may not be on the My Team
  // screen when the appraisee submits the request.
  // Durable notifications.  A PC plan-submission notification is actionable
  // only while that specific PC plan is still pending supervisor decision.
  // This state check is deliberately performed at render time as well as when
  // the supervisor clicks Approve/Return.  It prevents a stale unread
  // notification row in Supabase (or a re-hydrated local cache) from bringing
  // the Approve/Return notification bubble back after the plan has already
  // been approved or returned.
  getData("notifications", [])
    .filter(n=>n.recipientUsername===SESSION && !n.readAt)
    .filter(n=>{
      if(n.type==="pc_plan_submission"){
        const pcOwner = Object.keys(USERS).find(uname=>
          USERS[uname]?.usesPC && USERS[uname]?.supervisorUsername===SESSION &&
          ((n.message||"").includes(USERS[uname]?.name || "\u0000" ) || (n.message||"").includes(uname))
        );
        if(!pcOwner) return true;
        const pc = getData(pcKeyFor(pcOwner), null);
        return !!(pc && pc.pcPlanStatus==="pending_approval" && !pc.annualReportingEverOpened && getWindows(pcOwner).annual!=="open");
      }
      // Revision-request notifications must disappear once the underlying
      // request is no longer waiting for that recipient's action. This also
      // protects against an old unread Supabase notification resurrecting the
      // badge after the request has already been approved/rejected.
      if(["pc_revision_request","plan_revision_request"].includes(n.type)){
        if(!n.relatedRequestId) return false;
        const rr = getData("revision_requests",[]).find(r=>r.id===n.relatedRequestId);
        return !!(rr && rr.status==="pending_supervisor" && (!rr.supervisorUsername || rr.supervisorUsername===SESSION));
      }
      return true;
    })
    .sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")))
    .forEach(n=>items.push({
      label:`${n.title}: ${n.message}`,
      onclick:`openPersistentNotification('${n.id}')`
    }));

  // The appraisee's own items — CPRC/Authorized Officer are dedicated
  // county-wide review accounts with no SPAS/PC of their own to fill.
  // (Skipped entirely while viewing a closed fiscal year: those items link to
  // forms that are read-only there, so they could never be cleared.)
  if(!me.isCPRC && !me.isAuthorizedOfficer && FY===CURRENT_FY){
    const p = getData(planKeyFor(SESSION), {status:"draft", rejectionComment:""});
    if(p.status==="draft" && p.rejectionComment) items.push({label:"Your Annual Plan was returned for revision", onclick:"setView('plan')"});
    const windows = getWindows(SESSION);
    // A live "closing soon" reminder for any window with an admin-set
    // closeout date, once it's within 3 days (including the closing day
    // itself). Deliberately computed fresh every render rather than a
    // stored one-shot notification, so the days-left figure is always
    // accurate and there's nothing to mark read or dedupe.
    closingCountdowns(SESSION).filter(c=>c.daysLeft<=7).forEach(c=>{
      items.push({label:`${c.daysLeft<=3?"\u26A0 ":""}${WINDOW_LABELS[c.field]} window ${closesText(c)} (${fmtDate(c.closeDate)})`, onclick:"setView('plan')"});

    // Shown only while the plan is still unsubmitted; skipped if the stored
    // notification is already showing.
    if(windows.planning==="open"){
      const pcNow = me.usesPC ? getData(pcKeyFor(SESSION), null) : null;
      const stillPlanning = me.usesPC ? (!pcNow || !pcNow.pcPlanStatus || pcNow.pcPlanStatus==="draft") : p.status==="draft";
      const hasStored = getData("notifications", []).some(n=>n.recipientUsername===SESSION && !n.readAt && n.type==="planning_window_open");
      if(stillPlanning && !hasStored) items.push({label: me.usesPC ? "Planning window is open: complete and submit your Performance Contract plan" : "Planning window is open: complete and submit your Annual Plan", onclick:"setView('plan')"});
    }
    const my = getData(midyearKeyFor(SESSION), null);
    if(!me.usesPC){
      if(my && my.rejectionComment) items.push({label:"Your Mid-Year Review was returned for revision", onclick:"setView('plan')"});
      else if(windows.midYear==="open" && !hasUnreadNotif("midyear_window_open") && !reportingBlockedNoPlan(SESSION) && (!my || !my.appraiseeSignedAt)) items.push({label:"Mid-Year Review window is open", onclick:"setView('plan')"});
      else if(windows.midYear==="open" && !hasUnreadNotif("midyear_window_open") && reportingBlockedNoPlan(SESSION)) items.push({label:"Mid-Year Review is open, but you need an approved Annual Plan before you can report", onclick:"setView('plan')"});
    }
    const ar = me.usesPC ? getData(pcKeyFor(SESSION), null) : getData(annualReviewKeyFor(SESSION), null);
    const annualLabel = me.usesPC ? "Performance Contract" : "Annual Appraisal Report";
    // PC planning returns use pcPlanRejectionComment, not the annual-report
    // rejectionComment field.  Keep this as a live-state fallback so the
    // appraisee still gets a notification badge even if the durable
    // notifications row is delayed/rejected by Supabase RLS.
    if(me.usesPC && ar && ar.pcPlanRejectionComment && ar.pcPlanStatus === "draft" && !ar.pcPlanSubmittedAt){
      const pcReturnLabel = `Your Performance Contract plan was returned for revision: ${ar.pcPlanRejectionComment}`;
      if(!items.some(x=>String(x.label).includes("Performance Contract plan was returned for revision"))){
        items.push({label:pcReturnLabel, onclick:"setView('plan')"});
      }
    } else if(ar && ar.rejectionComment){
      items.push({label:`Your ${annualLabel} was returned for revision`, onclick:"setView('plan')"});
    } else if(windows.annual==="open" && !hasUnreadNotif(me.usesPC?"pc_annual_window_open":"annual_window_open") && !reportingBlockedNoPlan(SESSION) && (!ar || !ar.appraiseeSignedAt)){
      items.push({label:`${annualLabel} window is open`, onclick:"setView('plan')"});
    } else if(windows.annual==="open" && !hasUnreadNotif(me.usesPC?"pc_annual_window_open":"annual_window_open") && reportingBlockedNoPlan(SESSION)){
      items.push({label:`${annualLabel} is open, but you need an approved Annual Plan before you can report`, onclick:"setView('plan')"});
    }

    // Admin-approved plan revision: notify the requesting appraisee once.
    const approvedRevisionNotification = getData("notifications", [])
      .find(n=>n.recipientUsername===SESSION && !n.readAt &&
        (n.type==="pc_revision_unlocked" || n.type==="plan_revision_unlocked") &&
        (!n.relatedRequestId || getData("revision_requests", []).some(r=>r.id===n.relatedRequestId && r.status==="approved_unlocked")));
    if(approvedRevisionNotification){
      items.push({
        label:approvedRevisionNotification.message || (me.usesPC ? "Your request to revise the Performance Contract has been approved — it is now unlocked." : "Your request to revise the Annual Plan has been approved — the plan is now unlocked."),
        onclick:`onAcknowledgeRevisionApproval('${approvedRevisionNotification.id}')`
      });
    }
  }

  // Supervisor/appraiser team: reviews awaiting sign-off, target-change requests,
  // plus packages awaiting relay. Authorized Officers can also be appraisers of
  // staff in their direct team, so they must receive the same team notifications.
  if((me.isSupervisor || me.isAuthorizedOfficer) && FY===CURRENT_FY){
    getSupervisorPendingItems().forEach(it=>{
      items.push({label: it.label, onclick:`onJumpToTeamMember('${it.uname}','${it.formView}')`});
    });
    // PC planning submission is also surfaced directly from the live team state.
    // This guarantees the supervisor sees it even if the durable notification row
    // is delayed by a background Supabase save or RLS policy.
    Object.entries(USERS).filter(([uname,u])=>u.supervisorUsername===SESSION && u.usesPC).forEach(([uname,u])=>{
      const pc=getData(pcKeyFor(uname),null);
      const w=getWindows(uname);
      if(pc && w.annual!=="open" && pc.pcPlanStatus==="pending_approval"){
        const exists=items.some(x=>String(x.label).includes(u.name) && String(x.label).includes("Performance Contract plan awaiting your approval"));
        if(!exists) items.push({label:`${u.name} — Performance Contract plan awaiting your approval`, onclick:`onJumpToTeamMember('${uname}','pc')`});
      }
    });
  }

  // Admin: password resets and plan-revision requests needing admin action
  if(isAnyAdmin(me)){
    const deptScope = me.isSystemAdmin ? null : me.department;
    Object.entries(getData("password_reset_requests", {}))
      .filter(([uname,r])=>r.status!=="resolved" && USERS[uname] && (!deptScope || USERS[uname].department===deptScope))
      .forEach(([uname])=>{ items.push({label:`${USERS[uname].name} — password reset requested`, onclick:"jumpToAdminRequests()"}); });
    getData("revision_requests", [])
      .filter(r=>r.status==="pending_admin" && (!deptScope || (USERS[r.username] && USERS[r.username].department===deptScope)))
      .forEach(r=>{ items.push({label:`${USERS[r.username]?.name||r.username} — admin action needed on a revision request`, onclick:"jumpToAdminRequests()"}); });
  }

  return items;
}
async function onAcknowledgeRevisionApproval(notificationId=null){
  // The unlock notification itself is the durable acknowledgement marker.
  // Do not use appraiseeNotifiedAt on revision_requests: that field is not a
  // database column and therefore cannot survive a fresh login.
  let n = notificationId ? getData("notifications", []).find(x=>x.id===notificationId) : null;
  if(!n){
    n = getData("notifications", []).find(x=>x.recipientUsername===SESSION && !x.readAt &&
      (x.type==="pc_revision_unlocked" || x.type==="plan_revision_unlocked"));
  }
  if(n) await acknowledgePersistentNotification(n.id);
  setView("plan");
  refreshTopBar();
}

async function clearStaleRevisionNotifications(){
  const session = SESSION;
  if(!session) return 0;
  const requests = getData("revision_requests", []);
  const list = getData("notifications", []);
  const now = new Date().toISOString();

  // A revision request is a lifecycle. Only the LATEST request for an
  // appraisee can generate a current revision notification. This prevents an
  // old administrator-unlock notification from surviving into a later,
  // different revision request.
  const latestByUser = {};
  requests.forEach(r=>{
    const prev = latestByUser[r.username];
    if(!prev || String(r.createdAt||"") > String(prev.createdAt||"")) latestByUser[r.username] = r;
  });

  const stale = list.filter(n => {
    if(n.recipientUsername !== session || n.readAt) return false;

    // Revision-request notifications are linked to a specific request.
    if(n.relatedRequestId){
      const r = requests.find(x=>x.id===n.relatedRequestId);
      if(!r) return true;

      // If a newer request exists for the same appraisee, every notification
      // belonging to the old request is obsolete.
      if(latestByUser[r.username] && latestByUser[r.username].id !== r.id) return true;

      switch(n.type){
        case "pc_revision_request":
        case "plan_revision_request":
          return r.status !== "pending_supervisor";
        case "pc_revision_supervisor_approved":
        case "plan_revision_supervisor_approved":
          return r.status !== "pending_admin";
        case "pc_revision_unlocked":
        case "plan_revision_unlocked":
          return r.status !== "approved_unlocked";
        case "pc_revision_rejected":
        case "plan_revision_rejected":
          // A request-rejection notification is an outcome notification.
          // Keep it live until the appraisee acknowledges it.
          return r.status !== "rejected";
        case "pc_revision_returned":
          // A revised PC-plan return is an outcome notification. Keep it live
          // while the plan is unlocked for the appraisee to correct and resubmit.
          if(r.username === session){
            const pc = getData(pcKeyFor(session), null);
            return !(pc && pc.planRevisionUnlocked && !pc.planRevisionPendingApproval);
          }
          return true;
        case "admin_rejection_supervisor":
          return !["pending_supervisor","pending_admin"].includes(r.status);
        default:
          return false;
      }
    }

    // Revised-PC submission notifications have no request id in older rows.
    // Their lifecycle is determined from the actual PC state.
    if(n.type === "pc_revision_submission"){
      const owner = Object.keys(USERS).find(uname=>
        USERS[uname]?.usesPC && USERS[uname]?.supervisorUsername===session &&
        ((n.message||"").includes(USERS[uname]?.name || "\u0000") || (n.message||"").includes(uname))
      );
      if(!owner) return false;
      const pc = getData(pcKeyFor(owner), null);
      return !(pc && pc.planRevisionPendingApproval);
    }

    // Once a revised PC has been approved, an old approval notification should
    // not keep the appraisee's badge alive.
    if(n.type === "pc_revision_approved"){
      const owner = Object.keys(USERS).find(uname=>USERS[uname]?.usesPC && USERS[uname]?.name && (n.message||"").includes(USERS[uname].name));
      if(owner){
        const pc=getData(pcKeyFor(owner),null);
        if(pc && pc.pcPlanStatus==="approved" && !pc.planRevisionPendingApproval && !pc.planRevisionUnlocked) return true;
      }
    }

    return false;
  });

  if(!stale.length) return 0;
  stale.forEach(n=>n.readAt=now);
  setData("notifications", list);
  if(BACKEND.available() && USERNAME_TO_ID[session]){
    const {error} = await BACKEND.notifMarkRead(now, { recipientId: USERNAME_TO_ID[session], ids: stale.map(n=>n.id) });
    if(error) console.error("Stale revision notification cleanup failed:", error);
  }
  return stale.length;
}

async function clearResolvedPCApprovalNotifications(){
  const me = USERS[SESSION];
  if(!me || !me.usesPC) return 0;
  const pc = getData(pcKeyFor(SESSION), null);
  if(!pc || pc.pcPlanStatus !== "approved") return 0;
  const list = getData("notifications", []);
  const stale = list.filter(n=>n.recipientUsername===SESSION && !n.readAt && n.type==="pc_plan_approved");
  if(!stale.length) return 0;
  const now = new Date().toISOString();
  stale.forEach(n=>n.readAt=now);
  setData("notifications", list);
  if(BACKEND.available() && USERNAME_TO_ID[SESSION]){
    try{
      const {error}=await BACKEND.notifMarkRead(now, { recipientId: USERNAME_TO_ID[SESSION], ids: stale.map(n=>n.id) });
      if(error) console.error("Resolved PC approval notification cleanup failed:", error);
    }catch(e){ console.error("Resolved PC approval notification cleanup exception:",e); }
  }
  return stale.length;
}
async function clearStalePCPlanNotifications(){
  const me = USERS[SESSION];
  if(!me || (!me.isSupervisor && !me.isAuthorizedOfficer)) return 0;
  const list = getData("notifications", []);
  const stale = [];
  const now = new Date().toISOString();
  list.forEach(n=>{
    if(n.recipientUsername!==SESSION || n.type!=="pc_plan_submission" || n.readAt) return;
    const owner = Object.keys(USERS).find(uname=>{
      const u=USERS[uname];
      return u?.usesPC && u?.supervisorUsername===SESSION &&
        ((String(n.message||"").includes(u.name||"\u0000")) || String(n.message||"").includes(uname));
    });
    if(!owner) return;
    const pc=getData(pcKeyFor(owner), null);
    const stillPending=!!(pc && pc.pcPlanStatus==="pending_approval" && !pc.annualReportingEverOpened && getWindows(owner).annual!=="open");
    if(!stillPending){
      n.readAt=now; stale.push(n.id);
    }
  });
  if(!stale.length) return 0;
  setData("notifications", list);
  if(BACKEND.available()){
    try{
      const {error}=await BACKEND.notifMarkRead(now, { ids: stale });
      if(error) console.error("Stale PC notification cleanup failed:", error);
    }catch(e){ console.error("Stale PC notification cleanup exception:", e); }
  }
  refreshTopBar();
  return stale.length;
}

/* --------------------------------- Reports & Rollup (Director and above) -------------------------------- */
function getAllDownstreamOfficers(username){
  // Transitive closure over supervisorUsername - everyone below this person in
  // the chain, however many levels down, not just their direct reports.
  // CPRC is a committee account, never an individual subject to performance
  // review - excluded here so it can never appear in anyone's downstream
  // reporting tree, even if a data-entry mistake ever gave it a supervisor.
  const result = [];
  const queue = [username];
  const seen = new Set([username]);
  while(queue.length){
    const current = queue.shift();
    Object.keys(USERS).forEach(uname=>{
      if(USERS[uname].supervisorUsername===current && !seen.has(uname) && !USERS[uname].isCPRC){
        seen.add(uname);
        result.push(uname);
        queue.push(uname);
      }
    });
  }
  return result;
}
/* ---- who a CO / CECM / Director can see (their "scope") ---------------------
   CECM     : every officer in their own department, whoever that officer reports to.
   CO       : the areas assigned to them (co_scope): per department either the whole
              department, ticked directorates, or ticked units/sections.
   Director : everyone reporting up through them (their directorate).
   Matching ignores capitals and extra spaces. These rules mirror the database
   rules (cecm_in_scope / co_in_scope), which are what actually protect the data. */
function normTxt(s){ return String(s==null?"":s).replace(/\s+/g," ").trim().toLowerCase(); }
function coAreasOf(uname){ return CO_SCOPE[uname] || []; }
function cecmCoversOfficer(cecmName, target){
  const c = USERS[cecmName], t = USERS[target];
  if(!c || !t || !c.isCECM || cecmName===target || isSpecialAccount(t)) return false;
  return !!normTxt(c.department) && normTxt(c.department)===normTxt(t.department);
}
function coCoversOfficer(coName, target){
  const co = USERS[coName], t = USERS[target];
  if(!co || !t || !co.isChiefOfficer || coName===target || isSpecialAccount(t)) return false;
  const td = normTxt(t.department);
  if(!td) return false;
  if(!CO_SCOPE_READY){   // database not yet updated: the old single department + unit rule
    return normTxt(co.department)===td && !!normTxt(co.sectionUnit) && normTxt(co.sectionUnit)===normTxt(t.sectionUnit);
  }
  return coAreasOf(coName).some(a=>{
    if(normTxt(a.department)!==td) return false;
    if(a.mode==="department") return true;
    if(a.mode==="directorate") return (a.directorates||[]).some(d=>normTxt(d) && normTxt(d)===normTxt(t.directorate));
    if(a.mode==="unit") return (a.units||[]).some(x=>normTxt(x) && normTxt(x)===normTxt(t.sectionUnit));
    return false;
  });
}
function describeCoAreas(uname){
  const u = USERS[uname];
  if(!CO_SCOPE_READY) return u && u.sectionUnit ? `${u.department||"your department"} — unit ${u.sectionUnit}` : "";
  return coAreasOf(uname).map(a=>{
    if(a.mode==="department") return `${a.department} (whole department)`;
    if(a.mode==="directorate") return `${a.department} (directorate${a.directorates.length>1?"s":""}: ${a.directorates.join(", ")})`;
    return `${a.department} (unit${a.units.length>1?"s":""}: ${a.units.join(", ")})`;
  }).join("; ");
}
// Everyone the Reports tab shows this person: Director chain + CECM department + CO areas.
function getReportsScopeOfficers(username){
  const me = USERS[username];
  if(!me) return [];
  const set = new Set();
  if(me.isDirector) getAllDownstreamOfficers(username).forEach(x=>set.add(x));
  Object.keys(USERS).forEach(x=>{
    if(me.isCECM && cecmCoversOfficer(username, x)) set.add(x);
    if(me.isChiefOfficer && coCoversOfficer(username, x)) set.add(x);
  });
  return [...set].filter(x=>USERS[x]);
}
function reportsScopeIncludes(username){ return getReportsScopeOfficers(SESSION).includes(username); }
function getOfficerProgressSummary(username){
  const u = USERS[username];
  const ar = getData(annualReviewKeyFor(username), null);
  const submitted = !!(ar && ar.appraiseeSignedAt);
  const { overall } = computeOverallAnnualScore(username);
  const underperforming = overall !== null && overall < 65; // below "Good" on the 5-point scale
  // Prefer the org label snapshotted on this FY's own annual-review record
  // (what it was when the officer signed) over the officer's current live
  // profile, which may since have moved departments/directorates - a record
  // from before this snapshot existed has these fields null/absent, so it
  // falls back to live, same as before.
  const snap = (ar && ar.department != null) ? ar : null;
  const myr = getData(midyearKeyFor(username), null);
  const halfSubmitted = !!(myr && myr.appraiseeSignedAt);
  return { username, halfSubmitted, name:u.name, department:(snap?snap.department:u.department)||"Unspecified", directorate:(snap?snap.directorate:u.directorate)||"Unspecified", score: overall, submitted, underperforming };
}

function buildReportsView(me){

  const typeButtons = REPORT_TYPES.filter(t=>!t.outcome || canSeeOutcomes).map(t=>

  ).join("");

    </div>`;

  const isOutcomeReport = reportsType==="rewards" || reportsType==="sanctions";
  const filedLinksFor = (username) => {

    return filed.map(pt=>`<button class="link-btn chip" onclick="onOpenReportsPacket('${username}','${pt}')">${PACKAGE_TYPES[pt].label} record \u203A</button>`).join("");
  };
  // Evidence links for whichever package type(s) exist for this officer in

// Shared by getSupervisorPendingItems() (a supervisor's own queue) and
// getAdminPendingSupervisorItems() (the county/department-wide admin view of
// the same thing). Deliberately takes no dependency on SESSION - it's pure
// per-officer state, so the exact same computation backs both views and
// there's only one place that ever needs to change when a new "awaiting
// supervisor action" condition is added.
function computeOfficerPendingItems(uname, u){
  const items = [];
  // A past fiscal year is read-only (setData refuses writes), so nothing in it
  // can be acted on - and opening a new FY never closes the old year's review
  // windows, so they stay "open" forever. Without this guard an unsigned
  // Mid-Year/Annual from a closed year would sit in every notification list
  // and badge permanently with no way to clear it.
  if(FY !== CURRENT_FY) return items;
  const plan = getData(planKeyFor(uname), {activities:[], status:"draft"});
  if(plan.status==="pending_approval") items.push({uname, formView:"form1b", label:`${u.name} — Annual Plan awaiting your approval`});
  const windows = getWindows(uname);
  if(windows.midYear === "open"){
    const my = getData(midyearKeyFor(uname), null);
    if(my && my.appraiseeSignedAt && !my.supervisorSignedAt) items.push({uname, formView:"form1b", label:`${u.name} — Mid-Year Review awaiting your co-sign`});
  }
  if(u.usesPC){
    const pc = getData(pcKeyFor(uname), null);
    const pcPlanningPhase = pc && windows.annual !== "open";
    if(pcPlanningPhase && pc.pcPlanStatus === "pending_approval"){
      items.push({uname, formView:"pc", label:`${u.name} — Performance Contract plan awaiting your approval`});
    } else if(pc && pc.planRevisionPendingApproval && pc.appraiseeSignedAt && !pc.appraiserSignedAt){
      items.push({uname, formView:"pc", label:`${u.name} — revised Performance Contract awaiting your approval`});
    } else if(windows.annual === "open" && pc && pc.appraiseeSignedAt && !pc.appraiserSignedAt){
      items.push({uname, formView:"pc", label:`${u.name} — Performance Contract awaiting your co-sign`});
    }
  } else if(windows.annual === "open"){
    const ar = getData(annualReviewKeyFor(uname), null);
    if(ar && ar.appraiseeSignedAt && !ar.supervisorSignedAt) items.push({uname, formView:"form1b", label:`${u.name} — Annual Appraisal Report awaiting your co-sign`});
  }
  const activeRevision = getData("revision_requests", []).find(r=>
    r.username===uname &&
    r.status==="pending_supervisor" &&
    (!r.supervisorUsername || r.supervisorUsername===u.supervisorUsername)
  );
  if(activeRevision) items.push({uname, formView:u.usesFormA?"form1a":u.usesPC?"pc":"form1b", label:`${u.name} — requesting a change to their ${u.usesPC?"Performance Contract":"Annual Plan"}`});
  return items;
}
function getSupervisorPendingItems(){
  const reports = sortByName(Object.entries(USERS).filter(([uname,u])=>u.supervisorUsername===SESSION && !u.isCPRC && !u.isAuthorizedOfficer));
  const items = [];
  reports.forEach(([uname,u])=>{ items.push(...computeOfficerPendingItems(uname, u)); });
  return items;
}
// The admin-wide equivalent: every officer's item waiting on THEIR OWN
// supervisor (not necessarily this admin), county-wide or department-scoped
// for a department admin. Because this reuses computeOfficerPendingItems()
// exactly, an item disappears from here the instant the real supervisor
// acts on it - there's no separate "admin notification" row to go stale.
function getAdminPendingSupervisorItems(deptScope){
  let pool = Object.entries(USERS).filter(([uname,u])=>!u.isCPRC && !u.isAuthorizedOfficer && u.supervisorUsername && USERS[u.supervisorUsername]);
  if(deptScope) pool = pool.filter(([,u])=>u.department===deptScope);
  const items = [];
  sortByName(pool).forEach(([uname,u])=>{
    const supervisor = USERS[u.supervisorUsername];
    computeOfficerPendingItems(uname, u).forEach(it=>items.push({
      ...it,
      department: u.department || "Unspecified",
      track: u.usesPC ? "PC" : u.usesFormA ? "SPAS A" : "SPAS B",
      supervisorName: supervisor ? supervisor.name : u.supervisorUsername,
    }));
  });
  return items;
}

function buildRoutingStatusNote(username, packageType, capped){
  const fwd = getForwarding(username, packageType);
  if(!fwd) return "";
  const label = PACKAGE_TYPES[packageType].label;
  const holderIsAO = fwd.currentHolder && USERS[fwd.currentHolder] && USERS[fwd.currentHolder].isAuthorizedOfficer;
  const beyondCECM = fwd.status !== "in_transit" || holderIsAO;
  // Even when capped, the CDA/CO/CECM portion has real dated detail worth
  // showing — only the AO/CPRC portion is deliberately kept generic. Trim
  // the hop list at the point it first crosses into AO territory, so the
  // detailed trail covers exactly what the cap allows.
  const crossingIndex = fwd.hops.findIndex(h => h.to && USERS[h.to] && USERS[h.to].isAuthorizedOfficer);
  const visibleHops = (capped && crossingIndex !== -1) ? fwd.hops.slice(0, crossingIndex) : fwd.hops;
  // Each hop's own timestamp is when that officer acted and moved it on; the
  // PREVIOUS hop's timestamp is, by definition, the same moment it arrived
  // with them (forwarding is instantaneous) - pairing the two gives a real
  // dated record of how long each officer actually held it.
  const trailItems = visibleHops.map((h,i)=>{
    const arrivedAt = i===0 ? (fwd.createdAt || null) : visibleHops[i-1].at;
    const arrivedLine = arrivedAt ? `Received by ${esc(h.byName)} on ${fmtDate(arrivedAt)} · ` : "";
    return `<li>${arrivedLine}${esc(h.action)} by ${esc(h.byName)} on ${fmtDate(h.at)}</li>`;
  }).join("");
  const trailHtml = trailItems ? `<ul style="margin:6px 0 0 18px;padding:0;font-size:12.3px">${trailItems}</ul>` : "";
  if(capped && beyondCECM){
    // Staff's own audit trail deliberately stops at CECM — what happens after
    // that (the Authorized Officer's office, CPRC) isn't named here by design,
    // but the detailed trail up to that point is still shown above.
    return `<div class="status-note ok">${label} package has moved beyond CECM in the review chain.${trailHtml}</div>`;
  }
  if(fwd.status==="at_cprc"){
    return `<div class="status-note ok">${label} package submitted to CPRC on ${fmtDate(fwd.atCPRCDate)}.${trailHtml}</div>`;
  }
  // The current holder hasn't forwarded it yet, so has no hop entry of their
  // own — the last hop's date (or the record's creation date, if it hasn't
  // moved at all yet) is when THEY received it, still worth showing.
  const currentReceivedAt = fwd.hops.length ? fwd.hops[fwd.hops.length-1].at : (fwd.createdAt || null);
  const currentLine = currentReceivedAt ? ` Received by ${esc(fwd.currentHolderName||fwd.currentHolder)} on ${fmtDate(currentReceivedAt)}, not yet forwarded.` : "";
  return `<div class="status-note">${label} package routing in progress — currently with ${esc(fwd.currentHolderName||fwd.currentHolder)}.${trailHtml}${currentLine}</div>`;
}

/* ------------------------------------ EVIDENCE ATTACHMENTS ------------------------------------ */
function evidenceKeyFor(username, packageType){ return `evidence_${packageType}_${username}_${FY}`; }
function getEvidence(username, packageType){ return getData(evidenceKeyFor(username, packageType), {files:[]}); }
const EVIDENCE_MAX_FILES = 15;
const EVIDENCE_MAX_BYTES = 15*1024*1024; // 15MB per file
const EVIDENCE_MAX_TOTAL_BYTES = 100*1024*1024; // 100MB per officer, per submission (package)
// Images kept to JPG/PNG only (not the full image/* wildcard) — those are the
// two formats every reviewer's device and the Central Registry can reliably
// open; GIF/BMP/TIFF/HEIC/SVG are excluded since they're inconsistent across
// phones, printers and older office PCs. Office formats cover the common
// document sources for evidence (reports, registers, certificates, slides).
const EVIDENCE_ALLOWED_EXT = [".jpg",".jpeg",".png",".pdf",".doc",".docx",".xls",".xlsx",".ppt",".pptx",".pub"];
const EVIDENCE_ACCEPT_ATTR = ".jpg,.jpeg,.png,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.pub,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-publisher";
// MIME sanity check for the four types browsers report reliably. Office
// formats (.doc/.docx/.xls/.xlsx/.ppt/.pptx/.pub) are deliberately left out
// of this map: too many browsers/OSes report inconsistent or empty MIME
// types for them, so the extension check above is all we rely on there.
const EVIDENCE_MIME_HINTS = { ".jpg":["image/jpeg"], ".jpeg":["image/jpeg"], ".png":["image/png"], ".pdf":["application/pdf"] };
// Tracks the in-flight state of the one explicit, awaited persist call each
// evidence add/remove makes (see persistEvidenceNow) — evidence deliberately
// does NOT rely solely on the app's normal fire-and-forget background save
// queue, because a 15MB upload failing silently over a slow connection would
// otherwise look identical to a successful one. Keyed by evidenceKeyFor(...).
let evidenceUploadStatus = {};
let evidenceProgressHook = null;   // set while an evidence save is running; receives {name,index,count,loaded,total}
function kbText(n){ return n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB"; }
function updateEvidenceProgressUI(st){
  const t = document.getElementById("evProgText"), bar = document.getElementById("evProgBar");
  if(t && st.text) t.textContent = st.text;
  if(bar) bar.style.width = (st.pct||0) + "%";
}
function evidenceWritable(){
  if(FY !== CURRENT_FY){
    showFlash(`You're viewing FY ${FY} (read-only). Switch to the current year (${CURRENT_FY}) to make changes.`, "err");
    return false;
  }
  return true;
}
function persistEvidenceNow(username, packageType, rec){
  const key = evidenceKeyFor(username, packageType);
  CACHE[key] = rec;
  const st = { state:"uploading", pct:0, text:"" };
  evidenceUploadStatus[key] = st;
  evidenceProgressHook = p=>{
    st.pct = p.total ? Math.round(p.loaded / p.total * 100) : 0;
    st.text = `Uploading "${p.name}"` + (p.count>1 ? ` (file ${p.index} of ${p.count})` : "") + ` — ${st.pct}% (${kbText(p.loaded)} of ${kbText(p.total)})`;
    updateEvidenceProgressUI(st);
  };
  window.onbeforeunload = ()=>"An evidence upload is still in progress. If you leave now it will not be saved.";
  renderView(USERS[SESSION]);
  return persistKeyToSupabase(key, rec).then(()=>{
    delete evidenceUploadStatus[key];
    evidenceProgressHook = null; window.onbeforeunload = null;
    renderView(USERS[SESSION]);
  }).catch(e=>{
    evidenceProgressHook = null; window.onbeforeunload = null;
    console.error("Evidence save failed:", e);
    evidenceUploadStatus[key] = {state:"error", message: (e && e.message) || "Upload failed — check your connection and try again."};
    showFlash(`Evidence NOT saved — ${(e && e.message) || "check your connection"}. Use Retry on the evidence card.`, "err");
    renderView(USERS[SESSION]);
  });
}
function retryEvidenceSave(username, packageType){
  persistEvidenceNow(username, packageType, getEvidence(username, packageType));
}
function onEvidenceFileSelected(packageType, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!evidenceWritable()){ inputEl.value = ""; return; }
  const ext = "." + (file.name.split(".").pop()||"").toLowerCase();
  if(!EVIDENCE_ALLOWED_EXT.includes(ext)){
    showFlash(`"${file.name}" isn't an allowed file type. Evidence must be JPG, PNG, PDF, Word, Excel, PowerPoint or Publisher.`, "err");
    inputEl.value = "";
    return;
  }
  const mimeHints = EVIDENCE_MIME_HINTS[ext];
  if(mimeHints && file.type && !mimeHints.includes(file.type)){
    showFlash(`"${file.name}" doesn't look like a genuine ${ext.slice(1).toUpperCase()} file (its reported type is "${file.type}"). Check the file before attaching it.`, "err");
    inputEl.value = "";
    return;
  }
  if(file.size > EVIDENCE_MAX_BYTES){
    showFlash(`"${file.name}" is too large (${Math.round(file.size/1024/1024*10)/10}MB) — each evidence file must stay under ${Math.round(EVIDENCE_MAX_BYTES/1024/1024)}MB.`, "err");
    inputEl.value = "";
    return;
  }
  const rec = getEvidence(SESSION, packageType);
  if(rec.files.length >= EVIDENCE_MAX_FILES){
    showFlash(`Maximum ${EVIDENCE_MAX_FILES} evidence files here. Remove one first.`, "err");
    inputEl.value = "";
    return;
  }
  if(rec.files.some(f=>f.name.toLowerCase()===file.name.toLowerCase())){
    showFlash(`"${file.name}" is already attached to this submission. Remove the existing one first if you want to replace it.`, "err");
    inputEl.value = "";
    return;
  }
  const currentTotal = rec.files.reduce((sum,f)=>sum+(f.size||0), 0);
  if(currentTotal + file.size > EVIDENCE_MAX_TOTAL_BYTES){
    showFlash(`Adding "${file.name}" would put this submission's evidence over the ${Math.round(EVIDENCE_MAX_TOTAL_BYTES/1024/1024)}MB total limit (currently ${Math.round(currentTotal/1024/1024)}MB used). Remove a file or attach a smaller one.`, "err");
    inputEl.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = function(){
    rec.files.push({name:file.name, dataUrl:reader.result, size:file.size, uploadedAt: todayISO()});
    void persistEvidenceNow(SESSION, packageType, rec);
  };
  reader.readAsDataURL(file);
}
async function onRemoveEvidenceFile(packageType, idx){
  if(!evidenceWritable()) return;
  const rec = getEvidence(SESSION, packageType);
  const [removed] = rec.files.splice(idx,1);
  await persistEvidenceNow(SESSION, packageType, rec);
  // The line above only resyncs the evidence_files metadata rows to match
  // the trimmed list; it never deletes the removed file's actual object out
  // of Supabase Storage, so do that explicitly or it sits there forever,
  // still counting against the bucket's real usage.
  if(removed && BACKEND.available()){
    const path = removed.storagePath || `${idFor(SESSION)}/${FY}/${packageType}/${removed.name}`;
    try{ await BACKEND.evidenceRemove(path); }
    catch(e){ console.error("Failed to remove evidence file from storage:", e); }
  }
}
async function onDownloadEvidence(username, packageType, idx){
  const rec = getEvidence(username, packageType);
  const f = rec.files[idx];
  if(!f) return;
  // A file added earlier in THIS session still has its data in memory —
  // no round trip needed. Anything hydrated from Supabase (a different
  // login, a supervisor/admin viewing someone else's record, or this same
  // record reopened after a refresh) only ever carries a storage path, so
  // it has to be fetched via a short-lived signed URL instead.
  if(f.dataUrl){
    const a = document.createElement("a");
    a.href = f.dataUrl; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  if(!BACKEND.available()){ showFlash("No backend connected — nothing to fetch.", "err"); return; }
  const path = f.storagePath || `${idFor(username)}/${FY}/${packageType}/${f.name}`;
  const { url: signedUrl, error } = await BACKEND.evidenceLink(path, 60);
  if(error || !signedUrl){
    showFlash(`Couldn't open "${f.name}" — ${(error && error.message) || "the file may be missing from storage"}.`, "err");
    return;
  }
  window.open(signedUrl, "_blank");
}

      ${status && status.state==="error"?`<div class="status-note warn">${esc(status.message)} <button class="btn btn-ghost" style="padding:2px 10px;margin-left:6px" onclick="retryEvidenceSave('${username}','${packageType}')">Retry</button></div>`:""}

function onFolderSearchFilter(inputEl){
  // filters rows/pills by name or personal number without re-rendering the view,
  // so the search box never loses focus or cursor position while typing
  const q = inputEl.value.trim().toLowerCase();
  const card = inputEl.closest(".card");
  if(!card) return;
  const visibleDepts = new Set();
  card.querySelectorAll("[data-search]").forEach(el=>{
    const match = !q || el.getAttribute("data-search").includes(q);
    el.style.display = match ? "" : "none";
    if(match) visibleDepts.add(el.getAttribute("data-dept"));
  });
  card.querySelectorAll("[data-dept-header]").forEach(headerEl=>{
    headerEl.style.display = visibleDepts.has(headerEl.getAttribute("data-dept-header")) ? "" : "none";
  });
  // drill-down groups (SPAS A/B sections, department folders): while searching,
  // force every group open regardless of collapsed state so matches are visible;
  // once the search is cleared, restore each group to its actual expanded/collapsed state.
  card.querySelectorAll("[data-group]").forEach(el=>{
    el.style.display = q ? "" : (el.getAttribute("data-expanded")==="true" ? "" : "none");
  });
}

// Who a CPAC Finalize viewer can record outcomes for, and why. Three roles
// share this tab, each scoped differently:
//   - CECM: everyone in their own department (a plain department-field
//     match) - the CECM oversees the whole department, which can contain
//     several COs, each with a narrower slice (see below).
//   - Chief Officer: only officers in their own department AND their own
//     section/unit - a department can have multiple COs, each responsible
//     for a different section/unit within it, so a CO's list is strictly
//     narrower than the CECM's department-wide one, not the same list.
//   - Authorized Officer: only officers for whom the AO is the DIRECT
//     supervisor (their one-hop reports, not a wider chain or department).
// A person holding more than one of these tags (CO and CECM are just
// descriptive title tags, not mutually exclusive per the admin form) sees
// the union of whichever scopes apply to them.
function getCPACScopedOfficers(me){
  const set = new Set();
  Object.keys(USERS).forEach(uname=>{
    if(me.isCECM && cecmCoversOfficer(SESSION, uname)) set.add(uname);
    if(me.isChiefOfficer && coCoversOfficer(SESSION, uname)) set.add(uname);
  });
  if(me.isAuthorizedOfficer){
    Object.keys(USERS).forEach(uname=>{
      const u = USERS[uname];
      if(u && u.supervisorUsername===SESSION && !isSpecialAccount(u)) set.add(uname);
    });
  }
  return [...set];
}
function getCPACScopeDescription(me){
  const parts = [];
