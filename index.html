function coDeptChoices(me){
  if(me.isSystemAdmin){
    const seen = new Map();   // one entry per spelling-insensitive department name
    Object.values(USERS).forEach(u=>{ const k = normTxt(u.department); if(k && !seen.has(k)) seen.set(k, String(u.department).replace(/\s+/g," ").trim()); });
    return [...seen.values()].sort((a,b)=>a.localeCompare(b));
  }
  return me.department ? [me.department] : [];
}
function coDistinctValues(dept, field){
  const nd = normTxt(dept);
  return [...new Set(Object.values(USERS).filter(u=>normTxt(u.department)===nd).map(u=>u[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
}
function buildCoAreasHtml(me){
  const areas = adminForm.coAreas || [];
  const depts = coDeptChoices(me);
  const blocks = areas.map((a,i)=>{
    const dopts = [...depts];
    if(a.department && !dopts.some(d=>normTxt(d)===normTxt(a.department))) dopts.push(a.department);
    const pickList = (kind, field, chosen)=>{
      const vals = a.department ? coDistinctValues(a.department, field) : [];
      chosen.forEach(v=>{ if(!vals.some(x=>normTxt(x)===normTxt(v))) vals.push(v); });
      if(!vals.length) return `<div style="font-size:12px;color:var(--muted)">No ${kind==="directorate"?"directorates":"units / sections"} are defined for this department yet.</div>`;
      return `<div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px">${vals.map(v=>`<label style="font-size:13px"><input type="checkbox" class="coa_${kind}_${i}" value="${esc(v)}" ${chosen.some(x=>normTxt(x)===normTxt(v))?"checked":""}/> ${esc(v)}</label>`).join("")}</div>`;
    };
    return `<div data-coarea="${i}" style="border:1px solid var(--line,#d9ded9);border-radius:8px;padding:10px 12px;margin-top:8px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="coa_dept_${i}" onchange="onCoAreaDeptChange(${i})" style="max-width:320px">
          <option value="">— choose department —</option>
          ${dopts.map(d=>`<option value="${esc(d)}" ${normTxt(d)===normTxt(a.department)?"selected":""}>${esc(d)}</option>`).join("")}
        </select>
        <button type="button" class="link-btn" style="color:var(--danger)" onclick="onRemoveCoArea(${i})">Remove</button>
      </div>
      <div class="checks" style="margin-top:8px">
        <label><input type="radio" name="coa_mode_${i}" value="department" ${a.mode==="department"?"checked":""} onchange="onCoAreaModeChange()"/> Whole department</label>
        <label><input type="radio" name="coa_mode_${i}" value="directorate" ${a.mode==="directorate"?"checked":""} onchange="onCoAreaModeChange()"/> By directorates</label>
        <label><input type="radio" name="coa_mode_${i}" value="unit" ${a.mode==="unit"?"checked":""} onchange="onCoAreaModeChange()"/> By units / sections</label>
      </div>
      ${a.mode==="directorate" ? pickList("directorate","directorate",a.directorates||[]) : ""}
      ${a.mode==="unit" ? pickList("unit","sectionUnit",a.units||[]) : ""}
      ${a.mode==="department" && a.department ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">Sees every officer in ${esc(a.department)}, including any directorate or unit added later.</div>` : ""}
    </div>`;
  }).join("");
  return `<div id="coAreasPanel" style="grid-column:1/-1;margin-top:6px">
    <label class="field-label">Chief Officer — areas of responsibility</label>
    <div style="font-size:11.5px;color:var(--muted)">Decides which officers this CO sees in Reports and CPAC Finalize, whoever those officers report to. For each department choose the whole department, or only certain directorates, or only certain units / sections. A CO can hold several departments. With no area added, this CO sees nobody.</div>
    ${blocks}
    <div style="margin-top:8px"><button type="button" class="btn btn-ghost" onclick="onAddCoArea()">+ Add a department</button></div>
  </div>`;
}
function readCoAreasFromDOM(){
  if(!document.getElementById("coAreasPanel")) return (adminForm && adminForm.coAreas) || [];
  const out = [];
  document.querySelectorAll("[data-coarea]").forEach(b=>{
    const i = b.getAttribute("data-coarea");
    const dept = document.getElementById("coa_dept_"+i).value;
    const mode = (document.querySelector(`input[name="coa_mode_${i}"]:checked`)||{}).value || "department";
    const pick = (kind)=>[...document.querySelectorAll(`.coa_${kind}_${i}:checked`)].map(x=>x.value);
    const prev = ((adminForm && adminForm.coAreas) || [])[+i] || {};
    out.push({ id: prev.id, department: dept, mode,
      directorates: mode==="directorate" ? pick("directorate") : [],   // switching mode drops the other list
      units: mode==="unit" ? pick("unit") : [] });
  });
  return out;
}
function onToggleCO(checked){
  if(checked) onSuggestPCTrack();
  const me = USERS[SESSION];
  readAdminFormFromDOM(me);
  if(checked && !adminForm.coAreas.length){
    const d = adminForm.department || (coDeptChoices(me)[0]) || "";
    if(d) adminForm.coAreas = [{ department:d, mode:"department", directorates:[], units:[] }];
  }
  renderView(me);
}
function onAddCoArea(){
  const me = USERS[SESSION];
  readAdminFormFromDOM(me);
  const used = new Set(adminForm.coAreas.map(a=>normTxt(a.department)));
  const next = coDeptChoices(me).find(d=>!used.has(normTxt(d))) || "";
  adminForm.coAreas.push({ department:next, mode:"department", directorates:[], units:[] });
  renderView(me);
}
function onRemoveCoArea(i){
  const me = USERS[SESSION];
  readAdminFormFromDOM(me);
  adminForm.coAreas.splice(i,1);
  renderView(me);
}
function onCoAreaModeChange(){ const me = USERS[SESSION]; readAdminFormFromDOM(me); renderView(me); }
function onCoAreaDeptChange(i){
  const me = USERS[SESSION];
  readAdminFormFromDOM(me);
  if(adminForm.coAreas[i]){ adminForm.coAreas[i].directorates = []; adminForm.coAreas[i].units = []; }
  renderView(me);
}
// Admin overview: who is not covered by any CO, and who is covered by more than one.
function buildCoCoverageCard(scoped){
  if(!CO_SCOPE_READY) return "";
  const byDept = {};
  const cosAll = Object.keys(USERS).filter(u=>USERS[u].isChiefOfficer && !USERS[u].isCPRC);
  scoped.forEach(([un,u])=>{
    if(!u.department || isSpecialAccount(u) || u.isChiefOfficer || u.isCECM) return;
    const k = normTxt(u.department);
    (byDept[k] = byDept[k] || { name:u.department, staff:[] }).staff.push(un);
  });
  const rows = Object.keys(byDept).sort().map(k=>{
    const d = byDept[k];
    const cos = cosAll.filter(c=>coAreasOf(c).some(a=>normTxt(a.department)===k));
    if(!cos.length) return null;
    const none = [], many = [];
    d.staff.forEach(un=>{
      const n = cos.filter(c=>coCoversOfficer(c, un)).length;
      if(n===0) none.push(un); else if(n>1) many.push(un);
    });
    const list = (arr)=> arr.length ? esc(arr.slice(0,6).map(un=>USERS[un].name + (USERS[un].sectionUnit?` (${USERS[un].sectionUnit})`:"")).join(", ")) + (arr.length>6?` and ${arr.length-6} more`:"") : "—";
    return `<tr><td>${esc(d.name)}</td><td>${esc(cos.map(c=>USERS[c].name).join(", "))}</td>
      <td style="${none.length?"color:var(--danger)":""}">${none.length? `<b>${none.length}</b> — `:""}${list(none)}</td>
      <td>${many.length? `<b>${many.length}</b> — `:""}${list(many)}</td></tr>`;
  }).filter(Boolean);
  if(!rows.length) return "";
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-head"><div><div class="card-title">Chief Officer coverage</div>
      <div class="card-sub">For departments that have a CO. An officer covered by no CO has nobody to finalize their CPAC outcome (the CECM still sees the whole department). Fix by adding the area to a CO's account.</div></div></div>
    <div class="card-body"><div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>Department</th><th>Chief Officers</th><th>Not covered by any CO</th><th>Covered by more than one CO</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div></div>
  </div>`;
}
function onToggleAOCheckbox(checked){
  // Purely a live-UI convenience (mirrors the hard clear that already
  // happens in readAdminFormFromDOM on save) - the AO reports to no one, so
  // disable the field and blank it out the moment the box is ticked.
  const sel = document.getElementById("af_supervisor");
  if(!sel) return;
  sel.disabled = checked;
  if(checked) sel.value = "";
}
function onSuggestPCTrack(){
  const radio = document.querySelector('input[name="af_reportingTrack"][value="pc"]');
  if(radio) radio.checked = true;
}
function onEditUser(uname){
  const me = USERS[SESSION];
  if(!me.isSystemAdmin && USERS[uname].department !== me.department){
    showFlash("You can only manage staff within your own department.", "err");
    return;
  }
  const u = USERS[uname];
  adminEditing = uname;
  adminForm = { username:uname, password:u.password, name:u.name, personalNo:u.personalNo, designation:u.designation,
    department:u.department, directorate:u.directorate||"", sectionUnit:u.sectionUnit||"", termsOfService:u.termsOfService||"",
    subcounty:u.subcounty||"", jobGroup:u.jobGroup||"", dutyStation:u.dutyStation||"",
    isSupervisor:!!u.isSupervisor, isChiefOfficer:!!u.isChiefOfficer, isCECM:!!u.isCECM, isDirector:!!u.isDirector, isDeptAdmin:!!u.isDeptAdmin, isSystemAdmin:!!u.isSystemAdmin,
    isCPRC:!!u.isCPRC, isAuthorizedOfficer:!!u.isAuthorizedOfficer, reportingTrack:u.reportingTrack||(u.usesFormA?"spas_a":"spas_b"), supervisorUsername:u.supervisorUsername||"",
    coAreas: coAreasOf(uname).filter(a=>me.isSystemAdmin || normTxt(a.department)===normTxt(me.department)).map(a=>({ id:a.id, department:a.department, mode:a.mode, directorates:[...a.directorates], units:[...a.units] })) };
  adminSubTab = "staff"; adminStaffSubTab = "add";
  renderView(USERS[SESSION]);
}
function onCancelAdminEdit(){
  adminEditing = null; adminForm = blankAdminForm();
  adminStaffSubTab = "all";
  renderView(USERS[SESSION]);
}
async function onSaveAdminForm(){
  const me = USERS[SESSION];
  readAdminFormFromDOM(me);
  if(!adminForm.username || !adminForm.password || !adminForm.name){
    showFlash("Username, password and name are required.", "err");
    return;
  }
  if(!adminEditing && USERS[adminForm.username]){
    showFlash("That username already exists.", "err");
    return;
  }
  const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if(!adminEditing && !uuidPattern.test(adminForm.supabaseUid)){
    showFlash(`Create the login in Supabase first (Authentication → Add User, email "${emailFor(adminForm.username||"...")}"), then paste its User UID into the field above — that's what lets this account actually sign in.`, "err");
    return;
  }
  if(!me.isSystemAdmin && !adminForm.department){
    showFlash("Department is required.", "err");
    return;
  }
  if(!me.isSystemAdmin && adminForm.department !== me.department){
    showFlash("You can only create or edit staff within your own department.", "err");
    return;
  }
  // There is exactly one Authorized Officer account - the Governor. Block
  // creating or flagging a second one rather than silently allowing two AO
  // accounts to exist at once; the admin must first un-tick the existing
  // account's Authorized Officer box before moving the flag elsewhere.
  if(adminForm.isAuthorizedOfficer){
    const existingAO = Object.entries(USERS).find(([uname,u])=>u.isAuthorizedOfficer && uname!==adminForm.username);
    if(existingAO){
      showFlash(`${existingAO[1].name} (${existingAO[0]}) is already flagged Authorized Officer — there can only be one. Un-tick it there first if you're moving the role.`, "err");
      return;
    }
  }
  if(adminForm.isChiefOfficer){
    const seenDepts = new Set();
    for(const a of adminForm.coAreas){
      if(!a.department){ showFlash("Pick a department for every area of responsibility, or remove the empty one.", "err"); return; }
      const k = normTxt(a.department);
      if(seenDepts.has(k)){ showFlash(`${a.department} appears twice in the areas of responsibility. Use one entry per department.`, "err"); return; }
      seenDepts.add(k);
      if(a.mode==="directorate" && !a.directorates.length){ showFlash(`Tick at least one directorate for ${a.department}, or choose "Whole department".`, "err"); return; }
      if(a.mode==="unit" && !a.units.length){ showFlash(`Tick at least one unit/section for ${a.department}, or choose "Whole department".`, "err"); return; }
      if(!me.isSystemAdmin && k!==normTxt(me.department)){ showFlash("You can only assign areas within your own department.", "err"); return; }
    }
  }
  const profileRow = {
    username: adminForm.username, name: adminForm.name, personal_no: adminForm.personalNo,
    designation: adminForm.designation, department: adminForm.department, directorate: adminForm.directorate,
    section_unit: adminForm.sectionUnit, terms_of_service: adminForm.termsOfService,
    subcounty: adminForm.subcounty, job_group: adminForm.jobGroup, duty_station: adminForm.dutyStation,
    is_supervisor: adminForm.isSupervisor, is_chief_officer: adminForm.isChiefOfficer, is_cecm: adminForm.isCECM, is_director: adminForm.isDirector,
    reporting_track: adminForm.reportingTrack,
    is_dept_admin: adminForm.isDeptAdmin, is_system_admin: adminForm.isSystemAdmin,
    is_cprc: adminForm.isCPRC, is_authorized_officer: adminForm.isAuthorizedOfficer,
    supervisor_id: adminForm.supervisorUsername ? idFor(adminForm.supervisorUsername) : null,
  };
  if(!adminEditing){
    // The Supabase login itself (email+password) still needs a privileged, server-side
    // step (an Edge Function, or this manual dashboard step) since the client-side public
    // key can't create other users' logins. But by requiring the resulting UID up front
    // and using it directly as the profile's id, the two records are correctly linked
    // from the moment this row is created — no separate fix-up step needed afterward.
    profileRow.id = adminForm.supabaseUid;
    const { error } = await BACKEND.profileInsert(profileRow);
    if(error){ showFlash("Could not create the profile: " + error.message, "err"); return; }
    USERNAME_TO_ID[adminForm.username] = profileRow.id; ID_TO_USERNAME[profileRow.id] = adminForm.username;
    showFlash("Staff account created and linked — ready to sign in immediately.");
  } else {
    const { error } = await BACKEND.profileUpdate(idFor(adminForm.username), profileRow);
    if(error){ showFlash("Could not update the profile: " + error.message, "err"); return; }
    showFlash("Staff record updated.");
  }
  // Chief Officer areas of responsibility (own table). Un-ticking CO clears them.
  {
    const un = adminForm.username, uid = idFor(un);
    const existing = coAreasOf(un).filter(a=>me.isSystemAdmin || normTxt(a.department)===normTxt(me.department));
    const wanted = adminForm.isChiefOfficer ? adminForm.coAreas : [];
    if(CO_SCOPE_READY || wanted.length){
      const r = await BACKEND.coScopeReplace(uid, existing.map(a=>a.id).filter(Boolean), wanted);
      if(r.error){
        showFlash("The account was saved, but the Chief Officer areas could not be saved: " + r.error.message + (CO_SCOPE_READY ? "" : " (the co_scope database update has not been run yet)"), "err");
      } else {
        const keep = coAreasOf(un).filter(a=>!existing.includes(a));
        const saved = (r.rows||[]).map(x=>({ id:x.id, department:x.department, mode:x.mode, directorates:x.directorates||[], units:x.units||[] }));
        const all = keep.concat(saved);
        if(all.length) CO_SCOPE[un] = all; else delete CO_SCOPE[un];
      }
    }
  }
  USERS[adminForm.username] = {
    password: null, name: adminForm.name, personalNo: adminForm.personalNo,
    designation: adminForm.designation, department: adminForm.department, directorate: adminForm.directorate,
    sectionUnit: adminForm.sectionUnit, termsOfService: adminForm.termsOfService,
    subcounty: adminForm.subcounty, jobGroup: adminForm.jobGroup, dutyStation: adminForm.dutyStation,
    isSupervisor: adminForm.isSupervisor, isChiefOfficer: adminForm.isChiefOfficer, isCECM: adminForm.isCECM, isDirector: adminForm.isDirector,
    reportingTrack: adminForm.reportingTrack, usesFormA: adminForm.reportingTrack==="spas_a", usesPC: adminForm.reportingTrack==="pc",
    isDeptAdmin: adminForm.isDeptAdmin, isSystemAdmin: adminForm.isSystemAdmin,
    isCPRC: adminForm.isCPRC, isAuthorizedOfficer: adminForm.isAuthorizedOfficer,
    supervisorUsername: adminForm.supervisorUsername || null,
  };
  adminEditing = null; adminForm = blankAdminForm();
  adminStaffSubTab = "all";
  renderView(USERS[SESSION]);
}
function onRemoveUser(uname){
  const me = USERS[SESSION];
  if(uname===SESSION){ showFlash("You can't delete the account you're signed in as.", "err"); return; }
  if(!me.isSystemAdmin && USERS[uname].department !== me.department){
    showFlash("You can only remove staff within your own department.", "err");
    return;
  }
  if(!confirm(`Remove staff account "${USERS[uname].name}"? Their plan and achievement history is kept but they will lose access.`)) return;
  delete USERS[uname];
  setData("users", USERS);
  showFlash("Staff account removed.");
  if(adminEditing===uname){ adminEditing=null; adminForm=blankAdminForm(); }
  renderView(USERS[SESSION]);
}

/* --------------------------------- boot --------------------------------- */
renderApp();
</script>
<script>
// Installable-app support (PWA). Registers the service worker only over https
// (or localhost); harmless no-op anywhere it isn't supported.
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW registration skipped:", e)); });
}
</script>
<script>
// Installed app only: refresh the data when the app returns to the foreground
// after at least a minute away. In a normal browser tab nothing changes.
(function(){
  const isInstalledApp = ()=> (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  let hiddenAt = null;
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden"){ hiddenAt = Date.now(); return; }
    if(!isInstalledApp() || !hiddenAt || Date.now() - hiddenAt < 60000) return;
    hiddenAt = null;
    if(typeof refreshFromServerIfIdle === "function") refreshFromServerIfIdle();
  });
})();
// "New version available" banner. Host-independent: it just re-fetches this
// same page (relative URL) and compares the app-version meta tag. Works on
// any web server; no GitHub, Supabase or service-worker dependency.
(function(){
  if(!window.fetch) return;
  let shown = false, lastCheck = 0;
  function showBanner(v){
    if(shown) return; shown = true;
    const b = document.createElement("div");
    b.setAttribute("role","status");
    b.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#0F3D2E;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;justify-content:space-between;font:14px/1.35 system-ui,sans-serif";
    b.innerHTML = '<span>A new version ('+v+') is available.</span>';
    const btn = document.createElement("button");
    btn.textContent = "Update now";
    btn.style.cssText = "background:#fff;color:#0F3D2E;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap";
    btn.onclick = ()=>location.reload();
    b.appendChild(btn);
    document.body.appendChild(b);
  }
  async function check(){
    const now = Date.now();
    if(now - lastCheck < 5*60*1000) return; // at most every 5 minutes
    lastCheck = now;
    try{
      const url = location.pathname + "?vcheck=" + now; // unique query: never served from any cache
      const r = await fetch(url, {cache:"no-store", credentials:"same-origin"});
      if(!r.ok) return;
      const m = (await r.text()).match(/<meta\s+name="app-version"\s+content="([^"]+)"/);
      if(m && APP_VERSION && m[1] !== APP_VERSION) showBanner(m[1]);
    }catch(e){ /* offline: ignore */ }
  }
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") check(); });
  window.addEventListener("online", check);
  window.addEventListener("load", ()=>setTimeout(check, 4000));
  setInterval(check, 15*60*1000);
})();
</script>
