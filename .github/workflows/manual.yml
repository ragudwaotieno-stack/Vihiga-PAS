name: Build SPMS Android APK

on:
  push:
    branches:
      - test/ao-progress-map
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get SPMS source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        shell: bash
        run: |
          mkdir -p www
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|android/*|www/*|.git/*)
                continue ;;
            esac
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done < <(git ls-files -z)

          test -f www/index.html

      - name: Configure Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          npx cap init "Vihiga SPMS" \
            "ke.go.vihiga.spms" \
            --web-dir www

      - name: Create Android project
        run: npx cap add android

        
      - name: Generate Vihiga Android launcher icons
        run: |
          npm install --save-dev @capacitor/assets@3 sharp

          mkdir -p assets

          node --input-type=module <<'NODE'
          import sharp from 'sharp';

          await sharp('icons/icon-512.png')
            .resize(1024, 1024, {
              fit: 'contain',
              background: '#ffffff'
            })
            .png()
            .toFile('assets/icon.png');
          NODE

          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF'

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Vihiga-SPMS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
